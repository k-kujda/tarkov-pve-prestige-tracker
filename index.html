function viewRaid() {
  if (!S.logSync) return '<div class="panel">Sync your progress first (“Sync from game”) so the planner knows which quests you have accepted.</div>' + viewRaidPlanner();
  if (S.raid && S.raid.debrief) return viewRaidDebrief();
  return S.raid ? viewRaidInProgress() : viewRaidPlanner();
}

// After a raid: the logs say which quests finished, but not which objectives — ask.
function viewRaidDebrief() {
  const r = S.raid, key = r.map;
  const quests = r.quests.map(id => D.byId[id]).filter(Boolean);
  const finished = quests.filter(t => S.tasks[t.id] === 'done');
  const open = quests.filter(t => S.tasks[t.id] !== 'done');
  const blocks = open.map(t => `<div class="sec"><b>${esc(t.name)}</b> <span class="muted small">${esc(t.trader.name)}</span>${objectiveTicks(t, key) || '<div class="small muted">No in-raid objectives on this map.</div>'}</div>`).join('');
  return `<div class="panel"><div class="row"><b>Raid debrief: ${esc(mapName(key))}</b><span class="spacer"></span>
      <button class="primary" data-act="raidClose">Save &amp; close</button></div>
    <div class="small muted">Tick the objectives you completed this raid. Quests the game logs show as finished are already handled.</div>
    ${finished.length ? `<div class="sec small"><span class="badge ok">completed ✓</span> ${finished.map(t => esc(t.name)).join(' · ')}</div>` : ''}
    ${blocks || '<div class="sec muted">Every quest from this raid is completed.</div>'}</div>`;
}

function viewRaidPlanner() {
  const ranked = rankedMaps();
  const lockedMaps = tourLocks().maps;
  if (!S.ui.raidMap && ranked.length && !lockedMaps.has(ranked[0].key)) S.ui.raidMap = ranked[0].key;
  const rows = ranked.map((p, i) => `<tr class="${p.key === S.ui.raidMap ? 'on' : ''}">
      <td>${i === 0 && !lockedMaps.has(p.key) ? '⭐ ' : ''}<b>${esc(mapName(p.key))}</b>${lockedMaps.has(p.key)
        ? ` <span class="badge gate" title="Not in the location menu yet — Tour: ${esc(lockedMaps.get(p.key))}. You can still transit in.">locked</span>` : ''}</td>
      <td><b>${p.finish.length}</b> <span class="muted small">(${p.finish.filter(t => S.active[t.id]).length} accepted)</span></td>
      <td>${p.progress.length}</td><td>${p.objectives}</td>${squadMembers().length ? `<td>${p.squad}</td>` : ''}
      <td>${p.finish.reduce((n, t) => n + (t.experience || 0), 0).toLocaleString()}</td>
      <td><button data-act="raidPick" data-id="${esc(p.key)}" ${p.key === S.ui.raidMap ? 'class="primary"' : ''}>Plan</button></td></tr>`).join('');
  let plan = '';
  const key = S.ui.raidMap;
  if (key) {
    const p = mapPlan(key);
    const quests = [...p.finish, ...p.progress];
    const accepted = quests.filter(t => S.active[t.id] || squadWith(t).length);
    const notAccepted = quests.filter(t => !accepted.includes(t));
    // Accepted quests are pre-selected unless they need a key you don't have and can't pick up on this map.
    if (!raidSelection || raidSelection.key !== key) raidSelection = { key, ids: new Set(accepted.filter(t => keysReady(t, key)).map(t => t.id)) };
    const row = t => {
      const keyState = questKeyState(t, key);
      const fit = p.finish.includes(t) ? (keyState === 'missing' ? '<span class="badge lock" title="Every objective is on this map, but you need a key you haven\'t got">needs key</span>'
        : keyState === 'pickup' ? '<span class="badge ok" title="The key spawns on this map every raid — the route picks it up first">can finish — grab the key</span>'
          : '<span class="badge ok">can finish</span>') : '<span class="badge">progress</span>';
      return `<div class="obj"><input type="checkbox" id="rs-${t.id}" data-act="raidSel" data-id="${t.id}" ${raidSelection.ids.has(t.id) ? 'checked' : ''}>
        <div><div><label for="rs-${t.id}" style="cursor:pointer"><b>${esc(t.name)}</b></label> <span class="muted small">${esc(t.trader.name)}</span>
          ${fit}
          ${squadWith(t).map(n => `<span class="badge squad">👥 ${esc(n)}</span>`).join('')}
          ${S.active[t.id] ? '' : S.tasks[t.id] || !factionOk(t) || taskState(t).status !== 'available' ? `<span class="badge squad">for squad</span>`
            : '<span class="badge gate" title="Not accepted yet — pick it up from the trader before the raid">accept first</span>'}</div>
          ${objectiveTicks(t, key)}${questKeysHtml(t, key)}</div></div>`;
    };
    // Quests on this map you can't take yet only because of the trader (locked, or loyalty / reputation too low).
    const blocked = D.tasks.filter(t => factionOk(t) && !S.tasks[t.id] && !S.active[t.id] && !isSkipped(t) && !quests.includes(t)
      && taskState(t).traderOnly && mapFit(t, key));
    const blockedRow = t => `<div class="obj"><span style="width:16px;flex:none">🔒</span><div><div><b>${esc(t.name)}</b> <span class="muted small">${esc(t.trader.name)}</span>
      ${taskState(t).reasons.map(r => `<span class="badge lock">${esc(r)}</span>`).join('')}</div>
      <div class="small muted">${t.objectives.filter(o => !o.optional && objOnMap(o, t, key)).map(o => esc(o.description)).join(' · ')}</div></div></div>`;
    plan = `<div class="panel"><div class="row"><b>${esc(mapName(key))}</b><span class="spacer"></span>
        <button class="primary" data-act="raidStart" ${raidSelection.ids.size ? '' : 'disabled'}>Start raid with ${raidSelection.ids.size} quest${raidSelection.ids.size === 1 ? '' : 's'}</button></div>
      <div class="small muted">Accepted quests are pre-selected, except ones that need a key you haven't ticked (and that doesn't spawn here every raid).
        “Can finish” = every remaining in-raid objective can be done on this map. Tick objectives you've already done — the game logs only record whole quests, not single objectives.</div>
      <div class="sec"><h4>Accepted (${accepted.length})</h4>${accepted.map(row).join('') || '<div class="muted small">No accepted quests on this map.</div>'}</div>
      ${foldSection('planNotAccepted', `Not accepted yet — pick up at the trader (${notAccepted.length})`, notAccepted.map(row).join(''), true)}
      ${foldSection('planBlocked', `Can't accept yet — trader locked or loyalty too low (${blocked.length})`, blocked.map(blockedRow).join(''), false)}
      ${bringList(key, [...raidSelection.ids].map(id => D.byId[id]).filter(Boolean))}</div>`;
  }
  return `${setupNudge()}${squadPanel()}<div class="panel"><b>Best maps right now</b> <span class="small muted">— accepted quests count triple; quests you can finish count double.</span>
      <table class="rank"><thead><tr><th>Map</th><th>Can finish</th><th>Can progress</th><th>Objectives</th>${squadMembers().length ? '<th>Squad quests</th>' : ''}<th>XP (finishable)</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="6" class="muted">No quest objectives on any map — sync from game or accept quests.</td></tr>'}</tbody></table></div>
    ${plan}`;
}

// Keys this quest needs on this map that you don't have yet but that spawn every raid.
function keyPickups(t, key) {
  const out = [];
  for (const g of questKeyGroups(t, key)) {
    if (g.some(haveKey)) continue;
    for (const k of g) {
      const ks = D.keySpawns && D.keySpawns[k.id];
      const sp = ks && ks.spawns.find(x => mapKey(x.map) === key);
      if (sp) { out.push({ key: k, spawn: sp, wikiTitle: ks.wikiTitle }); break; }
    }
  }
  return out;
}
const keyWikiLink = title => 'https://escapefromtarkov.fandom.com/wiki/' + encodeURIComponent(title.replace(/ /g, '_'));
const pickupLine = pk => `<label class="objline pickup" title="Ticking this marks the key as owned"><input type="checkbox" data-act="keyToggle" data-id="${pk.key.id}">
  <span>🔑 <b>First: pick up ${esc(pk.key.name)}</b> — guaranteed spawn: ${esc(pk.spawn.note)}${pk.spawn.points.length ? '' : ' (inside a container — no exact map spot)'}</span></label>`;

function objectiveTicks(t, key) {
  const objs = t.objectives.filter(o => !o.optional && !OUT_OF_RAID.has(o.type) && (objOnMap(o, t, key) || objAnywhere(o, t)));
  return keyPickups(t, key).map(pickupLine).join('') + objs.map(o => `<label class="objline ${S.objs[o.id] ? 'done' : ''}"><input type="checkbox" data-act="obj" data-id="${o.id}" ${S.objs[o.id] ? 'checked' : ''}>
    <span>${esc(o.description)}</span></label>`).join('');
}

function questKeyGroups(t, key) {
  const groups = new Map();
  for (const k of t.neededKeys || []) if (!k.map || mapKey(k.map.normalizedName) === key) groups.set(k.keys.map(x => x.id).sort().join('|'), k.keys);
  for (const o of raidObjectives(t)) {
    if (!(objOnMap(o, t, key) || objAnywhere(o, t))) continue;
    for (const g of o.requiredKeys || []) if (g.length) groups.set(g.map(x => x.id).sort().join('|'), g);
  }
  return [...groups.values()];
}
const haveKey = k => (S.have[k.id] || 0) > 0;
// 'none' (no keys needed), 'ok' (you have them), 'pickup' (the missing ones spawn on this map every raid) or 'missing'.
function questKeyState(t, key) {
  const groups = questKeyGroups(t, key);
  if (!groups.length) return 'none';
  const missing = groups.filter(g => !g.some(haveKey)).length;
  if (!missing) return 'ok';
  return keyPickups(t, key).length >= missing ? 'pickup' : 'missing';
}
const keysReady = (t, key) => questKeyState(t, key) !== 'missing';

// A collapsible block whose open/closed state is remembered (S.ui.folds). Empty blocks aren't shown.
function foldSection(id, title, body, openByDefault) {
  if (!body) return '';
  const open = (S.ui.folds || {})[id] ?? openByDefault;
  return `<details class="fold sec" data-fold="${id}" ${open ? 'open' : ''}><summary><h4>${esc(title)}</h4></summary>${body}</details>`;
}

// Key chips next to a quest: click to mark owned; the badge says whether you can do it right now.
function questKeysHtml(t, key) {
  const groups = questKeyGroups(t, key);
  if (!groups.length) return '';
  const state = questKeyState(t, key);
  const chips = groups.map(g => g.map(k => `<span class="item key ${haveKey(k) ? 'have' : 'missing'}" data-act="keyToggle" data-id="${k.id}"
      title="${haveKey(k) ? 'You have this key — click to unmark' : 'Click if you have this key'}">${k.iconLink ? `<img loading="lazy" src="${esc(k.iconLink)}" alt="">` : ''}${esc(k.shortName || k.name)} ${haveKey(k) ? '✓' : '✗'}</span>`).join(' or ')).join(' ');
  const badge = { ok: '<span class="badge ok">🔑 keys ok</span>', pickup: '<span class="badge gate" title="Not in your stash, but it spawns on this map every raid">🔑 pick up in raid</span>',
    missing: '<span class="badge lock">🔑 missing key</span>' }[state];
  return `<div class="keys-line">${badge} ${chips}</div>`;
}

function bringList(key, quests) {
  const items = new Map(), keys = new Map();
  for (const t of quests) {
    for (const o of raidObjectives(t)) {
      if (!(objOnMap(o, t, key) || objAnywhere(o, t))) continue;
      if (o.type === 'plantItem' && o.items && o.items.length) items.set(o.items[0].id, { item: o.items[0], n: (items.get(o.items[0].id) || { n: 0 }).n + (o.count || 1), note: 'plant' });
      if (o.type === 'mark' && o.markerItem) items.set(o.markerItem.id, { item: o.markerItem, n: (items.get(o.markerItem.id) || { n: 0 }).n + 1, note: 'mark' });
    }
    for (const k of t.neededKeys || []) if (!k.map || mapKey(k.map.normalizedName) === key) keys.set(k.keys.map(x => x.id).join('|'), k.keys);
  }
  const loadout = loadoutLines(key, quests);
  if (!items.size && !keys.size && !loadout) return '';
  return `<div class="sec"><h4>Bring</h4>
    ${[...items.values()].map(e => `<span title="${e.note}">${itemChip(e.item, e.n)}</span>`).join('')}

let leafletReady = null, raidMap = null, raidMapKey = null, raidMapEl = null, raidMarkers = null;

// A floor image drawn a few pixels off the map's projection (data/map-transforms.json: Icebreaker's deck images are

function offsetTiles(layer, off) {

    const c = layer.getContainer(), m = layer._map;

// Same projection as tarkov.dev's interactive maps: game (x, z) -> rotated -> affine transform.
function tarkovCRS(def) {

    if (!deg) return latLng;

    transformation: new L.Transformation(def.transform[0], def.transform[1], def.transform[2] * -1, def.transform[3]),
    projection: L.extend({}, L.Projection.LonLat, {
      project: ll => L.Projection.LonLat.project(rotate(ll, def.coordinateRotation)),

// ---------- level transitions (stairs, ramps, ladders, hatches, drops) ----------
// Built from the navmesh by tools/build_transitions.mjs: every place the walkable mesh joins two levels. Shown when
// one end is on the floor being displayed; clicking switches to the other end's floor.
let raidTransitions = null;
const TRANSITION_GLYPH = { stairs: '🪜', ladder: '🪜', ramp: '↗', hatch: '⛶', drop: '⤓', climb: '⤒', elevator: '⇕' };
function drawTransitions() {
  const t = raidTransitions;
  if (!t || !t.list || t.key !== S.raid.map) return;
  const def = D.mapDefs[t.key];
  t.group.clearLayers();
  const floors = hasFloors(def);
  for (const tr of t.list) {
    if (!tr.from || !tr.to) continue;
    const fa = floors ? floorOf(def, tr.from) : GROUND, fb = floors ? floorOf(def, tr.to) : GROUND;
    // On maps with one drawn level, only connectors between real levels (more than a storey apart) are worth a marker.
    if (fa === fb && Math.abs((tr.from.y || 0) - (tr.to.y || 0)) < 2.5) continue;
    let here = tr.from, there = tr.to, other = fb;

    const kind = tr.kind || 'stairs';
    const glyph = TRANSITION_GLYPH[kind] || '⇕';
    const dy = Math.abs((there.y || 0) - (here.y || 0));
    const tip = `<b>${esc(titleCase(kind))}</b> ${up ? 'up' : 'down'} ${dy.toFixed(1)} m${other !== raidFloor || floors ? ` to ${esc(other)}` : ''}${tr.building ? `<br>${esc(tr.building)}` : ''}${floors && other !== raidFloor ? '<br><i>click to show that floor</i>' : ''}`;
    const m = L.marker([here.z, here.x], { zIndexOffset: 200, icon: L.divIcon({ className: 'map-transition', html: `<span>${glyph}<small>${up ? '↑' : '↓'}</small></span>`, iconSize: null, iconAnchor: [9, 9] }) })
      .bindTooltip(tip);
    if (floors && other !== raidFloor) m.on('click', () => { raidFloor = other; render(); });
    t.group.addLayer(m);

}

// ---------- walls from the game's navmesh ----------
// Edges of the walkable area (walls, fences, ledges) for the floor being shown, drawn on a canvas when zoomed in.
// Edges are projected once (zoom 0) and scaled on redraw, so pans and zooms stay quick with ~10⁵ lines.

function makeNavWallsLayer() {
  return window.L.Layer.extend({
    initialize(key) { this._key = key; this._lines = null; this._floorCache = {}; },
    onAdd(map) {
      this._map = map;
      this._canvas = window.L.DomUtil.create('canvas', 'nav-walls leaflet-zoom-hide');
      this._canvas.style.pointerEvents = 'none';
      // own pane above the floor drawings (overlayPane 400), below markers (600)
      const pane = map.getPane('navWalls') || map.createPane('navWalls');
      pane.style.zIndex = 450; pane.style.pointerEvents = 'none';
      pane.appendChild(this._canvas);
      map.on('moveend zoomend resize viewreset', this._redraw, this);
      if (!this._lines) navCall('walls', { map: this._key }).then(r => { this._lines = r.lines; this._redraw(); }).catch(() => {});
      this._redraw();
    },
    onRemove(map) { map.off('moveend zoomend resize viewreset', this._redraw, this); this._canvas.remove(); },
    // Projected segments (zoom-0 pixels) on the given floor: [x1, y1, x2, y2, ...]
    _forFloor(fl) {
      if (this._floorCache[fl]) return this._floorCache[fl];
      const def = D.mapDefs[this._key], L5 = this._lines, out = [];
      for (let i = 0; i < L5.length; i += 5) {
        const mx = (L5[i] + L5[i + 2]) / 2, mz = (L5[i + 1] + L5[i + 3]) / 2;
        if (hasFloors(def) && floorOf(def, { x: mx, y: L5[i + 4] + 0.5, z: mz }) !== fl) continue;
        const a = this._map.project([L5[i + 1], L5[i]], 0), b = this._map.project([L5[i + 3], L5[i + 2]], 0);

    _redraw() {

      window.L.DomUtil.setPosition(c, map.containerPointToLayerPoint([0, 0]));
      c.width = size.x; c.height = size.y;
      const ctx = c.getContext('2d');
      const def = D.mapDefs[this._key];
      if (!this._lines || map.getZoom() < def.maxZoom - 2.5) return;
      const segs = this._forFloor(hasFloors(def) ? raidFloor : GROUND);
      const k = Math.pow(2, map.getZoom()), o = map.getPixelBounds().min;

        const x1 = segs[i] * k - o.x, y1 = segs[i + 1] * k - o.y, x2 = segs[i + 2] * k - o.x, y2 = segs[i + 3] * k - o.y;
        if ((x1 < 0 && x2 < 0) || (y1 < 0 && y2 < 0) || (x1 > size.x && x2 > size.x) || (y1 > size.y && y2 > size.y)) continue;
        ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
      }
      ctx.stroke();
    },
  });
}

// ---------- route planning ----------
// Straight-line routing: there is no walkable-path data, so this orders stops sensibly rather than giving turn-by-turn directions.
const ROUTE_SPEED = 4; // m/s — a mix of sprinting and walking with stamina breaks

// One stop per unfinished in-raid objective with a map position; quest items list every possible spot as a candidate.
function raidStopGroups(key) {
  const groups = [];
  S.raid.quests.map(id => D.byId[id]).filter(Boolean).forEach((t, i) => {
    if (S.tasks[t.id] === 'done') return;
    for (const o of t.objectives) {
      if (o.optional || OUT_OF_RAID.has(o.type) || S.objs[o.id]) continue;
      const cands = (o.points || []).filter(p => mapKey(p.map) === key).map(p => ({ x: p.x, z: p.z, y: p.y, kind: p.kind }));
      if (cands.length) groups.push({ t, o, color: RAID_COLORS[i % RAID_COLORS.length], cands });
    }

  const keyGroups = new Map();
  S.raid.quests.map(id => D.byId[id]).filter(Boolean).forEach(t => {
    if (S.tasks[t.id] === 'done') return;
    for (const pk of keyPickups(t, key)) {
      if (!pk.spawn.points.length) continue;
      if (!keyGroups.has(pk.key.id)) {
        const kg = { t: { id: 'key:' + pk.key.id, name: '🔑 ' + pk.key.name, wikiLink: keyWikiLink(pk.wikiTitle) },
          o: { id: 'key:' + pk.key.id, type: 'pickup', description: `Pick up ${pk.key.name} — ${pk.spawn.note}` },
          color: '#ffd24a', cands: pk.spawn.points.map(p => ({ x: p.x, z: p.z, y: p.y })), keyId: pk.key.id };

}

// Precedence: bit mask of the key groups each group needs visited first.
const needMasks = groups => groups.map(g => (g.needsKeys || []).reduce((m, k) => { const i = groups.findIndex(x => x.keyId === k); return i >= 0 ? m | (1 << i) : m; }, 0));
// Heuristic routes can break precedence while improving: move each key stop in front of its first dependant.
function enforceKeyOrder(stops) {
  for (const ks of stops.filter(st => st.g.keyId)) {
    const ki = stops.indexOf(ks), di = stops.findIndex(st => (st.g.needsKeys || []).includes(ks.g.keyId));
    if (di >= 0 && di < ki) { stops.splice(ki, 1); stops.splice(di, 0, ks); }
  }
}

function raidExtractOptions(key) {
  const f = D.mapFeatures && D.mapFeatures[key];
  const seen = new Set();
  // Transits can end the route too (quests that need one, or picked by hand).
  return [...(f ? f.extracts : []), ...(f ? f.transits : []).map(t => ({ ...t, faction: 'transit' }))].filter(e => e.faction !== 'scav' && !seen.has(e.name) && seen.add(e.name));
}

// Shortest open path from the spawn through one spot of every stop group, ending at the best of the given extracts.
// Exact (Held–Karp over groups × candidate spots) when small enough, otherwise a heuristic with restarts.
const EXACT_ROUTE_LIMIT = 2e7; // ~ DP operations

// Legs crossing a minefield (not sniper zones) cost 3x, so the planner goes around them when there's a reasonable alternative.
let routeMinefields = [];
const cross = (a, b, c) => (b.x - a.x) * (c.z - a.z) - (b.z - a.z) * (c.x - a.x);
const segmentsCross = (p1, p2, q1, q2) => cross(p1, p2, q1) * cross(p1, p2, q2) < 0 && cross(q1, q2, p1) * cross(q1, q2, p2) < 0;
const insidePolygon = (p, poly) => {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {

    if ((a.z > p.z) !== (b.z > p.z) && p.x < (b.x - a.x) * (p.z - a.z) / (b.z - a.z) + a.x) inside = !inside;
  }

};
function crossesMinefield(a, b) {
  for (const poly of routeMinefields) {
    if (insidePolygon(a, poly) || insidePolygon(b, poly)) continue; // the stop itself is in it: unavoidable
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) if (segmentsCross(a, b, poly[i], poly[j])) return true;
  }
  return false;
}
// While a walking-distance matrix is set (navLegs), legs cost their walking distance on the game's navmesh instead.
let navLegs = null;
// Straight-line leg costs are memoised per planning run (the exact planner asks for the same pair millions of times,
// and the minefield test is costly on maps with many minefields).
let legMemo = new WeakMap();
const legCost = (a, b) => {
  if (navLegs) {
    const i = navLegs.index.get(a), j = navLegs.index.get(b);
    if (i !== undefined && j !== undefined) { const v = navLegs.dist[i * navLegs.n + j]; return isFinite(v) ? v : dist2(a, b) * 3 + 2000; }
  }
  let row = legMemo.get(a);
  if (!row) legMemo.set(a, (row = new Map()));
  let v = row.get(b);
  if (v === undefined) { const d = dist2(a, b); v = routeMinefields.length && crossesMinefield(a, b) ? d * 3 : d; row.set(b, v); }
  return v;
};

function planRoute(start, groups, ends) {
  legMemo = new WeakMap();
  if (!groups.length) {
    const e = ends.reduce((b, x) => (!b || legCost(start, x) < legCost(start, b) ? x : b), null);
    return { stops: [], total: e ? legCost(start, e) : 0, end: e };
  }
  const nodes = [];
  groups.forEach((g, gi) => g.cands.forEach(c => nodes.push({ gi, c })));
  const N = groups.length, M = nodes.length;
  if (N <= 16 && (1 << N) * M * M <= EXACT_ROUTE_LIMIT) return routeExact(start, groups, ends, nodes);
  let best = null;
  for (const e of ends) {
    const r = routeHeuristic(start, groups, e);
    if (!best || r.total < best.total) best = { ...r, end: e };
  }
  return best;
}

function routeExact(start, groups, ends, nodes) {
  const N = groups.length, M = nodes.length, FULL = (1 << N) - 1;
  const need = needMasks(groups);
  const dp = new Float64Array((FULL + 1) * M).fill(Infinity);
  const parent = new Int32Array((FULL + 1) * M).fill(-1);
  nodes.forEach((nd, j) => { if (!need[nd.gi]) dp[(1 << nd.gi) * M + j] = legCost(start, nd.c); });
  for (let mask = 1; mask <= FULL; mask++) {
    for (let j = 0; j < M; j++) {
      const v = dp[mask * M + j];
      if (v === Infinity) continue;
      for (let k = 0; k < M; k++) {
        const bit = 1 << nodes[k].gi;
        if (mask & bit) continue;
        if ((mask & need[nodes[k].gi]) !== need[nodes[k].gi]) continue; // its key isn't picked up yet
        const idx = (mask | bit) * M + k, nv = v + legCost(nodes[j].c, nodes[k].c);
        if (nv < dp[idx]) { dp[idx] = nv; parent[idx] = j; }
      }
    }
  }
  let best = { total: Infinity };
  for (const e of ends) {
    for (let j = 0; j < M; j++) {
      const v = dp[FULL * M + j] + legCost(nodes[j].c, e);
      if (v < best.total) best = { total: v, last: j, end: e };
    }
  }
  const seq = [];
  for (let mask = FULL, j = best.last; j >= 0;) {
    seq.push(j);
    const pj = parent[mask * M + j];
    mask &= ~(1 << nodes[j].gi);
    j = pj;
  }
  seq.reverse();
  return { stops: seq.map(j => ({ g: groups[nodes[j].gi], p: nodes[j].c })), total: best.total, end: best.end };
}

// Randomised nearest-neighbour starts, each improved by 2-opt, or-opt (move one stop) and spot re-selection.
function routeHeuristic(start, groups, end, restarts = 24) {
  let best = null;
  for (let r = 0; r < restarts; r++) {
    const stops = [], left = groups.slice(), got = new Set();
    let cur = start;
    while (left.length) {
      const opts = [];
      left.forEach((g, i) => { if ((g.needsKeys || []).every(k => got.has(k))) g.cands.forEach(c => opts.push({ i, c, d: legCost(cur, c) })); });
      if (!opts.length) left.forEach((g, i) => g.cands.forEach(c => opts.push({ i, c, d: legCost(cur, c) })));
      opts.sort((a, b) => a.d - b.d);
      const pick = r === 0 ? opts[0] : opts[Math.min(opts.length - 1, Math.floor(Math.random() * 3))];
      stops.push({ g: left[pick.i], p: pick.c });
      if (left[pick.i].keyId) got.add(left[pick.i].keyId);
      cur = pick.c;
      left.splice(pick.i, 1);
    }
    improveRoute(start, stops, end);
    enforceKeyOrder(stops);
    const total = routeLength(start, stops, end);
    if (!best || total < best.total) best = { stops, total };
  }
  return best;
}

function routeLength(start, stops, end) {
  let total = 0, prev = start;
  for (const st of stops) { total += legCost(prev, st.p); prev = st.p; }
  return total + legCost(prev, end);
}

function improveRoute(start, stops, end) {
  const at = i => (i < 0 ? start : i >= stops.length ? end : stops[i].p);
  for (let pass = 0; pass < 20; pass++) {
    let improved = false;
    for (let i = 0; i < stops.length - 1; i++) {
      for (let k = i + 1; k < stops.length; k++) {
        const delta = legCost(at(i - 1), at(k)) + legCost(at(i), at(k + 1)) - legCost(at(i - 1), at(i)) - legCost(at(k), at(k + 1));
        if (delta < -0.01) { stops.splice(i, k - i + 1, ...stops.slice(i, k + 1).reverse()); improved = true; }
      }
    }
    for (let i = 0; i < stops.length; i++) {
      const [moved] = stops.splice(i, 1);
      const base = routeLength(start, stops, end);
      let bestPos = i, bestCost = Infinity;
      for (let k = 0; k <= stops.length; k++) {
        const a = k === 0 ? start : stops[k - 1].p, b = k === stops.length ? end : stops[k].p;
        const cost = legCost(a, moved.p) + legCost(moved.p, b) - legCost(a, b);
        if (cost < bestCost - 0.01) { bestCost = cost; bestPos = k; }
      }
      stops.splice(bestPos, 0, moved);
      if (bestPos !== i && routeLength(start, stops, end) < base + bestCost + 0.01) improved = true;
    }
    stops.forEach((st, i) => {
      let bestP = st.p, cost = legCost(at(i - 1), st.p) + legCost(st.p, at(i + 1));
      for (const c of st.g.cands) { const v = legCost(at(i - 1), c) + legCost(c, at(i + 1)); if (v < cost - 0.01) { cost = v; bestP = c; } }
      if (bestP !== st.p) { st.p = bestP; improved = true; }
    });
    if (!improved) break;
  }
}

// ---------- walking routes on the game's navmesh ----------
// The bots' navmesh doesn't cover whole maps, so tools/ builds a player navmesh from the game's collision geometry
// (walls, floors, stairs, doors, ledges to drop/climb/vault). A worker does the path searches.
// A few workers: distance-matrix rows are spread over all of them, everything else goes to the first.
const NAV_WORKERS = Math.max(1, Math.min(4, (navigator.hardwareConcurrency || 4) - 2));
let navWorkers = null, navSeq = 0;
const navPending = new Map(), navStatus = {}, navJobs = new Set();
function navCall(type, payload, w = 0) {
  if (!navWorkers) {
    navWorkers = Array.from({ length: NAV_WORKERS }, (_, wi) => {
      const wk = new Worker('/nav-worker.js');
      wk.onmessage = ev => {
        const p = navPending.get(ev.data.id);
        if (!p) return;
        navPending.delete(ev.data.id);
        if (ev.data.error) p.reject(new Error(ev.data.error)); else p.resolve(ev.data);
      };
      // a crashed worker (e.g. out of memory) fails its requests instead of leaving the route "working out" forever
      wk.onerror = e => {
        console.warn('route worker failed:', e.message);
        for (const [id, p] of navPending) if (p.w === wi) { navPending.delete(id); p.reject(new Error(e.message || 'route worker failed')); }
      };
      return wk;
    });
  }
  const id = ++navSeq;
  return new Promise((resolve, reject) => { navPending.set(id, { resolve, reject, w }); navWorkers[w].postMessage({ id, type, ...payload }); });
}
async function navMatrix(payload) {
  const n = payload.points.length, dist = new Float64Array(n * n);
  const rows = Array.from({ length: n }, (_, i) => i);
  const parts = await Promise.all(Array.from({ length: NAV_WORKERS }, (_, w) =>
    navCall('matrix', { ...payload, rows: rows.filter(i => i % NAV_WORKERS === w) }, w)));
  for (const p of parts) p.rows.forEach((i, k) => dist.set(p.dist.subarray(k * n, (k + 1) * n), i * n));
  return { dist };
}
// 'ready' once the map's navmesh is loaded in the workers; starts loading on first ask.
function navReady(key) {
  if (!(key in navStatus)) {
    navStatus[key] = 'loading';
    Promise.all(Array.from({ length: NAV_WORKERS }, (_, w) => navCall('load', { map: key }, w)))
      .then(() => { navStatus[key] = 'ready'; routeCache.sig = null; render(); })
      .catch(() => { navStatus[key] = 'missing'; });
  }
  return navStatus[key] === 'ready';
}
// Locked doors a route may open: keys the player has, and keys the route picks up.
const routeKeys = key => [...new Set([...Object.keys(S.have).filter(id => S.have[id] > 0), ...raidStopGroups(key).filter(g => g.keyId).map(g => g.keyId)])].sort();
const pt3 = p => ({ x: p.x, y: typeof p.y === 'number' ? p.y : undefined, z: p.z });

async function navRouteJob(sig, key, start, groups, ends, hazards) {
  const keys = routeKeys(key);
  const pts = [start];
  for (const g of groups) for (const c of g.cands) pts.push(c);
  for (const e of ends) pts.push(e);
  const { dist } = await navMatrix({ map: key, points: pts.map(pt3), keys, hazards });
  navLegs = { index: new Map(pts.map((p, i) => [p, i])), dist, n: pts.length };
  let r;
  try { r = planRoute(start, groups, ends); } finally { navLegs = null; }
  const seq = [start, ...r.stops.map(st => st.p), ...(r.end && r.end !== start ? [r.end] : [])];
  const { legs } = await navCall('paths', { map: key, points: seq.map(pt3), keys, hazards });
  return { stops: r.stops, extract: r.end && r.end !== start ? r.end : null, legs, walking: true,
    total: legs.reduce((s, l, i) => s + (l && !l.blocked ? l.length : dist2(seq[i], seq[i + 1])), 0), unreachable: legs.filter(l => !l || l.blocked).length, minefieldLegs: 0 };
}

function raidRoute(key) {
  if (!S.raid || !S.raid.spawn) return null;
  const groups = raidStopGroups(key);
  const options = raidExtractOptions(key);
  // A quest that must be extracted through a named exit decides the extract unless one was picked.
  const questExits = new Set(S.raid.quests.map(id => D.byId[id]).filter(t => t && S.tasks[t.id] !== 'done')
    .flatMap(t => t.objectives.filter(o => o.type === 'extract' && o.exitName && !o.optional && !S.objs[o.id]).map(o => o.exitName.toLowerCase())));
  const forced = S.raid.extract && S.raid.extract !== 'auto' ? options.filter(e => e.name === S.raid.extract)
    : options.filter(e => questExits.has(e.name.toLowerCase()));
  const ends = forced.length ? forced : options.filter(e => e.faction === 'pmc');
  const sig = JSON.stringify([key, S.raid.spawn, S.raid.extract, groups.map(g => g.o.id), routeKeys(key), navStatus[key] || '']);
  if (routeCache.sig === sig) return routeCache.route;
  const f = D.mapFeatures && D.mapFeatures[key];
  routeMinefields = f ? f.hazards.filter(h => h.type === 'minefield' && h.outline && h.outline.length > 2).map(h => h.outline.map(([x, z]) => ({ x, z }))) : [];
  // Walking route: computed in the background, the straight-line plan shows until it's ready.
  if (navReady(key) && !navJobs.has(sig)) {
    navJobs.add(sig);
    const zones = type => (f ? f.hazards : []).filter(h => h.type === type && h.outline && h.outline.length > 2).map(h => h.outline);
    const bd = D.mapDefs[key] && D.mapDefs[key].bounds;
    const hazards = { mines: zones('minefield'), snipers: zones('sniper'),
      bounds: bd ? [Math.min(bd[0][0], bd[1][0]), Math.min(bd[0][1], bd[1][1]), Math.max(bd[0][0], bd[1][0]), Math.max(bd[0][1], bd[1][1])] : null };
    navRouteJob(sig, key, S.raid.spawn, groups, ends.length ? ends : [S.raid.spawn], hazards)
      .then(route => { routeCache = { sig, route }; render(); })
      .catch(e => { console.warn('walking route failed:', e); navStatus[key] = 'missing'; routeCache.sig = null; render(); });
  }
  if (straightCache.sig === sig) return straightCache.route;
  const r = planRoute(S.raid.spawn, groups, ends.length ? ends : [S.raid.spawn]);
  // Report real walking distance, not the penalised planning cost.
  let total = 0, prev = S.raid.spawn;
  for (const st of r.stops) { total += dist2(prev, st.p); prev = st.p; }
  if (ends.length && r.end) total += dist2(prev, r.end);
  const minefieldLegs = [S.raid.spawn, ...r.stops.map(st => st.p), ...(ends.length && r.end ? [r.end] : [])].reduce((n, p, i, arr) => n + (i && crossesMinefield(arr[i - 1], p) ? 1 : 0), 0);
  const best = { stops: r.stops, total, extract: ends.length ? r.end : null, minefieldLegs, pending: navStatus[key] === 'ready' || navStatus[key] === 'loading' };
  // Keep showing a finished walking route for this signature if the background job already delivered it.
  if (routeCache.sig !== sig) routeCache = { sig: best.pending ? null : sig, route: best };
  straightCache = { sig, route: best };
  return best;
}

function setSpawn(p) {
  pickingSpawn = false;
  S.raid.spawn = { x: Math.round(p.x * 10) / 10, z: Math.round(p.z * 10) / 10 };
  if (typeof p.y === 'number') S.raid.spawn.y = Math.round(p.y * 10) / 10;
  update();
}

// Height for a clicked point (the walking route needs to know which floor): the floor being viewed, else street level.
function clickHeight(key, p) {
  const def = D.mapDefs[key];
  if (hasFloors(def) && raidFloor !== GROUND) {
    const l = def.layers.find(l => l.name === raidFloor);
    if (l) { const [a, b] = l.height; return isFinite(a) && isFinite(b) && Math.abs(b) < 1000 && Math.abs(a) < 1000 ? (a + b) / 2 : isFinite(a) && Math.abs(a) < 1000 ? a + 1 : b - 2; }
  }
  return localGround(key, p);
}

function onRaidMapClick(e) {
  if (!pickingSpawn) return;
  const p = { x: e.latlng.lng, z: e.latlng.lat };
  const spawns = (D.mapFeatures && D.mapFeatures[raidMapKey] && D.mapFeatures[raidMapKey].spawns) || [];
  let best = null, bd = 30; // snap to a known spawn within 30 m
  for (const sp of spawns) { const d = dist2(p, sp); if (d < bd) { bd = d; best = sp; } }
  if (!best) { const y = clickHeight(raidMapKey, p); if (typeof y === 'number') p.y = y; }
  setSpawn(best || p);
}

function drawRoute(key) {
  raidRouteLayer.clearLayers();
  if (!S.raid.spawn) return;
  raidRouteLayer.addLayer(L.marker([S.raid.spawn.z, S.raid.spawn.x], { zIndexOffset: 1000,
    icon: L.divIcon({ className: 'map-label route-start', html: '<span class="dot"></span>Spawn', iconSize: null, iconAnchor: [7, 7] }) }));
  const r = raidRoute(key);
  if (!r) return;
  const def = D.mapDefs[key];
  const path = [S.raid.spawn, ...r.stops.map(st => st.p), ...(r.extract ? [r.extract] : [])];
  if (r.walking) drawWalkingLegs(def, r, path);
  else {
    raidRouteLayer.addLayer(L.polyline(path.map(p => [p.z, p.x]), { color: '#000', weight: 6, opacity: 0.5, interactive: false }));
    raidRouteLayer.addLayer(L.polyline(path.map(p => [p.z, p.x]), { color: '#fff', weight: 3, opacity: r.pending ? 0.45 : 0.9, dashArray: '8 6', interactive: false }));
  }
  r.stops.forEach((st, i) => {
    const fl = hasFloors(def) ? floorOf(def, st.p) : GROUND;
    const place = placeText(placeOf(def, st.p));
    const stop = L.marker([st.p.z, st.p.x], { zIndexOffset: 900,
      icon: L.divIcon({ className: 'route-num' + (fl !== raidFloor ? ' away' : ''), html: String(i + 1), iconSize: [20, 20] }) })
      .on('click', () => { if (fl !== raidFloor) { raidFloor = fl; render(); } });
    raidRouteLayer.addLayer(bindObjectiveTip(stop, st.g.t, st.g.o, key, `<b>${i + 1}. ${esc(st.g.t.name)}</b><br>${esc(st.g.o.description)}${place ? `<br><i>${esc(place)}</i>` : ''}`, st.g.cands.length > 1));
  });
  if (r.extract) raidRouteLayer.addLayer(L.marker([r.extract.z, r.extract.x], { zIndexOffset: 1000,
    icon: L.divIcon({ className: 'map-label route-end', html: `<span class="dot"></span>🏁 ${esc(r.extract.name)}`, iconSize: null, iconAnchor: [7, 7] }) }));
}

const MOVE_ICON = { 1: ['⤓', 'Drop down here'], 2: ['⤒', 'Climb up here'], 3: ['⤳', 'Vault over here'] };
const floorOfPt = (def, p) => (hasFloors(def) ? floorOf(def, p) : GROUND);
// Walking path legs: solid on the floor being shown, faded and dashed on other floors, with floor changes,
// drops / climbs / vaults and locked doors marked.
function drawWalkingLegs(def, r, path) {
  r.legs.forEach((leg, i) => {
    if (!leg || leg.blocked) {
      // no walkable connection (e.g. only reachable by a jump the mesh doesn't know): straight line, red
      const a = path[i], b = path[i + 1];
      raidRouteLayer.addLayer(L.polyline([[a.z, a.x], [b.z, b.x]], { color: '#ff5050', weight: 3, opacity: 0.8, dashArray: '2 8', interactive: false }));
      return;
    }
    const pts = leg.points.map(([x, y, z]) => ({ x, y, z }));
    // runs of consecutive points on one floor
    const runs = [];
    for (let k = 0; k < pts.length; k++) {
      const fl = floorOfPt(def, pts[k]);
      if (!runs.length || runs[runs.length - 1].fl !== fl) runs.push({ fl, pts: runs.length ? [runs[runs.length - 1].pts.slice(-1)[0]] : [] });
      runs[runs.length - 1].pts.push(pts[k]);
    }
    runs.forEach((run, ri) => {
      const here = run.fl === raidFloor, ll = run.pts.map(p => [p.z, p.x]);
      if (here) raidRouteLayer.addLayer(L.polyline(ll, { color: '#000', weight: 7, opacity: 0.55, interactive: false }));
      raidRouteLayer.addLayer(L.polyline(ll, { color: '#fff', weight: here ? 3.5 : 2.5, opacity: here ? 0.95 : 0.45, dashArray: here ? null : '4 6', interactive: false }));
      if (ri > 0) {
        const p = run.pts[0], up = run.pts[run.pts.length - 1].y > runs[ri - 1].pts[0].y;
        raidRouteLayer.addLayer(L.marker([p.z, p.x], { zIndexOffset: 800, icon: L.divIcon({ className: 'floor-tag here', html: `${up ? '↑' : '↓'} ${esc(shortFloor(run.fl))}`, iconSize: null, iconAnchor: [-4, 10] }) })
          .bindTooltip(`Stairs / level change to ${esc(run.fl)} — click to show it`).on('click', () => { raidFloor = run.fl; render(); }));
      }
    });
    for (const mv of leg.moves || []) {
      const [glyph, tip] = MOVE_ICON[mv.kind] || [];
      if (!glyph) continue;
      raidRouteLayer.addLayer(L.marker([mv.z, mv.x], { zIndexOffset: 850, icon: L.divIcon({ className: 'map-icon', html: glyph, iconSize: null, iconAnchor: [8, 8] }) })
        .bindTooltip(`${tip} (${esc(floorOfPt(def, mv))})`));
    }
    for (const d of leg.doors || []) {
      if (d.state !== 1) continue;
      const k = (D.keys || []).find(x => x.id === d.key);
      raidRouteLayer.addLayer(L.marker([d.pos[2], d.pos[0]], { zIndexOffset: 860, icon: L.divIcon({ className: 'map-icon', html: '🔓', iconSize: null, iconAnchor: [8, 8] }) })
        .bindTooltip(`Locked door — the route opens it with ${esc(k ? k.name : 'its key')}`));
    }
  });
}

const pointY = st => st.p.y || 0;

function routePanel(key) {
  const options = raidExtractOptions(key);
  const select = `<select id="raidExtract"><option value="auto">Best PMC extract (auto)</option>${options.map(e =>
    `<option value="${esc(e.name)}" ${S.raid.extract === e.name ? 'selected' : ''}>${esc(e.name)}${e.faction === 'shared' ? ' (co-op)' : e.faction === 'transit' ? ' (transit)' : ''}</option>`).join('')}</select>`;
  const pick = `<button data-act="raidSpawnPick" class="${pickingSpawn ? 'primary' : ''}">${pickingSpawn ? 'Click your spawn on the map… (cancel)' : S.raid.spawn ? '📍 Change spawn' : '📍 Set spawn'}</button>`;
  let body;
  const r = raidRoute(key);
  if (!r) {
    body = '<div class="small muted">Press “Set spawn”, then click where you spawned (blue dots are PMC spawns). The tracker plans the shortest route through your objectives to the best extract.</div>';
  } else {
    let prev = S.raid.spawn;
    const legLen = (i, a, b) => (r.walking && r.legs[i] && !r.legs[i].blocked ? r.legs[i].length : dist2(a, b));
    const legNote = i => {
      const leg = r.walking && r.legs[i];
      if (leg && leg.blocked && leg.needs.length) {
        const names = [...new Set(leg.needs.map(d => ((D.keys || []).find(k => k.id === d.key) || { name: d.key ? 'a key' : 'a lever / power switch' }).name))];
        return ` <span class="badge lock" title="Behind a locked door: the route can't open it without the key">needs ${esc(names.join(' + '))}</span>`;
      }
      if (r.walking && (!leg || leg.blocked)) return ' <span class="badge lock" title="No walkable connection found — the spot may need a jump or a door this tracker treats as shut">no walking path</span>';
      if (!leg) return '';
      const n = k => (leg.moves || []).filter(m => m.kind === k).length;
      const bits = [[1, 'drop'], [2, 'climb'], [3, 'vault']].filter(([k]) => n(k)).map(([k, w]) => `${n(k)} ${w}${n(k) > 1 ? 's' : ''}`);
      const locked = (leg.doors || []).filter(d => d.state === 1).length;
      if (locked) bits.push(`${locked} locked door${locked > 1 ? 's' : ''}`);
      return bits.length ? ` <span class="muted">(${bits.join(', ')})</span>` : '';
    };
    const steps = r.stops.map((st, i) => {
      const d = legLen(i, prev, st.p); prev = st.p;
      const place = placeText(placeOf(D.mapDefs[key], st.p.y === undefined ? { ...st.p, y: pointY(st) } : st.p));
      return `<div class="obj route-step" data-act="routeGo" data-id="${i}" title="Show on the map"><span class="route-num static">${i + 1}</span><div><div class="small"><span class="swatch" style="background:${st.g.color}"></span><b>${esc(st.g.t.name)}</b> <span class="muted">· ${Math.round(d)} m</span>${legNote(i)}${place ? ` <span class="badge">${esc(place)}</span>` : ''}</div>
        <div class="detail">${esc(st.g.o.description)}</div></div></div>`;
    });
    if (r.extract) steps.push(`<div class="obj"><span class="route-num static">🏁</span><div class="small"><b>Extract: ${esc(r.extract.name)}</b> <span class="muted">· ${Math.round(legLen(r.stops.length, prev, r.extract))} m</span>${legNote(r.stops.length)}</div></div>`);
    const how = r.walking ? 'walking' : r.pending ? 'straight-line (working out the walking route…)' : 'straight-line';
    body = `<div class="small">~<b>${Math.round(r.total).toLocaleString()} m</b> ${how} · ~${Math.max(1, Math.round(r.total / ROUTE_SPEED / 60))} min of moving · ${r.stops.length} stops</div>${steps.join('')}
      ${r.minefieldLegs ? `<div class="small" style="color:var(--bad)">⚠ ${r.minefieldLegs} leg${r.minefieldLegs > 1 ? 's' : ''} still cross a minefield — go around the red dashed area.</div>` : ''}
      <div class="small muted">${r.walking
        ? 'Walking route on a navmesh built from the game\'s own collision geometry: walls, fences, stairs and floors, doors (locked ones only with a key you have or pick up), ledges to drop off (≤ 2.4 m), climb (≤ 1.5 m) or vault, minefields and sniper zones avoided. ↑/↓ mark level changes; dashed parts are on another floor.'
        : 'Straight-line distances, routed around minefields where possible: walls, fences and floors aren\'t accounted for.'} Objectives without a fixed spot (kills, anywhere-on-map) aren't on the route — do them along the way.</div>`;
  }
  // Guaranteed keys with no exact spot (inside a container) can't be a route stop: list them as a first step.
  const loose = new Map();
  for (const t of S.raid.quests.map(id => D.byId[id]).filter(Boolean)) {
    if (S.tasks[t.id] === 'done') continue;
    for (const pk of keyPickups(t, key)) if (!pk.spawn.points.length) loose.set(pk.key.id, pk);
  }
  const looseHtml = [...loose.values()].map(pk => `<div class="obj"><span class="route-num static">🔑</span><div class="small"><b>Pick up ${esc(pk.key.name)} first</b> — ${esc(pk.spawn.note)} <span class="muted">(inside a container, no exact map spot)</span></div></div>`).join('');
  return `<div class="sec"><h4>Route</h4><div class="row">${pick}${S.raid.spawn ? '<button data-act="raidSpawnClear">Clear</button>' : ''}</div><div style="margin:6px 0">${select}</div>${looseHtml}${body}</div>`;
}

function viewQuests() {
  const q = S.ui.search.trim().toLowerCase();
  const traders = D.traders.map(tr => `<option value="${tr.id}" ${S.ui.trader === tr.id ? 'selected' : ''}>${esc(tr.name)}</option>`).join('');
  const list = D.tasks.filter(t => {
    if (!factionOk(t) || !inFocus(t)) return false;
    if (S.ui.trader !== 'all' && (!t.trader || t.trader.id !== S.ui.trader)) return false;
    const st = taskState(t).status;
    if (!S.ui.showDone && (st === 'done' || st === 'failed')) return false;
    if (!S.ui.showLocked && st === 'locked') return false;
    if (!S.ui.showSkipped && isSkipped(t) && st !== 'done') return false;
    if (q && !t.name.toLowerCase().includes(q) && !t.objectives.some(o => (o.description || '').toLowerCase().includes(q))) return false;
    return true;
  }).sort((a, b) => (a.trader ? a.trader.name : '').localeCompare(b.trader ? b.trader.name : '') || (a.minPlayerLevel || 0) - (b.minPlayerLevel || 0));
  let html = `<div class="panel row">
      <input class="search" id="search" placeholder="Search quests / objectives…" value="${esc(S.ui.search)}">
      <select id="traderFilter"><option value="all">All traders</option>${traders}</select>
      <label><input type="checkbox" id="showLocked" ${S.ui.showLocked ? 'checked' : ''}> show locked</label>
      <label><input type="checkbox" id="showDone" ${S.ui.showDone ? 'checked' : ''}> show completed</label>
      <label><input type="checkbox" id="showSkipped" ${S.ui.showSkipped ? 'checked' : ''}> show won't do</label>
      <span class="spacer"></span><span class="muted">${list.length} quests</span>
    </div>`;
  let last = null;
  for (const t of list) {
    const tn = t.trader ? t.trader.name : '?';
    if (tn !== last) { html += `<div class="group-title">${esc(tn)}</div>`; last = tn; }
    html += taskCard(t);
  }
  return html;
}

// Quest, level, trader and hideout conditions are derived from progress; skills and stash money are ticked by hand.
const conditionAuto = c => !!((c.task && D.byId[c.task.id]) || c.playerLevel || (c.trader && c.level) || (c.type === 'hideoutStation' && c.station));

function conditionMet(c) {
  if (c.task && D.byId[c.task.id]) return !!S.tasks[c.task.id];
  if (c.playerLevel) return S.level >= c.playerLevel;
  if (c.trader && c.level) return (S.traders[c.trader.id] || 1) >= c.level;
  if (c.type === 'hideoutStation' && c.station) return stationBuilt(c.station.id, c.stationLevel);
  if (c.type === 'skill' && c.skillLevel && (S.skills[c.skillLevel.name] || 0) >= c.skillLevel.level) return true;
  return !!S.pchecks[c.id];
}

function viewPrestige() {
  const p = currentPrestige();
  const pp = pathProgress();
  if (!p) return '<div class="panel muted">json.tarkov.dev has no prestige data for this game mode.</div>';
  const rows = p.conditions.map(c => {
    const met = conditionMet(c);
    const auto = conditionAuto(c);
    let extra = c.type === 'haveItem' ? 'Keep this in your stash when you press Prestige — it is consumed.' : objectiveDetail(c);
    if (c.type === 'hideoutStation') extra = 'Tick it in the Hideout tab; prerequisite levels are marked PRESTIGE there.';
    if (c.type === 'skill') extra = SKILL_TIPS[c.skillLevel.name] || 'Tick when your skill reaches this level.';
    if (c.task && D.byId[c.task.id]) {
      const t = D.byId[c.task.id];
      const sub = [...ancestorsOf([t.id])].map(id => D.byId[id]).filter(factionOk);
      const d = sub.filter(x => S.tasks[x.id]).length;
      extra = `Quest chain: ${d}/${sub.length} done · <a href="#" data-act="goto" data-id="${t.id}">open quest</a>`;
    }
    return `<tr class="${met ? 'complete' : ''}">
      <td>${auto ? (met ? '✅' : '⬜') : `<input type="checkbox" data-act="pcheck" data-id="${c.id}" ${met ? 'checked' : ''}>`}</td>
      <td>${esc(c.description)}<div class="small muted">${extra}</div></td>
      <td class="small muted">${auto ? 'auto' : 'tick manually'}</td>
    </tr>`;
  }).join('');
  const metCount = p.conditions.filter(conditionMet).length;
  return `<div class="panel">
      <div class="row"><b>${esc(p.name)}</b><span class="spacer"></span><span class="muted">${metCount} / ${p.conditions.length} requirements met</span></div>
      <div class="bar"><div style="width:${(100 * metCount / Math.max(1, p.conditions.length)).toFixed(1)}%"></div></div>
      <div class="small muted">Quest, level and hideout requirements tick automatically from your progress.${D.pathSet.size ? ` Required quest chain: ${pp.done}/${pp.total}.` : ''}</div>
    </div>
    <div class="panel"><table><thead><tr><th></th><th>Requirement</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="small muted">Tip: when you prestige, press “Start new prestige” — it archives this run and wipes quests/hideout/items like the game does.</div>`;
}

function levelBuildable(l) {
  const reasons = [];
  for (const r of l.stationLevelRequirements || []) {
    if (!r.station) continue;
    const st = D.stationById[r.station.id];
    const req = st && st.levels.find(x => x.level === r.level);
    if (req && !S.hideout[req.id]) reasons.push(`${r.station.name} ${r.level}`);
  }
  for (const r of l.traderRequirements || []) {
    if (r.requirementType === 'level' && r.trader && !cmp(S.traders[r.trader.id] || 1, r.compareMethod, r.value)) reasons.push(`${r.trader.name} LL${r.value}`);
  }
  // Skills only block once you've entered them in the setup.
  for (const r of l.skillRequirements || []) if (S.skills[r.name] != null && S.skills[r.name] < r.level) reasons.push(`${r.name} ${r.level}`);
  return reasons;
}

function viewHideout() {
  const onPath = s => s.levels.some(l => D.hideoutPath.has(l.id) && !S.hideout[l.id]);
  const stations = [...D.hideoutStations]
    .filter(s => !S.ui.hideoutPrestigeOnly || onPath(s))
    .sort((a, b) => onPath(b) - onPath(a) || a.name.localeCompare(b.name));
  const cards = stations.map(s => {
    const levels = [...s.levels].sort((a, b) => a.level - b.level);
    const builtMax = Math.max(0, ...levels.filter(l => S.hideout[l.id]).map(l => l.level));
    let shown = S.ui.hideoutNextOnly ? levels.filter(l => !S.hideout[l.id]).slice(0, 1) : levels;
    if (S.ui.hideoutPrestigeOnly) shown = shown.filter(l => D.hideoutPath.has(l.id));
    const rows = shown.map(l => {
      const built = !!S.hideout[l.id];
      const blockers = levelBuildable(l);
      const items = l.itemRequirements.map(r => {
        const have = S.have[r.item.id] || 0;
        return `<span title="have ${have}">${itemChip(r.item, r.count, r.foundInRaid)}${have >= r.count ? '✓' : ''}</span>`;
      }).join('');
      const skills = (l.skillRequirements || []).map(x => `${esc(x.name)} ${x.level}`).join(', ');
      const traders = (l.traderRequirements || []).map(x => `${esc(x.trader.name)} LL${x.value}`).join(', ');
      return `<div class="lvl ${built ? 'built' : ''}">
        <label><input type="checkbox" data-act="hideout" data-id="${l.id}" ${built ? 'checked' : ''}> <b>Level ${l.level}</b></label>
        ${D.hideoutPath.has(l.id) && !built ? '<span class="badge path">PRESTIGE</span>' : ''}
        ${built ? '<span class="badge ok">built</span>' : blockers.length ? `<span class="badge lock">needs ${esc(blockers.join(', '))}</span>` : '<span class="badge ok">can build</span>'}
        ${l.constructionTime ? `<span class="badge">${Math.round(l.constructionTime / 3600 * 10) / 10}h</span>` : ''}
        <div>${items || '<span class="muted small">no items</span>'}</div>
        ${skills ? `<div class="small muted">Skills: ${skills}</div>` : ''}
        ${traders ? `<div class="small muted">Traders: ${traders}</div>` : ''}
      </div>`;
    }).join('');
    return `<div class="panel station"><h3>${esc(s.name)} <span class="muted small">${builtMax}/${levels.length}</span></h3>${rows || '<div class="muted small">Fully built</div>'}</div>`;
  }).join('');
  return `<div class="panel row">
      <label><input type="checkbox" id="hideoutNextOnly" ${S.ui.hideoutNextOnly ? 'checked' : ''}> show next level only</label>
      <label><input type="checkbox" id="hideoutPrestigeOnly" ${S.ui.hideoutPrestigeOnly ? 'checked' : ''}> only levels needed for prestige</label>
      <span class="spacer"></span><span class="small muted">Ticking a level marks lower levels built too. Item counts use your “have” numbers from the Items tab.</span>
    </div><div class="grid2">${cards}</div>`;
}

function neededItems() {
  const need = new Map();
  const add = (it, count, fir, source) => {
    const key = it.id;
    const e = need.get(key) || { item: it, count: 0, fir: 0, sources: [] };
    e.count += count;
    if (fir) e.fir += count;
    e.sources.push(source);
    need.set(key, e);
  };
  // With no required quest chain, listing items for every quest in the game is noise — only count quests available now.
  const onlyAvailable = S.focus === 'prestige' && !D.pathSet.size;
  for (const t of D.tasks) {
    if (!factionOk(t) || !inFocus(t) || S.tasks[t.id] || isSkipped(t)) continue;
    if (onlyAvailable && taskState(t).status !== 'available') continue;
    for (const o of t.objectives) {
      // Only hand-in objectives consume items; "find" objectives are usually paired with a hand-in.
      if (S.objs[o.id] || o.optional || !o.items || !o.items.length || !['giveItem', 'plantItem'].includes(o.type)) continue;
      add(o.items[0], o.count || 1, o.foundInRaid, `${t.name}${o.items.length > 1 ? ' (alternatives ok)' : ''}`);
    }
  }
  if (S.ui.itemsHideout !== 'none') {
    for (const s of D.hideoutStations) for (const l of s.levels) {
      if (S.hideout[l.id] || (S.ui.itemsHideout === 'prestige' && !D.hideoutPath.has(l.id))) continue;
      for (const r of l.itemRequirements) add(r.item, r.count, r.foundInRaid, `${s.name} ${l.level}`);
    }
  }
  return [...need.values()];
}

function viewItems() {
  const q = S.ui.search.trim().toLowerCase();
  let list = neededItems();
  if (S.ui.itemsHideDone) list = list.filter(e => (S.have[e.item.id] || 0) < e.count);
  if (q) list = list.filter(e => e.item.name.toLowerCase().includes(q));
  list.sort((a, b) => b.fir - a.fir || b.count - a.count);
  const rows = list.map(e => {
    const have = S.have[e.item.id] || 0;
    return `<tr class="${have >= e.count ? 'complete' : ''}">
      <td>${itemChip(e.item)}</td>
      <td><b>${e.count.toLocaleString()}</b>${e.fir ? `<div class="small"><span class="badge fir">${e.fir.toLocaleString()} FIR</span></div>` : ''}</td>
      <td><button data-act="have" data-id="${e.item.id}" data-d="-1">−</button>
          <input type="number" min="0" data-act="haveSet" data-id="${e.item.id}" value="${have}">
          <button data-act="have" data-id="${e.item.id}" data-d="1">+</button></td>
      <td class="small muted">${esc(e.sources.join(' · '))}</td>
    </tr>`;
  }).join('');
  return `<div class="panel row">
      <input class="search" id="search" placeholder="Search items…" value="${esc(S.ui.search)}">
      <label class="muted">Hideout <select id="itemsHideout">${[['prestige', 'prestige levels only'], ['all', 'all unbuilt levels'], ['none', 'none']].map(([k, v]) => `<option value="${k}" ${S.ui.itemsHideout === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <label><input type="checkbox" id="itemsHideDone" ${S.ui.itemsHideDone ? 'checked' : ''}> hide items I have enough of</label>
      <span class="spacer"></span><span class="small muted">${S.focus === 'prestige' && !D.pathSet.size ? 'Quest items: only quests available now. ' : 'Quest items follow the Focus setting. '}FIR = found in raid — don't sell these.</span>
    </div>
    <div class="panel"><table><thead><tr><th>Item</th><th>Need</th><th>Have</th><th>For</th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="muted">Nothing needed 🎉</td></tr>'}</tbody></table></div>`;
}

// ---------- key lookup ----------
// Quests that use each key: needed to open a door, or handed over / found as an item. Built once per data load.
function keyQuestIndex() {
  if (D.keyQuests) return D.keyQuests;
  const out = {};
  const add = (id, t, how) => { const l = (out[id] = out[id] || []); if (!l.some(x => x.t === t)) l.push({ t, how }); };
  for (const t of D.tasks) {
    for (const k of t.neededKeys || []) for (const x of k.keys) add(x.id, t, 'opens a door for it');
    for (const o of t.objectives) {
      for (const g of o.requiredKeys || []) for (const x of g) add(x.id, t, 'opens a door for it');
      if (['giveItem', 'findItem', 'plantItem'].includes(o.type)) for (const it of o.items || []) if (D.keyById[it.id]) add(it.id, t, o.type === 'giveItem' ? 'hand it over' : o.type === 'plantItem' ? 'plant it' : 'find it');
    }
  }
  return (D.keyQuests = out);
}

const KEY_VERDICTS = {
  needed: { label: '🔴 Needed for your quests', cls: 'lock', tip: 'A quest you still have to do uses this key — keep it' },
  story: { label: '📖 Story', cls: 'gate', tip: 'Used in a story chapter (from the wiki)' },
  high: { label: '💎 High-value loot', cls: 'path', tip: 'Valuable room or expensive key: worth running' },
  good: { label: '👍 Decent loot', cls: 'ok', tip: 'Some good containers behind it, or it sells well' },
  trash: { label: '🗑 Trash key', cls: 'skip', tip: 'Not needed for anything you still have to do, little behind it, cheap' },
};
function keyVerdict(k) {
  const quests = (keyQuestIndex()[k.id] || []).filter(q => factionOk(q.t));
  const open = quests.filter(q => !S.tasks[q.t.id] && !isSkipped(q.t));
  const story = k.wikiQuests.some(l => /story chapter/i.test(l));
  const score = k.lootScore || 0;
  const value = k.flea >= 1e6 || score >= 10 ? 'high' : k.flea >= 150000 || score >= 4 ? 'good' : 'trash';
  return { quests, open, story, value, main: open.length ? 'needed' : story ? 'story' : value };
}
const rub = n => `${Math.round(n).toLocaleString()} ₽`;

function viewKeys() {
  const q = S.ui.search.trim().toLowerCase();
  const filter = S.ui.keyFilter || 'all';
  const rank = { needed: 0, story: 1, high: 2, good: 3, trash: 4 };
  let list = (D.keys || []).map(k => ({ k, v: keyVerdict(k) }));
  const counts = {};
  for (const e of list) for (const f of new Set([e.v.main, e.v.value])) counts[f] = (counts[f] || 0) + 1;
  if (q) list = list.filter(({ k }) => [k.name, k.shortName, k.usage, k.lockLocation].some(s => (s || '').toLowerCase().includes(q)));
  if (filter !== 'all') list = list.filter(({ v }) => v.main === filter || v.value === filter);
  list.sort((a, b) => rank[a.v.main] - rank[b.v.main] || b.k.flea - a.k.flea || a.k.name.localeCompare(b.k.name));
  const shown = list.slice(0, 80);
  const chips = [['all', 'All', (D.keys || []).length], ...['needed', 'story', 'high', 'good', 'trash'].map(f => [f, KEY_VERDICTS[f].label, counts[f] || 0])]
    .map(([f, label, n]) => `<span class="chip ${filter === f ? 'on' : ''}" data-act="keyFilter" data-id="${f}">${esc(label)}<span class="n">${n}</span></span>`).join('');
  const statusOf = t => S.tasks[t.id] === 'done' ? '<span class="badge ok">done</span>' : S.tasks[t.id] === 'failed' ? '<span class="badge">failed</span>'
    : isSkipped(t) ? '<span class="badge skip">won\'t do</span>' : S.active[t.id] ? '<span class="badge ok">accepted</span>' : taskState(t).status === 'available' ? '<span class="badge gate">available</span>' : '<span class="badge">later</span>';
  const cards = shown.map(({ k, v }) => {
    const verdicts = [v.main, ...(v.main !== v.value ? [v.value] : [])].map(f => `<span class="badge ${KEY_VERDICTS[f].cls}" title="${esc(KEY_VERDICTS[f].tip)}">${esc(KEY_VERDICTS[f].label)}</span>`).join('');
    const price = [k.noFlea ? 'can\'t be sold on the flea' : k.flea ? `flea ~${rub(k.flea)}` : 'no flea price', k.traderPrice ? `trader buys for ${rub(k.traderPrice)}` : '', k.uses ? `${k.uses} uses` : ''].filter(Boolean).join(' · ');
    const behind = k.behind.length ? k.behind.map(esc).join(' · ') : '<span class="muted">not on the wiki</span>';
    const quests = v.quests.map(x => `<a href="#" data-act="goto" data-id="${x.t.id}">${esc(x.t.name)}</a> <span class="muted small">(${esc(x.how)})</span> ${statusOf(x.t)}`).join('<br>');
    const wikiUses = k.wikiQuests.filter(l => !v.quests.some(x => l.includes(x.t.name)));
    return `<div class="task key-card"><div class="task-head" style="cursor:default">
      <img class="key-img" loading="lazy" src="${esc(k.image || k.iconLink || '')}" alt="">
      <div style="flex:1;min-width:0">
        <div><span class="name">${esc(k.name)}</span> ${verdicts}</div>
        <div class="meta">${price}${k.lockMaps.length ? ` · ${k.lockMaps.map(esc).join(', ')}` : ''}${k.lootScore != null ? ` · loot score ${k.lootScore}` : ''}</div>
        ${k.usage ? `<div class="small">${esc(k.usage)}</div>` : ''}
        <div class="small"><b>Behind the lock:</b> ${behind}</div>
        ${quests ? `<div class="small" style="margin-top:3px"><b>Quests:</b><br>${quests}</div>` : ''}
        ${wikiUses.length ? `<div class="small muted" style="margin-top:3px">${wikiUses.map(esc).join('<br>')}</div>` : ''}
      </div>
      <div style="text-align:right;white-space:nowrap">
        <span class="item key ${haveKey(k) ? 'have' : 'missing'}" data-act="keyToggle" data-id="${k.id}" title="Tick if it's in your stash — the raid planner uses this">${haveKey(k) ? '✓ I have it' : 'I have it?'}</span>
        ${k.wikiLink ? `<div class="small"><a href="${esc(k.wikiLink)}" target="_blank" rel="noopener">wiki</a></div>` : ''}
      </div></div></div>`;
  }).join('');
  return `<div class="panel">
      <div class="row"><input class="search" id="search" placeholder="Search a key by name (e.g. 314, Kiba, cottage)…" value="${esc(S.ui.search)}" style="flex:1">
        <span class="small muted">${list.length} key${list.length === 1 ? '' : 's'}${list.length > shown.length ? ` · showing ${shown.length}` : ''}</span></div>
      <div class="chips">${chips}</div>
      <div class="small muted">“Needed” = a quest you haven't finished uses it. Loot is rated from the wiki's “Behind the lock” list (safes, valuables and keycards weigh most) and the flea price.
        A cheap key with a good room still shows as decent loot. Prices: tarkov.dev ${S.mode === 'pve' ? 'PvE' : 'PvP'} flea.</div>
    </div>${cards || '<div class="panel muted">No key matches.</div>'}`;
}

// ---------- profile setup (everything the game logs can't tell the tracker) ----------
const SETUP_STEPS = [
  { id: 'basics', title: 'Character' }, { id: 'traders', title: 'Traders' }, { id: 'skills', title: 'Skills' },
  { id: 'hideout', title: 'Hideout' }, { id: 'story', title: 'Story' }, { id: 'stash', title: 'Stash & keys' },
];

// Skills something in the tracker checks: prestige conditions, hideout levels and quest objectives.
function relevantSkills() {
  const out = new Map();
  const add = (name, level, why) => { if (!name) return; const e = out.get(name) || { name, uses: [] }; e.uses.push(`${why} (${level})`); out.set(name, e); };
  const p = currentPrestige();
  for (const c of p ? p.conditions : []) if (c.type === 'skill' && c.skillLevel) add(c.skillLevel.name, c.skillLevel.level, p.name);
  for (const s of D.hideoutStations) for (const l of s.levels) if (!S.hideout[l.id]) for (const r of l.skillRequirements || []) add(r.name, r.level, `${s.name} ${l.level}`);
  for (const t of D.tasks) if (!S.tasks[t.id] && factionOk(t) && inFocus(t)) for (const o of t.objectives) if (o.type === 'skill' && o.skillLevel) add(o.skillLevel.name, o.skillLevel.level, t.name);
  return [...out.values()].sort((a, b) => a.name.localeCompare(b.name));
}

// Why a trader isn't available yet (Tour step or unlocking quest), or null.
function traderLockReason(tr) {
  const tour = tourLocks();
  if (tour.traders.has(tr.normalizedName)) return `Tour: ${tour.traders.get(tr.normalizedName)}`;
  const unlockers = D.traderUnlockedBy[tr.normalizedName];
  if (unlockers && !unlockers.some(id => S.tasks[id] === 'done')) return `finish ${unlockers.map(id => `“${D.byId[id].name}”`).join(' or ')}`;
  return null;
}

function setupStepBody(step) {
  if (step === 'basics') {
    const prestiges = Math.max(6, ...(D.prestige || []).map(p => p.prestigeLevel));
    return `<div class="setup-grid">
      <label>Character level <input type="number" min="1" max="79" data-setup="level" value="${S.level}"></label>
      <div class="small muted">The game logs don't record your level, so quests with a level gate depend on this. Look at the top left of the character screen.</div>
      <label>Faction <select data-setup="faction">${['USEC', 'BEAR'].map(f => `<option ${S.faction === f ? 'selected' : ''}>${f}</option>`).join('')}</select></label>
      <div class="small muted">A few quests are only for one faction.</div>
      <label>Game mode <select data-setup="mode"><option value="pve" ${S.mode === 'pve' ? 'selected' : ''}>PvE</option><option value="regular" ${S.mode === 'regular' ? 'selected' : ''}>PvP</option></select></label>
      <div class="small muted">Quest data, prices and the logs are read for this mode.</div>
      <label>Prestiges done <select data-setup="prestige">${Array.from({ length: prestiges + 1 }, (_, n) => `<option value="${n}" ${S.prestige === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <div class="small muted">How many times you've prestiged — the tracker plans for prestige ${S.prestige + 1}.</div>
      <label>Focus <select data-setup="focus">${[['prestige', 'Prestige path only'], ['kappa', 'Prestige + Kappa'], ['all', 'All quests']].map(([k, v]) => `<option value="${k}" ${S.focus === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <div class="small muted">Which quests Next up and the item lists care about.</div>
    </div>`;
  }
  if (step === 'traders') {
    const rows = D.traders.map(tr => {
      const lock = traderLockReason(tr);
      return `<tr><td><b>${esc(tr.name)}</b></td>
        <td>${lock ? `<span class="badge lock">🔒 ${esc(lock)}</span>` : '<span class="badge ok">unlocked</span>'}</td>
        <td><select data-trader="${tr.id}">${[1, 2, 3, 4].map(n => `<option ${(S.traders[tr.id] || 1) === n ? 'selected' : ''}>${n}</option>`).join('')}</select></td>
        <td><input type="number" step="0.01" data-rep="${tr.id}" value="${S.rep[tr.id] || 0}" style="width:80px"></td></tr>`;
    }).join('');
    return `<div class="small muted" style="margin-bottom:6px">Open each trader in game: the loyalty level (LL) is the roman number under their portrait, reputation (standing) is the number next to it.
        Quests and hideout levels check both. Whether a trader is unlocked comes from your story progress and finished quests.</div>
      <table><thead><tr><th>Trader</th><th>Status</th><th>Loyalty level</th><th>Reputation</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  if (step === 'skills') {
    const skills = relevantSkills();
    const rows = skills.map(sk => `<tr><td><b>${esc(sk.name)}</b>${SKILL_TIPS[sk.name] ? `<div class="small muted">${esc(SKILL_TIPS[sk.name])}</div>` : ''}</td>
      <td><input type="number" min="0" max="51" data-skill="${esc(sk.name)}" value="${S.skills[sk.name] ?? ''}" placeholder="?"></td>
      <td class="small muted">${esc(sk.uses.slice(0, 4).join(' · '))}${sk.uses.length > 4 ? ` · +${sk.uses.length - 4} more` : ''}</td></tr>`).join('');
    return `<div class="small muted" style="margin-bottom:6px">Only the skills something still checks are listed. Character screen → Skills shows the level. Leave a skill empty if you don't know it: it won't block anything then.</div>
      <table><thead><tr><th>Skill</th><th>Level</th><th>Needed for</th></tr></thead><tbody>${rows || '<tr><td class="muted">Nothing checks a skill right now.</td></tr>'}</tbody></table>`;
  }
  if (step === 'hideout') {
    const rows = [...D.hideoutStations].sort((a, b) => a.name.localeCompare(b.name)).map(s => {
      const levels = [...s.levels].sort((a, b) => a.level - b.level);
      const built = Math.max(0, ...levels.filter(l => S.hideout[l.id]).map(l => l.level));
      const need = levels.filter(l => D.hideoutPath.has(l.id) && !S.hideout[l.id]).map(l => l.level);
      return `<tr><td><b>${esc(s.name)}</b></td><td><select data-station="${s.id}">${[0, ...levels.map(l => l.level)].map(n => `<option value="${n}" ${built === n ? 'selected' : ''}>${n === 0 ? 'not built' : 'level ' + n}</option>`).join('')}</select></td>
        <td>${need.length ? `<span class="badge path">prestige needs level ${Math.max(...need)}</span>` : ''}</td></tr>`;
    }).join('');
    return `<div class="small muted" style="margin-bottom:6px">Pick the level each station is built to (hideout screen). Upgrades in progress don't count yet.</div>
      <table><thead><tr><th>Station</th><th>Built</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  if (step === 'story') {
    if (!D.storyChapters.length) return '<div class="muted">Story chapter data couldn’t be loaded from tarkovtracker.org. Try “Refresh data” later.</div>';
    const rows = D.storyChapters.map(c => {
      const main = c.objectives.filter(o => !o.optional);
      let last = -1;
      main.forEach((o, i) => { if (S.story[o.id]) last = i; });
      const unlocks = [...c.mapUnlocks, ...c.traderUnlocks];
      return `<tr><td><b>${esc(c.name)}</b>${unlocks.length ? `<div class="small muted">Unlocks ${esc(unlocks.join(', '))}</div>` : ''}</td>
        <td><select data-chapter="${esc(c.id)}" style="max-width:420px">
          <option value="-1">${chapterStarted(c) && last < 0 ? 'started, no step done' : 'not started'}</option>
          ${main.map((o, i) => `<option value="${i}" ${last === i ? 'selected' : ''}>${i === main.length - 1 ? '✓ finished' : `step ${i + 1} done`}: ${esc(o.description.length > 70 ? o.description.slice(0, 68) + '…' : o.description)}</option>`).join('')}
        </select></td></tr>`;
    }).join('');
    return `<div class="small muted" style="margin-bottom:6px">Pick the last step you've done in each chapter (game menu → Story / the task list's storyline). The Tour decides which traders and maps you have.
        Quests you start or finish already tick the steps they prove; the Story tab has every step if you need more detail.</div>
      <table><thead><tr><th>Chapter</th><th>Progress</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  // stash: hand-ticked prestige conditions and the keys your quests use.
  const p = currentPrestige();
  const manual = (p ? p.conditions : []).filter(c => !conditionAuto(c) && c.type !== 'skill');
  const checks = manual.map(c => `<label class="obj"><input type="checkbox" data-act="pcheck" data-id="${c.id}" ${conditionMet(c) ? 'checked' : ''}> <span>${esc(c.description)}</span></label>`).join('');
  const wanted = new Map();
  for (const t of D.tasks) {
    if (S.tasks[t.id] || isSkipped(t) || !factionOk(t) || !(S.active[t.id] || taskState(t).status === 'available')) continue;
    for (const g of [...(t.neededKeys || []).map(k => k.keys), ...t.objectives.filter(o => !o.optional && !S.objs[o.id]).flatMap(o => o.requiredKeys || [])]) {
      for (const k of g) { const e = wanted.get(k.id) || { k, quests: new Set() }; e.quests.add(t.name); wanted.set(k.id, e); }
    }
  }
  const keys = [...wanted.values()].sort((a, b) => a.k.name.localeCompare(b.k.name)).map(({ k, quests }) => `<div class="side-item">
      ${k.iconLink ? `<img loading="lazy" src="${esc(k.iconLink)}" alt="">` : ''}<div class="info"><div class="small">${esc(k.name)}</div><div class="for">${esc([...quests].join(' · '))}</div></div>
      <span class="item key ${haveKey(k) ? 'have' : 'missing'}" data-act="keyToggle" data-id="${k.id}">${haveKey(k) ? '✓ have it' : 'have it?'}</span></div>`).join('');
  return `${checks ? `<div class="sec"><h4>Prestige ${p.prestigeLevel}: stash items</h4><div class="small muted">Tick what's already in your stash.</div>${checks}</div>` : ''}
    <div class="sec"><h4>Keys for your accepted and available quests</h4><div class="small muted">Tick the keys in your stash or key tool — the raid planner pre-selects quests by this. The Keys tab looks up any other key.</div>
      ${keys || '<div class="muted small">None of these quests need a key.</div>'}</div>`;
}

// Shown on the main views while the profile still looks unset (level 1 with progress, no loyalty levels).

  const progress = Object.keys(S.tasks).length + Object.keys(S.active).length;
  const missing = [S.level <= 1 && progress > 3 ? 'your level is still 1' : '', progress > 10 && !Object.keys(S.traders).length ? 'no trader loyalty levels' : ''].filter(Boolean);
  if (!missing.length) return '';
  return `<div class="panel row" style="border-color:var(--warn)"><span>⚠ ${esc(missing.join(' and '))} — quests may show as locked or available when they aren't.</span><span class="spacer"></span>
