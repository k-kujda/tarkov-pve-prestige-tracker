// Everything needed to finish the quests currently accepted in game (from the game logs).
function acceptedNeeds() {
  const quests = D.tasks.filter(t => S.active[t.id] && !S.tasks[t.id] && !isSkipped(t));
  const items = new Map();
  const add = (it, count, fir, quest, note) => {
    const e = items.get(it.id) || { item: it, count: 0, fir: 0, quests: [] };
    e.count += count;
    if (fir) e.fir += count;
    e.quests.push(note ? `${quest} (${note})` : quest);
    items.set(it.id, e);
  };
  const keys = new Map();
  for (const t of quests) {
    for (const o of t.objectives) {
      if (S.objs[o.id] || o.optional) continue;
      if ((o.type === 'giveItem' || o.type === 'plantItem') && o.items && o.items.length) {
        add(o.items[0], o.count || 1, o.foundInRaid, t.name, [o.type === 'plantItem' ? 'plant' : '', o.items.length > 1 ? 'alternatives ok' : ''].filter(Boolean).join(', '));
      }
      if (o.type === 'mark' && o.markerItem) add(o.markerItem, 1, false, t.name, 'mark');
      if (o.type === 'buildWeapon' && o.item) add(o.item, 1, false, t.name, 'build — see wiki for parts');
    }
    for (const k of t.neededKeys || []) {
      const id = k.keys.map(x => x.id).join('|');
      const e = keys.get(id) || { keys: k.keys, map: k.map, quests: [] };
      e.quests.push(t.name);
      keys.set(id, e);
    }
  }
  return { quests, items: [...items.values()], keys: [...keys.values()] };
}

function renderSide() {
  const layout = document.getElementById('layout');
  const raidScreen = S.ui.tab === 'raid' && !!S.raid;
  layout.classList.toggle('side-hidden', !S.ui.sideOpen || raidScreen);
  document.body.classList.toggle('side-off', !S.ui.sideOpen);
  document.getElementById('sideShow').style.display = S.ui.sideOpen ? 'none' : 'inline-block';
  const side = document.getElementById('side');
  if (raidScreen) document.getElementById('sideShow').style.display = 'none';
  if (!D || !S.ui.sideOpen || raidScreen) { side.innerHTML = ''; return; }
  const { quests, items, keys } = acceptedNeeds();
  const head = `<div class="row"><b>Accepted quests</b><span class="muted small">${quests.length} active</span><span class="spacer"></span>
    <button class="small" data-act="sideToggle" title="Hide sidebar">◂</button></div>`;
  if (!S.logSync) {
    side.innerHTML = `<div class="panel">${head}<div class="small muted" style="margin-top:6px">Press “Sync from game” to load the quests you've accepted in game.</div></div>`;
    return;
  }
  items.sort((a, b) => (b.fir > 0) - (a.fir > 0) || a.item.name.localeCompare(b.item.name));
  const missing = items.filter(e => (S.have[e.item.id] || 0) < e.count).length;
  const rows = items.map(e => {
    const have = S.have[e.item.id] || 0;
    return `<div class="side-item ${have >= e.count ? 'complete' : ''}" title="${esc(e.quests.join('\n'))}">
      ${e.item.iconLink ? `<img loading="lazy" src="${esc(e.item.iconLink)}" alt="">` : ''}
      <div class="info"><div class="small">${esc(e.item.name)}${e.fir ? ' <span class="badge fir">FIR</span>' : ''}</div><div class="for">${esc(e.quests.join(' · '))}</div></div>
      <div class="count"><button data-act="have" data-id="${e.item.id}" data-d="-1">−</button> <b>${have}/${e.count.toLocaleString()}</b> <button data-act="have" data-id="${e.item.id}" data-d="1">+</button></div>
    </div>`;
  }).join('');
  const keyRows = keys.map(k => `<div class="side-item" title="${esc(k.quests.join('\n'))}">
      ${k.keys[0].iconLink ? `<img loading="lazy" src="${esc(k.keys[0].iconLink)}" alt="">` : ''}
      <div class="info"><div class="small">${k.keys.map(x => esc(x.name)).join(' or ')}</div><div class="for">${k.map ? esc(k.map.name) + ' · ' : ''}${esc(k.quests.join(' · '))}</div></div></div>`).join('');
  const questList = quests.map(t => `<a href="#" data-act="goto" data-id="${t.id}">${esc(t.name)}</a>`).join(' · ');
  side.innerHTML = `<div class="panel">${head}
    <div class="sec"><h4>Items to hand in / use (${missing} still needed)</h4>${rows || '<div class="small muted">No items needed for your accepted quests.</div>'}</div>
    ${keyRows ? `<div class="sec"><h4>Keys</h4>${keyRows}</div>` : ''}
    <div class="sec small"><h4>Quests</h4>${questList || '<span class="muted">None accepted</span>'}</div>
    <div class="small muted" style="margin-top:8px">Counts use the same “have” numbers as the Items tab. Tick an objective on a quest card to drop its items.</div>
  </div>`;
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3000);
}

function update() { save(); render(); }

document.getElementById('layout').addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const { act, id } = el.dataset;
  if (act === 'toggle') {
    if (e.target.closest('input,a,button')) return;
    openTasks.has(id) ? openTasks.delete(id) : openTasks.add(id);
    render();
  } else if (act === 'done') {
    e.stopPropagation();
    const n = setTaskDone(id, el.checked);
    if (n) toast(`Also marked ${n} prerequisite quest${n > 1 ? 's' : ''} done`);
    update();
  } else if (act === 'obj') {
    el.checked ? (S.objs[id] = true) : delete S.objs[id];
    update();
  } else if (act === 'goto') {
    e.preventDefault();
    openTasks.add(id);
    const t = D.byId[id];
    S.ui.tab = 'quests'; S.ui.search = t.name; S.ui.trader = 'all'; S.ui.showDone = true; S.ui.showLocked = true; S.ui.showSkipped = true;
    if (!inFocus(t)) S.focus = 'all';
    update();
  } else if (act === 'skip') {
    const t = D.byId[id];
    if (S.skipped[id]) delete S.skipped[id];
    else {
      S.skipped[id] = true;
      toast(`“${t.name}” marked won't do${D.pathSet.has(id) ? ' — note: your prestige needs it' : ''}`);
    }
    update();
  } else if (act === 'snooze') {
    S.snoozed[id] ? delete S.snoozed[id] : (S.snoozed[id] = true);
    update();
  } else if (act === 'keyToggle') {
    e.preventDefault();
    S.have[id] = haveKey({ id }) ? 0 : 1;
    // In the planner, ticking a key selects the accepted quests it was holding back (and unticking deselects them).
    if (raidSelection && !S.raid && S.ui.raidMap === raidSelection.key) {
      const key = raidSelection.key, p = mapPlan(key);
      for (const t of [...p.finish, ...p.progress]) {
        if (!(S.active[t.id] || squadWith(t).length) || !questKeyGroups(t, key).some(g => g.some(k => k.id === id))) continue;
        keysReady(t, key) ? raidSelection.ids.add(t.id) : raidSelection.ids.delete(t.id);
      }
    }
    update();
  } else if (act === 'friendAdd') {
    const box = document.getElementById('friendCode');
    importFriendCode(box.value).then(r => { toast(`Added ${r.name}: ${r.active} active, ${r.done} done`); update(); })
      .catch(err => toast('Could not read code: ' + err.message));
  } else if (act === 'friendRemove') {
    if (!confirm(`Remove ${id}?`)) return;
    delete S.friends[id];
    S.squad = S.squad.filter(n => n !== id);
    raidSelection = null;
    update();
  } else if (act === 'squadToggle') {
    S.squad = el.checked ? [...new Set([...S.squad, id])] : S.squad.filter(n => n !== id);
    raidSelection = null;
    update();
  } else if (act === 'myCode') {
    myFriendCode().then(code => navigator.clipboard.writeText(code)).then(() => toast('Your sync code is on the clipboard'))
      .catch(err => toast('Could not copy: ' + err.message));
  } else if (act === 'raidPick') {
    S.ui.raidMap = id;
    update();
  } else if (act === 'raidSel') {
    el.checked ? raidSelection.ids.add(id) : raidSelection.ids.delete(id);
    render();
  } else if (act === 'raidStart') {
    S.raid = { map: S.ui.raidMap, quests: [...raidSelection.ids], startedAt: new Date().toISOString() };
    raidFloor = GROUND;
    update();
  } else if (act === 'raidSpawnPick') {
    pickingSpawn = !pickingSpawn;
    render();
  } else if (act === 'raidSpawnClear') {
    S.raid.spawn = null;
    pickingSpawn = false;
    update();
  } else if (act === 'routeGo') {
    const key = S.raid.map, def = D.mapDefs[key], r = raidRoute(key), st = r && r.stops[Number(id)];
    if (!st) return;
    if (hasFloors(def)) raidFloor = floorOf(def, st.p);
    if (raidMap) raidMap.setView([st.p.z, st.p.x], Math.max(raidMap.getZoom(), def.maxZoom - 1));
    render();
  } else if (act === 'raidFull') {
    if (raidMapEl && raidMapEl.requestFullscreen) raidMapEl.requestFullscreen();
  } else if (act === 'raidEnd') {
    if (raidMap) { raidMap.remove(); raidMap = null; raidMapKey = null; }
    S.raid.debrief = true;
    update();
    syncFromGame(false);
  } else if (act === 'raidClose' || act === 'raidCancel') {
    if (act === 'raidCancel' && !confirm('Cancel this raid plan?')) return;
    const r = S.raid;
    S.raid = null;
    raidSelection = null;
    if (raidMap) { raidMap.remove(); raidMap = null; raidMapKey = null; }
    update();
    if (act === 'raidClose') {
      const done = r.quests.filter(id => S.tasks[id] === 'done').length;
      toast(`Raid saved — ${done}/${r.quests.length} quests completed`);
    }
  } else if (act === 'sideToggle') {
    S.ui.sideOpen = false;
    update();
  } else if (act === 'syncApply') {
    if (id !== 'cancel' && pendingSync) {
      const auto = document.getElementById('autoSync');
      applyGameProgress(pendingSync, id === 'replace');
      S.logSync.auto = auto ? auto.checked : true;
      toast(`Applied game progress (${id})`);
    }
    pendingSync = null;
    update();
  } else if (act === 'chapter') {
    e.preventDefault();
    openChapters.add(id);
    S.ui.tab = 'story';
    update();
  } else if (act === 'chapterAll') {
    openChapters.has(id) ? openChapters.delete(id) : openChapters.add(id);
    render();
  } else if (act === 'chapterStart') {
    el.checked ? (S.storyStarted[id] = true) : delete S.storyStarted[id];
    update();
  } else if (act === 'storyUpTo') {
    const c = D.chapterOfStep[id];
    // Optional steps are often branch-specific, so only main steps are filled in.
    for (const o of c.objectives) { if (!o.optional || o.id === id) S.story[o.id] = true; if (o.id === id) break; }
    S.storyStarted[c.id] = true;
    update();
  } else if (act === 'story') {
    el.checked ? (S.story[id] = true) : delete S.story[id];
    update();
  } else if (act === 'gate') {
    S.gates[id] = true;
    toast(`Unlocked ${D.gateGroups[id].length} quests`);
    update();
  } else if (act === 'setupStep') {
    S.ui.setupStep = Number(id);
    update();
    window.scrollTo(0, 0);
  } else if (act === 'setupDone') {
    S.ui.tab = S.ui.setupBack && S.ui.setupBack !== 'setup' ? S.ui.setupBack : 'next';
    update();
  } else if (act === 'openSetup') {
    openSetup();
  } else if (act === 'keyFilter') {
    S.ui.keyFilter = id;
    update();
  } else if (act === 'map') {
    S.ui.map = id; update();
  } else if (act === 'pcheck') {
    el.checked ? (S.pchecks[id] = true) : delete S.pchecks[id];
    update();
  } else if (act === 'hideout') {
    const l = D.levelById[id];
    for (const x of l.station.levels) {
      if (el.checked && x.level <= l.level) S.hideout[x.id] = true;
      if (!el.checked && x.level >= l.level) delete S.hideout[x.id];
    }
    update();
  } else if (act === 'have') {
    S.have[id] = Math.max(0, (S.have[id] || 0) + Number(el.dataset.d));
    update();
  }
});

document.getElementById('layout').addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'haveSet') { S.have[el.dataset.id] = Math.max(0, Number(el.value) || 0); update(); return; }
  if (onSetupChange(el)) return;
  const flags = ['showDone', 'showLocked', 'showSkipped', 'hideoutNextOnly', 'hideoutPrestigeOnly', 'itemsHideDone', 'ignoreGates'];
  if (flags.includes(el.id)) { S.ui[el.id] = el.checked; update(); }
  if (el.id === 'traderFilter') { S.ui.trader = el.value; update(); }
  if (el.id === 'itemsHideout') { S.ui.itemsHideout = el.value; update(); }
  if (el.id === 'sortSel') { S.ui.sort = el.value; update(); }
  if (el.id === 'raidExtract' && S.raid) { S.raid.extract = el.value; update(); }
  if (el.id === 'myName') { S.myName = el.value.trim(); save(); }
  if ((el.id === 'friendLogFiles' || el.id === 'friendLogDir') && el.files.length) {
    toast('Reading log files…');
    importFriendLogs([...el.files]).then(msg => { toast(msg); update(); }).catch(err => toast('Could not import logs: ' + err.message));
  }
});

// <details> toggle events don't bubble, so listen in the capture phase.
document.getElementById('layout').addEventListener('toggle', e => {
  const id = e.target.dataset && e.target.dataset.fold;
  if (!id) return;
  S.ui.folds = { ...(S.ui.folds || {}), [id]: e.target.open };
  save();
}, true);

document.getElementById('layout').addEventListener('input', e => {
  if (e.target.id === 'friendName') { friendNameDraft = e.target.value; return; }
  if (e.target.id === 'search') { S.ui.search = e.target.value; update(); }
});

document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) { S.ui.tab = b.dataset.tab; S.ui.search = ''; update(); }
});
document.getElementById('lvl').addEventListener('change', e => { S.level = Math.max(1, Math.min(79, Number(e.target.value) || 1)); update(); });
document.getElementById('faction').addEventListener('change', e => { S.faction = e.target.value; update(); });
document.getElementById('focus').addEventListener('change', e => { S.focus = e.target.value; update(); });
document.getElementById('mode').addEventListener('change', e => { S.mode = e.target.value; save(); boot(false); });
// Inputs of the profile setup. Returns true when the change was one of them.
function onSetupChange(el) {
  const d = el.dataset;
  if (d.setup === 'level') S.level = Math.max(1, Math.min(79, Number(el.value) || 1));
  else if (d.setup === 'faction') S.faction = el.value;
  else if (d.setup === 'focus') S.focus = el.value;
  else if (d.setup === 'prestige') { S.prestige = Number(el.value) || 0; computeSets(); }
  else if (d.setup === 'mode') { S.mode = el.value; save(); boot(false); return true; }
  else if (d.trader) S.traders[d.trader] = Number(el.value);
  else if (d.rep) S.rep[d.rep] = Number(el.value) || 0;
  else if (d.skill) { if (el.value === '') delete S.skills[d.skill]; else S.skills[d.skill] = Math.max(0, Number(el.value) || 0); }
  else if (d.station) {
    const n = Number(el.value);
    for (const l of D.stationById[d.station].levels) l.level <= n ? (S.hideout[l.id] = true) : delete S.hideout[l.id];
  } else if (d.chapter) {
    // Main steps up to the chosen one are done, later ones aren't; optional (branch) steps are left alone.
    const c = D.chapterById[d.chapter], upTo = Number(el.value);
    c.objectives.filter(o => !o.optional).forEach((o, i) => { i <= upTo ? (S.story[o.id] = true) : delete S.story[o.id]; });
    if (upTo >= 0) S.storyStarted[c.id] = true;
  } else return false;
  update();
  return true;
}

const menu = document.getElementById('menu');
document.getElementById('menuBtn').addEventListener('click', e => { e.stopPropagation(); menu.hidden = !menu.hidden; });
menu.addEventListener('click', () => { menu.hidden = true; });
document.addEventListener('click', e => { if (!e.target.closest('.menu-wrap')) menu.hidden = true; });
document.getElementById('setupBtn').addEventListener('click', openSetup);
document.getElementById('refreshBtn').addEventListener('click', () => boot(true));
document.getElementById('syncBtn').addEventListener('click', () => syncFromGame(true));
document.getElementById('layout').addEventListener('dragover', e => { if (e.target.id === 'friendCode' || e.target.id === 'friendLogDrop') e.preventDefault(); });
document.getElementById('layout').addEventListener('drop', e => {
  if (e.target.id !== 'friendLogDrop' || !e.dataTransfer.files.length) return;
  e.preventDefault();
  toast('Reading log files…');
  importFriendLogs([...e.dataTransfer.files]).then(msg => { toast(msg); update(); }).catch(err => toast('Could not import logs: ' + err.message));
});
document.getElementById('layout').addEventListener('drop', async e => {
  if (e.target.id !== 'friendCode' || !e.dataTransfer.files.length) return;
  e.preventDefault();
  e.target.value = await e.dataTransfer.files[0].text();
});
document.getElementById('sideShow').addEventListener('click', () => { S.ui.sideOpen = true; update(); });
setInterval(() => { if (S.logSync && S.logSync.auto && !pendingSync) syncFromGame(false); }, AUTO_SYNC_MS);

document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tarkov-progress-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    const d = defaultState();
    S = { ...d, ...s, ui: { ...d.ui, ...(s.ui || {}) } };
    save(); computeSets(); render(); toast('Progress imported');
  } catch (err) { toast('Import failed: ' + err.message); }
  e.target.value = '';
});

document.getElementById('prestigeBtn').addEventListener('click', () => {
  if (!confirm(`Start prestige ${S.prestige + 1}? This clears quests, objectives, hideout, item counts and trader levels (your current run is archived in the export file).`)) return;
  S.history.push({ prestige: S.prestige, finishedAt: new Date().toISOString(), questsDone: Object.keys(S.tasks).length });
  S.prestige += 1;
  Object.assign(S, { level: 1, tasks: {}, objs: {}, hideout: {}, have: {}, pchecks: {}, traders: {}, gates: {}, story: {}, storyStarted: {}, rep: {}, skills: {}, active: {} });
  save(); computeSets(); render();
  toast(`Good luck on prestige ${S.prestige + 1}`);
});

async function boot(force) {
  document.getElementById('view').innerHTML = '<div class="loading">Loading quest data from tarkov.dev…</div>';
  try {
    D = indexData(await loadData(force));
    computeSets();
    render();
    if (force) toast('Data refreshed');
    if (!S.logSync || S.logSync.auto) syncFromGame(false);
  } catch (e) {
    D = null;
    document.getElementById('view').innerHTML = `<div class="panel">Couldn't load data from tarkov.dev: ${esc(e.message)}<br><br><button class="primary" onclick="boot(true)">Retry</button></div>`;
  }
}

render();
boot(false);
</script>
