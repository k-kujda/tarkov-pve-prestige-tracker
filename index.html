<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarkov PvE Prestige Tracker</title>
<style>
  :root {
    --bg: #12110f; --panel: #1c1b18; --panel2: #24221e; --line: #3a362e;
    --text: #e6e0d4; --muted: #9a927f; --accent: #c7b07a; --good: #6fae5f;
    --warn: #d9a441; --bad: #c25b4a; --blue: #6c9bd2; --purple: #a982d6;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  a { color: var(--accent); }
  button, select, input { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #1a1710; border-color: var(--accent); font-weight: 600; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  input[type=number] { width: 64px; }
  input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; vertical-align: middle; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 16px 0; }
  h1 { margin: 0 0 8px; font-size: 18px; color: var(--accent); letter-spacing: .5px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .settings label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  .spacer { flex: 1; }
  nav { display: flex; gap: 2px; margin-top: 10px; }
  nav button { border: none; border-radius: 6px 6px 0 0; background: transparent; padding: 8px 14px; color: var(--muted); }
  nav button.on { background: var(--panel); color: var(--accent); }
  .layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; max-width: 1600px; margin: 0 auto; padding: 0 16px; }
  .layout.side-hidden { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .layout.side-hidden aside { display: none; }
  main { padding: 16px 0; min-width: 0; }
  aside { position: sticky; top: var(--hdr, 150px); align-self: start; max-height: calc(100vh - var(--hdr, 150px)); overflow-y: auto; padding: 16px 0; }
  .side-item { display: flex; gap: 6px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .side-item.complete { opacity: .45; }
  .side-item img { width: 34px; height: 34px; object-fit: contain; flex: none; }
  .side-item .info { flex: 1; min-width: 0; }
  .side-item .for { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side-item .count { white-space: nowrap; font-size: 12px; }
  .side-item button { padding: 0 6px; }
  #sideShow { display: none; }
  .side-hidden ~ #sideShow, body.side-off #sideShow { display: inline-block; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } aside { position: static; max-height: none; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .bar { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; margin: 4px 0; }
  .bar > div { height: 100%; background: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; background: var(--panel2); font-size: 13px; }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .chip .n { color: var(--muted); margin-left: 4px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); margin-left: 4px; white-space: nowrap; }
  .badge.path { color: #1a1710; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .badge.kappa { color: var(--purple); border-color: var(--purple); }
  .badge.lk { color: var(--blue); border-color: var(--blue); }
  .badge.fir { color: var(--warn); border-color: var(--warn); }
  .badge.lock { color: var(--bad); border-color: var(--bad); }
  .badge.ok { color: var(--good); border-color: var(--good); }
  .badge.gate { color: var(--warn); border-color: var(--warn); }
  .task { border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); margin-bottom: 6px; }
  .task.done { opacity: .55; }
  .task-head { display: flex; gap: 10px; align-items: center; padding: 8px 10px; cursor: pointer; }
  .task-head .name { font-weight: 600; }
  .task-head .meta { color: var(--muted); font-size: 12px; }
  .task-body { padding: 4px 12px 12px 38px; border-top: 1px solid var(--line); }
  .obj { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; }
  .obj.done .desc { text-decoration: line-through; color: var(--muted); }
  .obj .detail { color: var(--muted); font-size: 12px; }
  .item { display: inline-flex; align-items: center; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px 1px 2px; margin: 2px 4px 2px 0; font-size: 12px; }
  .item img { width: 22px; height: 22px; object-fit: contain; }
  .sec { margin-top: 10px; }
  .sec h4 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr.complete { opacity: .5; }
  .station h3 { margin: 0 0 6px; font-size: 15px; }
  .lvl { border-top: 1px solid var(--line); padding: 6px 0; }
  .lvl.built { opacity: .5; }
  .group-title { margin: 16px 0 6px; font-size: 13px; color: var(--accent); text-transform: uppercase; letter-spacing: .6px; }
  #toast { position: fixed; bottom: 16px; right: 16px; background: var(--panel2); border: 1px solid var(--accent); padding: 8px 14px; border-radius: 6px; display: none; z-index: 20; }
  .loading { padding: 40px; text-align: center; color: var(--muted); }
  .search { min-width: 220px; }
  #raidMapBox { height: max(520px, calc(100vh - var(--hdr, 150px) - 110px)); border: 1px solid var(--line); border-radius: 8px; background: #0d0c0a; }
  .map-place { white-space: nowrap; font: 700 11px/1.1 "Segoe UI", sans-serif; color: #f3e6c4; text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 2px #000; text-transform: uppercase; letter-spacing: .4px; pointer-events: none; }
  #raidMapBox:fullscreen { height: 100vh; border: none; border-radius: 0; }
  #raidMapBox .leaflet-container { background: #0d0c0a; }
  .leaflet-tooltip, #raidMapBox .leaflet-tooltip { background: var(--panel2); color: var(--text); border-color: var(--line); box-shadow: 0 2px 10px rgba(0,0,0,.6); }
  #raidMapBox .leaflet-tooltip-top:before { border-top-color: var(--line); }
  #raidMapBox .leaflet-tooltip-bottom:before { border-bottom-color: var(--line); }
  #raidMapBox .leaflet-tooltip-left:before { border-left-color: var(--line); }
  #raidMapBox .leaflet-tooltip-right:before { border-right-color: var(--line); }
  .leaflet-tooltip.obj-tip { white-space: normal; width: max-content; max-width: 660px; }
  .tip-imgs { display: flex; gap: 6px; margin-top: 6px; }
  .tip-imgs figure { margin: 0; width: 210px; }
  .tip-imgs.many { flex-wrap: wrap; max-width: 660px; }
  .tip-imgs.many figure { width: 155px; }
  .tip-imgs.many img { width: 155px; height: 96px; }
  .tip-imgs img { width: 210px; height: 130px; object-fit: cover; border-radius: 4px; display: block; background: #000; }
  .tip-imgs figcaption { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .tip-item { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 11px; color: var(--muted); }
  .tip-item img { width: 40px; height: 40px; object-fit: contain; }
  .leaflet-control-layers, .leaflet-control-layers-expanded { background: rgba(28, 27, 24, .92) !important; color: var(--text) !important; border: 1px solid var(--line) !important; font: 12px "Segoe UI", sans-serif; }
  .leaflet-control-layers-toggle { filter: invert(.85); }
  .leaflet-control-layers label { margin: 2px 0; }
  .map-label { white-space: nowrap; font: 600 11px/1.2 "Segoe UI", sans-serif; color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 2px #000; }
  .map-label .dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; border: 1px solid #000; }
  .map-label.ext-pmc .dot { background: #6fdc5f; }
  .map-label.ext-scav .dot { background: #e6c84f; }
  .map-label.ext-shared .dot { background: #c77ae6; }
  .map-label.transit .dot { background: #4fb4e6; border-radius: 50%; }
  .route-num { background: #fff; color: #111; border-radius: 50%; font: 700 11px/20px "Segoe UI", sans-serif; text-align: center; box-shadow: 0 0 0 2px #000; }
  .route-num.away { opacity: .55; }
  .route-step { cursor: pointer; border-radius: 4px; }
  .route-step:hover { background: var(--panel2); }
  .floor-tag { background: #111; color: #ffd24a; border: 1px solid #ffd24a; border-radius: 3px; font: 700 10px/14px "Segoe UI", sans-serif; padding: 0 3px; white-space: nowrap; cursor: pointer; box-shadow: 0 0 3px #000; }
  .floor-tag.here { background: #ffd24a; color: #111; }
  .floor-ctl { background: rgba(28, 27, 24, .92); border: 1px solid var(--line); border-radius: 4px; padding: 3px; display: flex; flex-direction: column; gap: 2px; }
  .floor-ctl button { font: 700 11px "Segoe UI", sans-serif; padding: 3px 7px; min-width: 34px; }
  .floor-ctl button.on { border-color: var(--accent); color: #1a1710; background: var(--accent); }
  .route-num.static { display: inline-block; width: 20px; height: 20px; flex: none; }
  .map-label.route-start .dot { background: #3fa9f5; border-radius: 50%; width: 12px; height: 12px; }
  .map-label.route-end .dot { background: #fff; }
  .map-icon { font-size: 15px; line-height: 1; text-shadow: 0 0 3px #000; }
  .map-icon small { font: 600 10px "Segoe UI", sans-serif; color: #fff; margin-left: 2px; }
  .map-transition span { display: inline-flex; align-items: center; font-size: 12px; line-height: 1; padding: 1px 3px; border-radius: 4px;
    background: rgba(20, 60, 80, 0.85); border: 1px solid rgba(120, 230, 255, 0.8); cursor: pointer; white-space: nowrap; }
  .map-transition small { font: 700 10px "Segoe UI", sans-serif; color: #9fe8ff; margin-left: 1px; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .raid-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; }
  .raid-grid > .panel { max-height: max(520px, calc(100vh - var(--hdr, 150px) - 110px)); overflow-y: auto; }
  @media (max-width: 1200px) { .raid-grid { grid-template-columns: 1fr; } }
  table.rank td, table.rank th { white-space: nowrap; }
  .badge.skip { color: var(--muted); border-color: var(--muted); text-decoration: line-through; }
  .task.skipped { opacity: .45; }
  .badge.squad { color: #4fc1c9; border-color: #4fc1c9; }
  .item.key { cursor: pointer; user-select: none; }
  .item.key.have { border-color: var(--good); }
  .item.key.missing { border-color: var(--bad); }
  .keys-line { margin-top: 3px; }
  .objline.pickup span { color: #ffd24a; }
  .key-spawn { font-size: 16px; line-height: 1; text-shadow: 0 0 3px #000, 0 0 3px #000; cursor: pointer; }
  .loadout { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .loadout > div:not(.small) { margin-top: 3px; }
  .objline { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; color: var(--muted); margin: 2px 0; cursor: pointer; }
  .objline input { width: 14px; height: 14px; margin-top: 1px; }
  .objline.done span { text-decoration: line-through; opacity: .6; }
  #friendCode { width: 100%; min-height: 54px; font: 12px monospace; }
  .fold > summary { cursor: pointer; list-style: none; }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary h4 { display: inline; }
  .fold > summary::before { content: '▸ '; color: var(--accent); }
  .fold[open] > summary::before { content: '▾ '; }
  .raid-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
  @media (max-width: 1000px) { .raid-cols { grid-template-columns: 1fr; } }
  .col-title { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--accent); }
  .raid-quest { border-top: 1px solid var(--line); padding: 8px 0; }
  .raid-quest:first-of-type { border-top: none; padding-top: 0; }
  .raid-quest.done { opacity: .55; }
  .gear-strip { margin: 4px 0 2px; }
  .gear-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 3px 0; }
  .gear { display: inline-flex; align-items: center; justify-content: center; height: 52px; min-width: 52px; padding: 2px; background: #0d0c0a; border: 1px solid var(--line); border-radius: 4px; }
  .gear img { max-height: 46px; max-width: 150px; object-fit: contain; }
  .gear.not { border-color: var(--bad); opacity: .8; }
  .key-img { width: 56px; height: 56px; object-fit: contain; flex: none; align-self: flex-start; }
  .key-card .task-head { align-items: flex-start; }
  .menu-wrap { position: relative; }
  .menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; min-width: 270px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 6px 20px rgba(0,0,0,.6); }
  .menu[hidden] { display: none !important; }
  .menu button { text-align: left; display: flex; flex-direction: column; }
  .step-pills { margin-top: 8px; gap: 4px; }
  .step-pill { border-radius: 999px; font-size: 13px; }
  .step-pill.on { background: var(--accent); color: #1a1710; border-color: var(--accent); font-weight: 600; }
  .step-pill.past { border-color: var(--good); }
  .setup-grid { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; align-items: center; }
  .setup-grid label { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .setup td { vertical-align: middle; }
</style>
</head>
<body>
<header>
  <h1>Tarkov PvE Prestige Tracker</h1>
  <div class="row settings">
    <label>Level <input id="lvl" type="number" min="1" max="79"></label>
    <label>Faction <select id="faction"><option>USEC</option><option>BEAR</option></select></label>
    <label>Game mode <select id="mode"><option value="pve">PvE</option><option value="regular">PvP</option></select></label>
    <label>Focus <select id="focus">
      <option value="prestige">Prestige path only</option>
      <option value="kappa">Prestige + Kappa</option>
      <option value="all">All quests</option>
    </select></label>
    <span class="spacer"></span>
    <span id="prestigeNo" class="badge path"></span>
    <button id="sideShow" title="Show the accepted-quest items sidebar">Accepted items ▸</button>
    <button id="syncBtn" class="primary" title="Read your quest progress from the game's log files">Sync from game</button>
    <div class="menu-wrap">
      <button id="menuBtn" title="Profile setup, data and backups">☰ Menu</button>
      <div id="menu" class="menu" hidden>
        <button id="setupBtn" title="Everything the game logs can't tell the tracker, step by step"><b>🧭 Set up my profile</b><span class="small muted">level, traders, skills, hideout, story, keys</span></button>
        <button id="refreshBtn" title="Re-download quest/hideout data from tarkov.dev">Refresh data</button>
        <button id="exportBtn">Export progress</button>
        <button id="importBtn">Import progress</button>
        <button id="prestigeBtn" class="danger" title="Wipe quests/hideout/items and bump prestige counter">Start new prestige</button>
      </div>
    </div>
  </div>
  <nav id="tabs">
    <button data-tab="next">Next up</button>
    <button data-tab="raid" id="raidTab">Raid planner</button>
    <button data-tab="quests">All quests</button>
    <button data-tab="prestige">Prestige requirements</button>
    <button data-tab="hideout">Hideout</button>
    <button data-tab="items">Items needed</button>
    <button data-tab="keys">Keys</button>
    <button data-tab="story">Story</button>
    <button data-tab="completed">Completed quests</button>
  </nav>
</header>
<div class="layout" id="layout">
  <aside id="side"></aside>
  <main id="view"><div class="loading">Loading quest data from tarkov.dev…</div></main>
</div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
'use strict';

// Data comes from the local server (server.js), which repackages the public json.tarkov.dev datasets.
const LS_STATE = 'tpt-state-v1';
// Variants of the same location share quests, so group them together for raid planning.
const MAP_ALIASES = { 'ground-zero-21': 'ground-zero', 'ground-zero-tutorial': 'ground-zero', 'night-factory': 'factory', 'the-lab-dark': 'the-lab' };

// ---------- state ----------
const defaultState = () => ({
  level: 1, faction: 'USEC', mode: 'pve', focus: 'prestige', prestige: 0,
  traders: {}, tasks: {}, objs: {}, hideout: {}, have: {}, pchecks: {}, gates: {}, snoozed: {}, skipped: {}, story: {}, storyStarted: {}, rep: {}, skills: {}, active: {}, logSync: null, raid: null, friends: {}, squad: [], myName: '', history: [],
  ui: { sideOpen: true, tab: 'next', map: 'all', sort: 'fastest', search: '', trader: 'all', showDone: false, showLocked: false, hideoutNextOnly: true, hideoutPrestigeOnly: false, ignoreGates: false, itemsHideout: 'prestige', itemsHideDone: true, folds: {}, keyFilter: 'all', setupStep: 0, setupBack: 'next' },
});
let S = loadState();
let D = null;
let memo = new Map();
const openTasks = new Set();

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_STATE));
    if (s) {
      const d = defaultState();
      return { ...d, ...s, ui: { ...d.ui, ...(s.ui || {}) } };
    }
  } catch (e) { /* corrupt state falls through to defaults */ }
  return defaultState();
}
function save() { localStorage.setItem(LS_STATE, JSON.stringify(S)); }

// ---------- data ----------
async function loadData(force) {
  if (location.protocol === 'file:') throw new Error('Open the tracker through start-tracker.bat (http://localhost:4747), not as a file.');
  const res = await fetch(`/api/data?mode=${encodeURIComponent(S.mode)}${force ? '&refresh=1' : ''}`);
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
  if (json.status === 'stale') toast('json.tarkov.dev unreachable — using cached data');
  return json;
}

function indexData(raw) {
  const d = { ...raw, byId: {}, children: {}, stationById: {}, levelById: {} };
  for (const t of raw.tasks) { d.byId[t.id] = t; d.children[t.id] = []; }
  for (const t of raw.tasks) {
    for (const r of t.taskRequirements || []) {
      if (r.task && d.children[r.task.id]) d.children[r.task.id].push(t.id);
    }
  }
  for (const s of raw.hideoutStations) {
    d.stationById[s.id] = s;
    for (const l of s.levels) d.levelById[l.id] = { ...l, station: s };
  }
  d.keyById = Object.fromEntries((raw.keys || []).map(k => [k.id, k]));
  d.traders = (raw.traders || []).filter(tr => raw.tasks.some(t => t.trader && t.trader.id === tr.id));
  d.descendants = {};
  const desc = id => {
    if (d.descendants[id]) return d.descendants[id];
    const set = new Set();
    d.descendants[id] = set; // guards against cycles
    for (const c of d.children[id]) { set.add(c); for (const x of desc(c)) set.add(x); }
    return set;
  };
  for (const t of raw.tasks) desc(t.id);
  for (const [k, v] of Object.entries(raw.mapDefs || {})) v._key = k;
  d.storyChapters = raw.storyChapters || [];
  d.chapterById = {};
  d.chapterOfStep = {};
  for (const c of d.storyChapters) { d.chapterById[c.id] = c; for (const o of c.objectives) d.chapterOfStep[o.id] = c; }
  // Story steps that gate quests: step id -> quest ids.
  d.stepQuests = {};
  for (const t of raw.tasks) for (const o of t.otherRequirements || []) {
    if (o.type === 'storyObjective' && o.objective) (d.stepQuests[o.objective.id] = d.stepQuests[o.objective.id] || []).push(t.id);
  }
  d.gateGroups = {};
  for (const t of raw.tasks) for (const g of gatesOf(t)) (d.gateGroups[g] = d.gateGroups[g] || []).push(t.id);
  // Traders a quest unlocks (Introduction -> Jaeger, Easy Money - Part 1 -> Ref): trader key -> quest ids.
  d.traderUnlockedBy = {};
  for (const t of raw.tasks) for (const u of (t.finishRewards && t.finishRewards.traderUnlock) || []) {
    if (u && u.normalizedName) (d.traderUnlockedBy[u.normalizedName] = d.traderUnlockedBy[u.normalizedName] || []).push(t.id);
  }
  return d;
}

// Prestige level you're working towards = current prestige + 1.
function currentPrestige() {
  if (!D.prestige || !D.prestige.length) return null;
  const sorted = [...D.prestige].sort((a, b) => a.prestigeLevel - b.prestigeLevel);
  return sorted.find(p => p.prestigeLevel === S.prestige + 1) || sorted[sorted.length - 1];
}

function prestigeRootTasks() {
  const p = currentPrestige();
  return p ? p.conditions.filter(c => c.task && D.byId[c.task.id]).map(c => c.task.id) : [];
}

const stationLevel = (stationId, level) => {
  const st = D.stationById[stationId];
  const l = st && st.levels.find(x => x.level === level);
  return l ? D.levelById[l.id] : null;
};

// Hideout levels the next prestige needs, plus everything they depend on (lower levels, other stations).
function prestigeHideoutLevels() {
  const out = new Set();
  const walk = l => {
    if (!l || out.has(l.id)) return;
    out.add(l.id);
    walk(stationLevel(l.station.id, l.level - 1));
    for (const r of l.stationLevelRequirements || []) if (r.station) walk(stationLevel(r.station.id, r.level));
  };
  const p = currentPrestige();
  for (const c of p ? p.conditions : []) {
    if (c.type === 'hideoutStation' && c.station) walk(stationLevel(c.station.id, c.stationLevel));
  }
  return out;
}

const stationBuilt = (stationId, level) => {
  const st = D.stationById[stationId];
  return !!st && st.levels.some(l => l.level >= level && S.hideout[l.id]);
};

// playerLevels[].exp is the XP needed to go from the previous level to this one.
const xpBetween = (from, to) => (D.playerLevels || []).filter(p => p.level > from && p.level <= to).reduce((sum, p) => sum + p.exp, 0);

const SKILL_TIPS = {
  Strength: 'Sprint or jump while carrying weight, throw grenades, melee.',
  Endurance: 'Sprint and jump (works best while not overweight).',
  Charisma: 'Levels automatically as you raise Attention, Perception and Intellect (searching, looting, examining and repairing items).',
};

function ancestorsOf(ids) {
  const out = new Set();
  const walk = id => {
    if (out.has(id)) return;
    out.add(id);
    const t = D.byId[id];
    if (!t) return;
    for (const r of t.taskRequirements || []) if (r.task) walk(r.task.id);
  };
  ids.forEach(walk);
  return out;
}

function computeSets() {
  D.pathSet = ancestorsOf(prestigeRootTasks());
  D.kappaSet = ancestorsOf(D.tasks.filter(t => t.kappaRequired).map(t => t.id));
  D.hideoutPath = prestigeHideoutLevels();
}

// ---------- task logic ----------
const gatesOf = t => (t.otherRequirements || []).filter(o => o.type === 'globalVariable' && o.variableId && !o.counter).map(o => o.variableId);
const storyReqsOf = t => (t.otherRequirements || []).filter(o => o.type === 'storyObjective' && o.objective);
const counterProgress = o => o.counter.taskIds.filter(id => S.tasks[id] === 'done').length;
const gateOpen = g => S.ui.ignoreGates || !!S.gates[g];
const factionOk = t => !t.factionName || t.factionName === 'Any' || t.factionName === S.faction;

// In 1.x traders and maps open up through the Tour story chapter (wiki "Tour"). A stage is complete when
// any step in `any` (or every step in `all`) is ticked. Ground Zero, Interchange, Therapist, Ragman and Fence
// are open from the start; a locked map can still be reached by transit, but not picked from the menu.
// The BTR driver (Streets) and Lightkeeper (Lighthouse) are met in raid, so they open with their map.
const TOUR_STAGES = [
  { any: ['68c6a8ea578cb34230742497', '6895c24ec097ed522295a05d'], traders: ['btr-driver'], maps: ['streets-of-tarkov'] },
  { any: ['68cc123af7f4373ce2365213'], traders: ['skier'], maps: ['customs'] },
  { any: ['6895c4a6b9a96237b73e15a1'], traders: ['mechanic'], maps: ['factory'] },
  { any: ['6895daa6f935f3dbe1de0a9d'], traders: ['prapor'], maps: ['woods'] },
  { all: ['68c42742aba9a345346af424', '69bd84d0e08ef0a8d3a85950'], traders: ['peacekeeper'], maps: ['shoreline'] },
  // After the Terminal, Reserve, Lighthouse and The Lab are separate branches.
  { any: ['68c6a97215db207712d81624', '6896020e3af3adc94b263d60'], maps: ['reserve'] },
  { any: ['68c6a969f7d6765264b9c44f', '6895d2d18f186d19d54d102c'], traders: ['lightkeeper'], maps: ['lighthouse'] },
  { any: ['68c6b0a3cb1c5c519963e7af', '68c6aa4040bb6d7ff66c0abb'], maps: ['the-lab'] },
];
const TOUR_LINEAR_STAGES = 5;
const tourChapter = () => D.chapterById.tour;

// What the Tour still keeps locked: trader / map key -> the Tour step that unlocks it. Recomputed per render.
let tourCache = null;
function tourLocks() {
  if (tourCache && tourCache.memo === memo) return tourCache;
  const traders = new Map(), maps = new Map(), chapter = tourChapter();
  if (chapter) {
    const done = TOUR_STAGES.map(s => (s.any ? s.any.some(id => S.story[id]) : s.all.every(id => S.story[id])));
    // The first stages run in order, and every later stage implies the ones before it.
    for (let i = TOUR_LINEAR_STAGES - 1; i >= 0; i--) done[i] = done[i] || done.slice(i + 1).some(Boolean);
    TOUR_STAGES.forEach((s, i) => {
      if (done[i]) return;
      const ids = s.any || s.all;
      const step = (chapter.objectives.find(o => o.id === ids[ids.length - 1]) || {}).description || 'Tour';
      for (const x of s.traders || []) traders.set(x, step);
      for (const x of s.maps || []) maps.set(x, step);
    });
  }
  tourCache = { memo, traders, maps };
  return tourCache;
}

// A started or finished quest from a Tour-unlocked trader proves that stage: tick the main steps up to it.
// A branch stage (Reserve / Lighthouse / Lab) proves the in-order stages plus only its own steps.
function proveTourStage(trader) {
  const chapter = tourChapter(), i = TOUR_STAGES.findIndex(x => (x.traders || []).includes(trader));
  if (!chapter || i < 0) return;
  const lastOf = s => (s.any || s.all)[(s.any || s.all).length - 1];
  const last = lastOf(TOUR_STAGES[Math.min(i, TOUR_LINEAR_STAGES - 1)]);
  for (const o of chapter.objectives) { if (!o.optional) S.story[o.id] = true; if (o.id === last) break; }
  if (i >= TOUR_LINEAR_STAGES) for (const id of TOUR_STAGES[i].any || TOUR_STAGES[i].all) S.story[id] = true;
}

function inFocus(t) {
  // When the prestige needs no quests, every quest is just a source of XP and money.
  if (S.focus === 'all' || (S.focus === 'prestige' && !D.pathSet.size)) return true;
  if (D.pathSet.has(t.id)) return true;
  return S.focus === 'kappa' && D.kappaSet.has(t.id);
}

function cmp(a, method, b) {
  switch (method) {
    case '>': return a > b;
    case '<': return a < b;
    case '<=': return a <= b;
    case '=': case '==': return a === b;
    default: return a >= b;
  }
}

// Returns { status: 'done'|'failed'|'available'|'locked', reasons: [] }
function taskState(t) {
  if (memo.has(t.id)) return memo.get(t.id);
  memo.set(t.id, { status: 'locked', reasons: ['circular requirement'] });
  let res;
  const st = S.tasks[t.id];
  if (st === 'done' || st === 'failed') {
    res = { status: st, reasons: [] };
  } else {
    const reasons = [];
    for (const r of t.taskRequirements || []) {
      const p = r.task && D.byId[r.task.id];
      if (!p) continue;
      const want = r.status && r.status.length ? r.status : ['complete'];
      const ps = S.tasks[p.id];
      const ok = (want.includes('complete') && ps === 'done')
        || (want.includes('failed') && ps === 'failed')
        || (want.includes('active') && (ps === 'done' || taskState(p).status === 'available'));
      if (!ok) reasons.push(`${want.includes('active') ? 'Start' : 'Finish'} “${p.name}”`);
    }
    if ((t.minPlayerLevel || 0) > S.level) reasons.push(`Level ${t.minPlayerLevel}`);
    if (gatesOf(t).some(g => !gateOpen(g))) reasons.push('Unlocks in game');
    for (const o of t.otherRequirements || []) {
      // Server-side unlock counters: the variable rises as you finish a known set of quests.
      if (o.type === 'globalVariable' && o.counter) {
        const n = counterProgress(o);
        if (!cmp(n, o.compareMethod, o.value)) reasons.push(`Finish ${o.value - n} more ${t.trader.name} quest${o.value - n > 1 ? 's' : ''} (${n}/${o.value})`);
      }
    }
    for (const o of storyReqsOf(t)) if (!S.story[o.objective.id]) reasons.push(`Story: ${o.storyChapter.name} — ${o.objective.name}`);
    // Reasons that only depend on the trader (not unlocked yet, loyalty or reputation too low).
    const traderReasons = [];
    const tour = tourLocks();
    if (t.trader && tour.traders.has(t.trader.normalizedName)) traderReasons.push(`${t.trader.name} not unlocked — Tour: ${tour.traders.get(t.trader.normalizedName)}`);
    const unlockers = t.trader && D.traderUnlockedBy[t.trader.normalizedName];
    if (unlockers && !unlockers.some(id => S.tasks[id] === 'done')) traderReasons.push(`${t.trader.name} not unlocked — finish ${unlockers.map(id => `“${D.byId[id].name}”`).join(' or ')}`);
    for (const r of t.traderRequirements || []) {
      if (!r.trader) continue;
      if (r.requirementType === 'level' && !cmp(S.traders[r.trader.id] || 1, r.compareMethod, r.value)) traderReasons.push(`${r.trader.name} LL${r.value}`);
      if (r.requirementType === 'reputation' && !cmp(S.rep[r.trader.id] || 0, r.compareMethod, r.value)) traderReasons.push(`${r.trader.name} rep ${r.compareMethod} ${r.value}`);
    }
    const maps = taskMaps(t).map(m => mapKey(m.normalizedName));
    if (maps.length && maps.every(k => tour.maps.has(k))) reasons.push(`${maps.map(mapName).join(' / ')} not unlocked — Tour: ${tour.maps.get(maps[0])} (or transit in)`);
    const traderOnly = !reasons.length && traderReasons.length > 0;
    reasons.push(...traderReasons);
    res = { status: reasons.length && !S.active[t.id] ? 'locked' : 'available', reasons: S.active[t.id] ? [] : reasons, traderOnly: traderOnly && !S.active[t.id] };
  }
  memo.set(t.id, res);
  return res;
}

function remainingDescendants(t) {
  let n = 0;
  for (const id of D.descendants[t.id]) if (!S.tasks[id]) n++;
  return n;
}

function setTaskDone(id, done) {
  if (!done) { delete S.tasks[id]; return 0; }
  // Marking a quest done implies its prerequisites are done — handy when catching up mid-prestige.
  let auto = 0;
  const walk = tid => {
    const t = D.byId[tid];
    for (const r of t.taskRequirements || []) {
      const want = r.status && r.status.length ? r.status : ['complete'];
      if (!r.task || !D.byId[r.task.id] || S.tasks[r.task.id] || !want.includes('complete')) continue;
      S.tasks[r.task.id] = 'done'; auto++;
      walk(r.task.id);
    }
  };
  S.tasks[id] = 'done';
  walk(id);
  markUnlocksProven();
  return auto;
}

// A quest that was started or finished proves its unlock batch / story step is open.
function markUnlocksProven() {
  for (const tid of [...Object.keys(S.tasks), ...Object.keys(S.active)]) {
    const t = D.byId[tid] || {};
    for (const g of gatesOf(t)) S.gates[g] = true;
    for (const o of storyReqsOf(t)) S.story[o.objective.id] = true;
    if (t.trader) proveTourStage(t.trader.normalizedName);
  }
}

// ---------- game log sync ----------
let pendingSync = null;
const AUTO_SYNC_MS = 60 * 1000;

async function fetchGameProgress() {
  const res = await fetch(`/api/game-progress?mode=${encodeURIComponent(S.mode)}`);
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
  return json;
}

const syncCounts = r => {
  const known = Object.entries(r.quests).filter(([id]) => D.byId[id]);
  const n = st => known.filter(([, v]) => v === st).length;
  return { done: n('done'), failed: n('failed'), active: n('active') };
};

// replace: the tracker's quest ticks become exactly the game's; merge: only add what the game reports.
function applyGameProgress(r, replace) {
  const before = Object.keys(S.tasks).length;
  if (replace) S.tasks = {};
  S.active = {};
  for (const [id, st] of Object.entries(r.quests)) {
    if (!D.byId[id]) continue;
    if (st === 'done' || st === 'failed') { S.tasks[id] = st; delete S.snoozed[id]; }
    if (st === 'active' && !S.tasks[id]) { S.active[id] = true; delete S.snoozed[id]; }
  }
  markUnlocksProven();
  S.logSync = { since: r.since, lastEventAt: r.lastEventAt, at: new Date().toISOString(), auto: S.logSync ? S.logSync.auto : true };
  return Object.keys(S.tasks).length - before;
}

async function syncFromGame(interactive) {
  if (!D) return;
  let r;
  try { r = await fetchGameProgress(); } catch (e) { if (interactive) toast('Game log sync failed: ' + e.message); return; }
  const resetChanged = !!S.logSync && S.logSync.since !== r.since;
  // Only ask when applying could throw away something: tracker ticks the logs don't confirm, or a new reset.
  if (resetChanged || syncConflicts(r) > 0) {
    if (!interactive) {
      if (!pendingSync) toast(resetChanged ? 'Game logs show a new reset (prestige?) — press “Sync from game” to review' : 'Game progress found — press “Sync from game” to review');
      return;
    }
    pendingSync = r;
    S.ui.tab = 'next';
    update();
    return;
  }
  if (!interactive && S.logSync && r.lastEventAt === S.logSync.lastEventAt) return;
  const first = !S.logSync;
  const added = applyGameProgress(r, false);
  update();
  const c = syncCounts(r);
  toast(first ? `Imported from game logs: ${c.done} done, ${c.active} active quests`
    : added > 0 ? `Synced from game: +${added} quest${added > 1 ? 's' : ''}` : `Up to date with the game (${c.done} done, ${c.active} active)`);
}

// Quests ticked in the tracker that the game logs don't show as done/failed for this run.
const syncConflicts = r => Object.keys(S.tasks).filter(id => !(r.quests[id] === 'done' || r.quests[id] === 'failed')).length;

function syncPanel() {
  if (!pendingSync) return '';
  const r = pendingSync, c = syncCounts(r);
  const manual = Object.keys(S.tasks).filter(id => !(r.quests[id] === 'done' || r.quests[id] === 'failed')).length;
  return `<div class="panel" style="border-color:var(--accent)">
    <b>Game progress found</b> <span class="small muted">(${esc(r.logsPath)} · ${r.folders} log folders)</span>
    <div style="margin:6px 0">Current run ${r.since ? `since <b>${esc(r.since)}</b> (last prestige/wipe detected in the logs)` : 'from the start of your logs'}:
      <b>${c.done}</b> done · <b>${c.active}</b> active in game · <b>${c.failed}</b> failed. Last quest event: ${esc(r.lastEventAt || '—')}.</div>
    ${manual ? `<div class="small muted">${manual} quest(s) ticked in the tracker aren't in the game logs for this run — “Replace” unticks them, “Merge” keeps them.</div>` : ''}
    <div class="row" style="margin-top:8px">
      <button class="primary" data-act="syncApply" data-id="replace">Replace with game progress</button>
      <button data-act="syncApply" data-id="merge">Merge</button>
      <button data-act="syncApply" data-id="cancel">Cancel</button>
      <label class="small muted"><input type="checkbox" id="autoSync" ${!S.logSync || S.logSync.auto ? 'checked' : ''}> keep syncing automatically every minute</label>
    </div></div>`;
}

function taskMaps(t) {
  const m = new Map();
  const add = mp => {
    const key = MAP_ALIASES[mp.normalizedName] || mp.normalizedName;
    if (!m.has(key)) m.set(key, key === mp.normalizedName ? mp : (D.maps.find(x => x.normalizedName === key) || mp));
  };
  if (t.map) add(t.map);
  for (const o of t.objectives) for (const mp of o.maps || []) add(mp);
  return [...m.values()];
}

// ---------- render helpers ----------
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const itemChip = (it, count, fir) => `<span class="item">${it.iconLink ? `<img loading="lazy" src="${esc(it.iconLink)}" alt="">` : ''}${count ? `<b>${count}×</b>` : ''} ${esc(it.name)}${fir ? '<span class="badge fir">FIR</span>' : ''}</span>`;

function objectiveDetail(o) {
  const b = [];
  if (o.items && o.items.length) {
    const shown = o.items.slice(0, 4).map(it => itemChip(it, null, false)).join('');
    b.push(`${o.count ? `<b>${o.count}×</b> ` : ''}${o.foundInRaid ? '<span class="badge fir">Found in raid</span> ' : ''}${shown}${o.items.length > 4 ? ` <span class="muted">+${o.items.length - 4} alternatives</span>` : ''}`);
  }
  if (o.questItem) b.push(`Quest item: <b>${esc(o.questItem.name)}</b>`);
  if (o.markerItem) b.push(`Use: <b>${esc(o.markerItem.name)}</b>`);
  if (o.targetNames && o.targetNames.length) b.push(`Target: ${esc(o.targetNames.join(', '))}${o.count ? ` ×${o.count}` : ''}`);
  if (o.zoneNames && o.zoneNames.length) b.push(`Zone: ${esc(o.zoneNames.join(', '))}`);
  if (o.bodyParts && o.bodyParts.length) b.push(`Body parts: ${esc(o.bodyParts.join(', '))}`);
  if (o.usingWeapon && o.usingWeapon.length) b.push(`Weapon: ${esc(o.usingWeapon.slice(0, 5).map(w => w.name).join(', '))}${o.usingWeapon.length > 5 ? '…' : ''}`);
  if (o.exitName) b.push(`Exit: <b>${esc(o.exitName)}</b>`);
  if (o.useAny && o.useAny.length) b.push(`Use: ${esc(o.useAny.map(x => x.name).join(' / '))}`);
  if (o.skillLevel) b.push(`Skill: ${esc(o.skillLevel.name)} ${o.skillLevel.level}`);
  if (o.trader && o.level) b.push(`${esc(o.trader.name)} LL${o.level}`);
  if (o.playerLevel) b.push(`Reach level ${o.playerLevel}`);
  if (o.item && o.type === 'buildWeapon') b.push(`Build: <b>${esc(o.item.name)}</b> (see wiki for required parts)`);
  if (o.requiredKeys && o.requiredKeys.length) b.push(`Keys: ${esc(o.requiredKeys.flat().map(k => k.name).join(', '))}`);
  if (o.maps && o.maps.length) b.push(`Map: ${o.maps.map(m => `<a href="https://tarkov.dev/map/${esc(m.normalizedName)}" target="_blank" rel="noopener">${esc(m.name)}</a>`).join(', ')}`);
  return b.join(' · ');
}

function rewardsText(t) {
  const r = t.finishRewards || {};
  const parts = [];
  if (t.experience) parts.push(`${t.experience.toLocaleString()} XP`);
  for (const s of r.traderStanding || []) parts.push(`${esc(s.trader.name)} ${s.standing > 0 ? '+' : ''}${s.standing}`);
  for (const i of r.items || []) parts.push(`${i.count > 1 ? i.count.toLocaleString() + '× ' : ''}${esc(i.item.name)}`);
  for (const o of r.offerUnlock || []) parts.push(`Unlocks ${esc(o.item.name)} @ ${esc(o.trader.name)} LL${o.level}`);
  for (const s of r.skillLevelReward || []) parts.push(`${esc(s.name)} +${s.level}`);
  for (const u of r.traderUnlock || []) parts.push(`Unlocks trader ${esc(u.name)}`);
  return parts.join(' · ');
}

function taskCard(t) {
  const st = taskState(t);
  const open = openTasks.has(t.id);
  const maps = taskMaps(t);
  const badges = [
    D.pathSet.has(t.id) ? '<span class="badge path">PRESTIGE</span>' : '',
    t.kappaRequired ? '<span class="badge kappa">Kappa</span>' : '',
    t.lightkeeperRequired ? '<span class="badge lk">LK</span>' : '',
    st.status === 'locked' ? `<span class="badge lock" title="${esc(st.reasons.join(', '))}">🔒 ${esc(st.reasons[0])}${st.reasons.length > 1 ? ` +${st.reasons.length - 1}` : ''}</span>` : '',
    st.status === 'failed' ? '<span class="badge lock">Failed</span>' : '',
    S.snoozed[t.id] && !S.tasks[t.id] ? '<span class="badge">hidden</span>' : '',
    isSkipped(t) && !S.tasks[t.id] ? '<span class="badge skip" title="You marked this as a quest you will never do">won\'t do</span>' : '',
    S.active[t.id] && !S.tasks[t.id] ? '<span class="badge ok" title="Started in game (from your game logs)">active in game</span>' : '',
    (t.otherRequirements || []).some(o => o.type === 'dialogue') ? '<span class="badge gate" title="Offered through trader dialogue">dialogue</span>' : '',
  ].join('');
  const unlocks = remainingDescendants(t);
  let html = `<div class="task ${st.status === 'done' || st.status === 'failed' ? 'done' : ''} ${isSkipped(t) && !S.tasks[t.id] ? 'skipped' : ''}" data-task="${t.id}">
    <div class="task-head" data-act="toggle" data-id="${t.id}">
      <input type="checkbox" data-act="done" data-id="${t.id}" ${st.status === 'done' ? 'checked' : ''} title="Mark quest complete">
      <div style="flex:1">
        <div><span class="name">${esc(t.name)}</span>${badges}</div>
        <div class="meta">${esc(t.trader ? t.trader.name : '?')} · ${maps.length ? maps.map(m => esc(m.name)).join(', ') : 'Any map'} · Lvl ${t.minPlayerLevel || 1} · ${(t.experience || 0).toLocaleString()} XP${moneyText(t) ? ` · ${moneyText(t)}` : ''}${unlocks ? ` · unlocks ${unlocks} more` : ''}</div>
      </div>
      ${!S.tasks[t.id] ? `<button class="small" data-act="skip" data-id="${t.id}" title="${isSkipped(t) ? 'Put this quest back in your lists' : 'Never show this quest in Next up, the raid planner or item lists'}">${isSkipped(t) ? 'undo won\'t do' : 'won\'t do'}</button>` : ''}
      ${st.status === 'available' && !S.active[t.id] && !S.snoozed[t.id] && !isSkipped(t) ? `<button class="small" data-act="snooze" data-id="${t.id}" title="Not offered at the trader in game — hide it until the game shows you accepted it">hide</button>` : ''}
      <span class="muted">${open ? '▾' : '▸'}</span>
    </div>`;
  if (open) {
    const objs = t.objectives.map(o => {
      const done = !!S.objs[o.id];
      return `<div class="obj ${done ? 'done' : ''}">
        <input type="checkbox" data-act="obj" data-id="${o.id}" ${done ? 'checked' : ''}>
        <div><div class="desc">${esc(o.description)}${o.optional ? ' <span class="badge">optional</span>' : ''}${o.override ? ` <span class="badge" title="${esc(o.override.source || '')}">updated for patch ${esc((o.override.patch || '').split('.').slice(0, 2).join('.'))}</span>` : ''}</div><div class="detail">${objectiveDetail(o)}</div></div>
      </div>`;
    }).join('');
    const keys = (t.neededKeys || []).map(k => `<div>${esc(k.map ? k.map.name : '')}: ${k.keys.map(x => itemChip(x)).join(' or ')}</div>`).join('');
    const reqs = (t.taskRequirements || []).filter(r => r.task && D.byId[r.task.id]).map(r => {
      const p = D.byId[r.task.id];
      return `<a href="#" data-act="goto" data-id="${p.id}">${esc(p.name)}</a>${S.tasks[p.id] ? ' ✓' : ''}`;
    }).join(', ');
    const traderReqs = (t.traderRequirements || []).map(r => `${esc(r.trader.name)} ${r.requirementType === 'level' ? 'LL' : r.requirementType + ' '}${r.compareMethod && r.compareMethod !== '>=' ? r.compareMethod : ''}${r.value}${r.source === 'wiki' ? ' (wiki)' : ''}`).join(', ');
    const counterNotes = (t.otherRequirements || []).filter(o => o.type === 'globalVariable' && o.counter).map(o =>
      `Unlocks after ${o.value} of these are done (${counterProgress(o)}/${o.value}): ${o.counter.taskIds.filter(id => D.byId[id]).map(id => `<a href="#" data-act="goto" data-id="${id}">${esc(D.byId[id].name)}</a>${S.tasks[id] === 'done' ? ' ✓' : ''}`).join(', ')}`);
    const storyNotes = storyReqsOf(t).map(o => `Story step: <b>${esc(o.storyChapter.name)}</b> — ${esc(o.objective.name)}${S.story[o.objective.id] ? ' ✓' : ''}`);
    const gateNote = gatesOf(t).length ? `Unlocked server-side (story / trader progress) together with ${gatesOf(t).map(g => D.gateGroups[g].length - 1).reduce((a, b) => a + b, 0)} other quest(s) — mark it available once it shows up in game.` : '';
    const next = D.children[t.id].map(id => D.byId[id]).filter(factionOk).map(c => `<a href="#" data-act="goto" data-id="${c.id}">${esc(c.name)}</a>`).join(', ');
    const links = [
      t.wikiLink ? `<a href="${esc(t.wikiLink)}" target="_blank" rel="noopener">Wiki guide</a>` : '',
      `<a href="https://tarkov.dev/task/${esc(t.normalizedName)}" target="_blank" rel="noopener">tarkov.dev (map markers)</a>`,
      ...maps.map(m => `<a href="https://tarkov.dev/map/${esc(m.normalizedName)}" target="_blank" rel="noopener">${esc(m.name)} map</a>`),
    ].filter(Boolean).join(' · ');
    html += `<div class="task-body">
      <div class="sec"><h4>Objectives</h4>${objs}</div>
      ${keys ? `<div class="sec"><h4>Keys needed</h4>${keys}</div>` : ''}
      <div class="sec"><h4>Rewards</h4><div class="small">${rewardsText(t) || '—'}</div></div>
      ${reqs || traderReqs || gateNote || counterNotes.length || storyNotes.length ? `<div class="sec"><h4>Requires</h4><div class="small">${[reqs, traderReqs, ...counterNotes, ...storyNotes, gateNote].filter(Boolean).join('<br>')}</div></div>` : ''}
      ${next ? `<div class="sec"><h4>Leads to</h4><div class="small">${next}</div></div>` : ''}
      <div class="sec small">${links}</div>
      ${st.status === 'available' || S.snoozed[t.id] ? `<div class="sec"><button data-act="snooze" data-id="${t.id}">${S.snoozed[t.id] ? 'Show in Next up again' : 'Not offered in game yet — hide'}</button></div>` : ''}
    </div>`;
  }
  return html + '</div>';
}

// Rough trader exchange rates — only used to rank quests by cash reward.
const RUB_PER = { RUB: 1, USD: 140, EUR: 155 };
const moneyValue = t => Object.entries((t.finishRewards || {}).money || {}).reduce((s, [cur, n]) => s + n * (RUB_PER[cur] || 0), 0);
const moneyText = t => Object.entries((t.finishRewards || {}).money || {}).map(([cur, n]) => `${n.toLocaleString()} ${{ RUB: '₽', USD: '$', EUR: '€' }[cur] || cur}`).join(' + ');

// "fastest": prestige-required quests first (ordered by how much they unblock), then the rest by XP.
function byPriority(a, b) {
  const by = {
    xp: () => (b.experience || 0) - (a.experience || 0),
    money: () => moneyValue(b) - moneyValue(a),
    unlocks: () => remainingDescendants(b) - remainingDescendants(a),
  };
  let r = 0;
  if (S.ui.sort === 'fastest') {
    const pa = D.pathSet.has(a.id), pb = D.pathSet.has(b.id);
    if (pa !== pb) return pa ? -1 : 1;
    r = pa ? by.unlocks() || by.xp() : by.xp() || by.unlocks();
  } else {
    r = (by[S.ui.sort] || by.xp)();
  }
  return r || (a.minPlayerLevel || 0) - (b.minPlayerLevel || 0);
}

function prestigeSummary() {
  const p = currentPrestige();
  if (!p) return '<div class="panel muted">No prestige data for this game mode.</div>';
  const skippedOnPath = [...D.pathSet].map(id => D.byId[id]).filter(t => t && isSkipped(t) && !S.tasks[t.id]);
  const skipWarn = skippedOnPath.length ? `<div class="small" style="color:var(--bad);margin-top:4px">⚠ Marked “won't do” but needed for this prestige: ${skippedOnPath.map(t => esc(t.name)).join(', ')}</div>` : '';
  const met = p.conditions.filter(conditionMet).length;
  const lvlCond = p.conditions.find(c => c.type === 'playerLevel');
  let xpLine = '';
  if (lvlCond && S.level < lvlCond.playerLevel) {
    const need = xpBetween(S.level, lvlCond.playerLevel);
    if (need > 0) xpLine = ` · ~${need.toLocaleString()} XP from the start of level ${S.level} to level ${lvlCond.playerLevel}`;
  }
  const items = p.conditions.map(c => `<span class="badge ${conditionMet(c) ? 'ok' : ''}">${conditionMet(c) ? '✓ ' : ''}${esc(c.description)}</span>`).join(' ');
  const pp = pathProgress();
  return `<div class="panel">
      <div class="row"><b>Prestige ${p.prestigeLevel} checklist</b><span class="spacer"></span><span class="muted">${met} / ${p.conditions.length} met${xpLine}</span></div>
      <div class="bar"><div style="width:${(100 * met / Math.max(1, p.conditions.length)).toFixed(1)}%"></div></div>
      <div style="margin:6px 0">${items}</div>
      <div class="small muted">${D.pathSet.size
        ? `Quest chain to the required quest(s): <b>${pp.done} / ${pp.total}</b> done. Path quests are listed first.`
        : `No quests required for this prestige — the fastest route is XP and roubles, so quests are sorted by XP. Build the hideout levels marked PRESTIGE.`}
        Only quests you can do <i>right now</i> are shown. Pick a map to plan a raid around every quest you can do there.</div>
    ${skipWarn}</div>`;
}

function pathProgress() {
  const path = [...D.pathSet].map(id => D.byId[id]).filter(factionOk);
  const done = path.filter(t => S.tasks[t.id]).length;
  return { done, total: path.length };
}

// ---------- views ----------
// Quests the player will never do: dropped from every "what to do" list, never auto-restored.
const isSkipped = t => !!(S.skipped && S.skipped[t.id]);

function viewNext() {
  const visible = D.tasks.filter(t => factionOk(t) && inFocus(t) && !isSkipped(t));
  const skippedCount = D.tasks.filter(t => factionOk(t) && isSkipped(t) && !S.tasks[t.id]).length;
  const avail = visible.filter(t => taskState(t).status === 'available' && !S.snoozed[t.id]).sort(byPriority);
  const snoozedCount = visible.filter(t => S.snoozed[t.id] && !S.tasks[t.id]).length;
  const mapCounts = new Map();
  let anyCount = 0;
  for (const t of avail) {
    const ms = taskMaps(t);
    if (!ms.length) anyCount++;
    for (const m of ms) mapCounts.set(m.normalizedName, { m, n: (mapCounts.get(m.normalizedName) || { n: 0 }).n + 1 });
  }
  const sel = S.ui.map;
  const chips = [`<span class="chip ${sel === 'all' ? 'on' : ''}" data-act="map" data-id="all">All<span class="n">${avail.length}</span></span>`]
    .concat([...mapCounts.values()].sort((a, b) => b.n - a.n).map(({ m, n }) => `<span class="chip ${sel === m.normalizedName ? 'on' : ''}" data-act="map" data-id="${esc(m.normalizedName)}">${esc(m.name)}<span class="n">${n}</span></span>`))
    .concat(anyCount ? [`<span class="chip ${sel === 'any' ? 'on' : ''}" data-act="map" data-id="any">Any map<span class="n">${anyCount}</span></span>`] : [])
    .join('');

  let list;
  if (sel === 'all') {
    list = avail.map(taskCard).join('');
  } else {
    const onMap = avail.filter(t => sel === 'any' ? !taskMaps(t).length : taskMaps(t).some(m => m.normalizedName === sel));
    const anywhere = sel === 'any' ? [] : avail.filter(t => !taskMaps(t).length);
    const keys = new Map();
    for (const t of onMap) for (const k of t.neededKeys || []) if (!k.map || k.map.normalizedName === sel || sel === 'any') k.keys.forEach(x => keys.set(x.id, x));
    list = `<div class="group-title">Quests on this map (${onMap.length})</div>${onMap.map(taskCard).join('') || '<div class="muted">None</div>'}
      ${keys.size ? `<div class="group-title">Bring these keys</div><div>${[...keys.values()].map(k => itemChip(k)).join('')}</div>` : ''}
      ${anywhere.length ? `<div class="group-title">Also progress anywhere (${anywhere.length})</div>${anywhere.map(taskCard).join('')}` : ''}`;
  }

  const gated = gatedBatches(visible);
  const story = storyPanel(visible);
  const nextLocked = visible.filter(t => D.pathSet.has(t.id) && taskState(t).status === 'locked').sort((a, b) => (a.minPlayerLevel || 0) - (b.minPlayerLevel || 0)).slice(0, 5);
  const sorts = { fastest: 'Fastest prestige', xp: 'Most XP', money: 'Most money', unlocks: 'Unlocks most quests' };
  return `${syncPanel()}
    ${setupNudge()}
    ${prestigeSummary()}
    ${correctionsWarning()}
    ${story}
    <div class="row">
      <div class="chips" style="flex:1">${chips}</div>
      <label class="muted">Sort <select id="sortSel">${Object.entries(sorts).map(([k, v]) => `<option value="${k}" ${S.ui.sort === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    </div>
    ${list || '<div class="panel muted">Nothing available — check your level and traders (☰ Menu → Set up my profile), or see the upcoming quests below.</div>'}
    ${gated}
    ${skippedCount ? `<div class="small muted" style="margin-top:8px">${skippedCount} quest(s) marked “won't do” — undo from the All quests tab (tick “show won't do”).</div>` : ''}
    ${snoozedCount ? `<div class="small muted" style="margin-top:8px">${snoozedCount} quest(s) hidden as “not offered in game yet” — un-hide them from the All quests tab.</div>` : ''}
    ${nextLocked.length ? `<div class="group-title">Coming up on the prestige path</div>${nextLocked.map(taskCard).join('')}` : ''}`;
}

const correctionsWarning = () => D.corrections ? '' : '<div class="panel small" style="border-color:var(--warn)">⚠ Couldn’t load quest unlock corrections from tarkovtracker.org — story, loyalty and unlock-counter gates are missing, so some quests show too early. Try “Refresh data” later.</div>';

// ---------- story ----------
const chapterStarted = c => c.autoStart || !!S.storyStarted[c.id] || c.objectives.some(o => S.story[o.id]);
const chapterDone = c => c.objectives.length > 0 && c.objectives.every(o => o.optional || S.story[o.id]);
const nextStep = c => c.objectives.find(o => !o.optional && !S.story[o.id]);
const chapterStatus = c => chapterDone(c) ? 'done' : chapterStarted(c) ? 'active' : 'new';

// Story steps that gate quests you still need, grouped by chapter, with how to get there.
function storyPanel(visible) {
  const needed = new Map();
  for (const t of visible) {
    if (S.tasks[t.id]) continue;
    for (const o of storyReqsOf(t)) {
      if (S.story[o.objective.id]) continue;
      const key = o.objective.id;
      const e = needed.get(key) || { o, quests: [] };
      e.quests.push(t.name);
      needed.set(key, e);
    }
  }
  if (!needed.size) return '';
  const byChapter = new Map();
  for (const e of needed.values()) {
    const key = e.o.storyChapter.id;
    if (!byChapter.has(key)) byChapter.set(key, { chapter: e.o.storyChapter, gates: [] });
    byChapter.get(key).gates.push(e);
  }
  const rows = [...byChapter.values()].map(({ chapter, gates }) => {
    const c = D.chapterById[chapter.id];
    const stepIndex = e => (c ? c.objectives.findIndex(o => o.id === e.o.objective.id) : -1);
    gates.sort((a, b) => stepIndex(a) - stepIndex(b));
    const gateRows = gates.map(e => `<div class="obj"><input type="checkbox" data-act="story" data-id="${esc(e.o.objective.id)}">
      <div><div>Step needed: ${esc(e.o.objective.name)}${c ? ` <span class="muted small">(step ${stepIndex(e) + 1} of ${c.objectives.length})</span>` : ''}</div>
      <div class="detail">Unlocks: ${e.quests.map(esc).join(', ')}</div></div></div>`).join('');
    if (!c) return `<div class="sec"><b>${esc(chapter.name)}</b>${gateRows}</div>`;
    const how = chapterStarted(c)
      ? `Next step: <b>${esc((nextStep(c) || {}).description || '—')}</b>`
      : `<span class="badge gate">not started</span> To start: ${esc(c.activation || 'see wiki')}`;
    return `<div class="sec"><b>${esc(c.name)}</b> <a href="#" data-act="chapter" data-id="${esc(c.id)}" class="small">open chapter</a>
      <div class="small">${how}</div>${gateRows}</div>`;
  }).join('');
  return `<div class="panel"><b>Story progress needed for quests</b> <span class="small muted">— chapters start by picking up items/notes or talking to traders; track steps in the Story tab.</span>${rows}</div>`;
}

const openChapters = new Set();

function viewStory() {
  if (!D.storyChapters.length) return '<div class="panel muted">Story chapter data couldn’t be loaded from tarkovtracker.org. Try “Refresh data” later.</div>';
  const label = { done: '<span class="badge ok">done</span>', active: '<span class="badge gate">in progress</span>', new: '<span class="badge">not started</span>' };
  const cards = D.storyChapters.map(c => {
    const st = chapterStatus(c);
    const main = c.objectives.filter(o => !o.optional);
    const doneMain = main.filter(o => S.story[o.id]).length;
    const reqs = c.requires.map(id => D.chapterById[id]).filter(Boolean)
      .map(r => `${esc(r.name)}${chapterDone(r) ? ' ✓' : ''}`).join(', ');
    const gates = c.objectives.filter(o => D.stepQuests[o.id]).map(o => `<div class="small">🔓 “${esc(o.description)}” unlocks ${D.stepQuests[o.id].map(id => D.byId[id]).filter(Boolean).map(t => esc(t.name)).join(', ')}</div>`).join('');
    const open = openChapters.has(c.id);
    // Collapsed view: the next few steps from where you are.
    const first = c.objectives.findIndex(o => !S.story[o.id]);
    const shown = open ? c.objectives : c.objectives.slice(Math.max(0, first), Math.max(0, first) + 6);
    const steps = shown.map(o => `<div class="obj ${S.story[o.id] ? 'done' : ''}">
        <input type="checkbox" data-act="story" data-id="${esc(o.id)}" ${S.story[o.id] ? 'checked' : ''}>
        <div class="desc">${esc(o.description)}${o.optional ? ' <span class="badge">optional</span>' : ''}${D.stepQuests[o.id] ? ' <span class="badge path">unlocks quests</span>' : ''}
          <button class="small" data-act="storyUpTo" data-id="${esc(o.id)}" title="Tick every step up to this one">✓ up to here</button></div>
      </div>`).join('');
    return `<div class="panel">
      <div class="row"><b>${c.order}. ${esc(c.name)}</b> ${label[st]}<span class="spacer"></span><span class="muted small">${doneMain}/${main.length} steps</span>
        ${c.wikiLink ? `<a class="small" href="${esc(c.wikiLink)}" target="_blank" rel="noopener">wiki</a>` : ''}</div>
      ${c.description ? `<div class="small">${esc(c.description)}</div>` : ''}
      <div class="sec small"><b>How to start:</b> ${c.autoStart ? 'starts automatically' : esc(c.activation || 'see wiki')}${reqs ? ` · <b>Requires:</b> ${reqs}` : ''}
        ${!c.autoStart ? ` · <label><input type="checkbox" data-act="chapterStart" data-id="${esc(c.id)}" ${chapterStarted(c) ? 'checked' : ''}> started</label>` : ''}</div>
      ${c.notes ? `<div class="small muted">Note: ${esc(c.notes)}</div>` : ''}
      ${c.mapUnlocks.length || c.traderUnlocks.length ? `<div class="small muted">Unlocks: ${[...c.mapUnlocks, ...c.traderUnlocks].map(esc).join(', ')}</div>` : ''}
      ${gates ? `<div class="sec">${gates}</div>` : ''}
      <div class="sec"><h4>Steps</h4>${steps || '<div class="muted small">All steps done</div>'}
        <button class="small" data-act="chapterAll" data-id="${esc(c.id)}">${open ? 'Show fewer steps' : `Show all ${c.objectives.length} steps`}</button></div>
    </div>`;
  }).join('');
  return `<div class="panel small muted">Storyline chapters from tarkovtracker.org. Steps are in story order; tick them as you complete them in game (or use “✓ up to here”). Some chapters branch, so not every step applies to every playthrough.</div>${cards}`;
}

// ---------- completed quests (bulk entry) ----------
function viewCompleted() {
  const q = S.ui.search.trim().toLowerCase();
  const all = D.tasks.filter(factionOk);
  const cols = D.traders.map(tr => {
    const ts = all.filter(t => t.trader.id === tr.id).sort((a, b) => a.name.localeCompare(b.name));
    if (!ts.length) return '';
    const done = ts.filter(t => S.tasks[t.id] === 'done').length;

    if (!shown.length) return '';
    return `<div class="panel"><div class="row"><b>${esc(tr.name)}</b><span class="spacer"></span><span class="muted small">${done}/${ts.length}</span></div>
      ${shown.map(t => `<label class="obj ${S.tasks[t.id] === 'done' ? 'done' : ''}" style="cursor:pointer">
        <input type="checkbox" data-act="done" data-id="${t.id}" ${S.tasks[t.id] === 'done' ? 'checked' : ''}>
        <span class="desc">${esc(t.name)}</span></label>`).join('')}
    </div>`;
  }).join('');
  return `<div class="panel row">
      <input class="search" id="search" placeholder="Search quest names…" value="${esc(S.ui.search)}">
      <span class="spacer"></span><span class="small muted">Open the game's completed quests list and tick what you've finished. Ticking a quest also ticks its prerequisites.</span>
    </div><div class="grid2">${cols}</div>`;
}

// Quest batches that only wait on a server-side unlock: the player confirms them from the game.
function gatedBatches(visible) {
  const rows = [];
  for (const [g, ids] of Object.entries(D.gateGroups)) {
    if (gateOpen(g)) continue;
    const ts = ids.map(id => D.byId[id]).filter(t => visible.includes(t) && !S.tasks[t.id]);
    // Only offer batches where the gate is the last thing missing for at least one quest.
    const ready = ts.filter(t => taskState(t).reasons.every(r => r === 'Unlocks in game'));
    if (!ready.length) continue;
    const traders = [...new Set(ts.map(t => t.trader.name))].join(', ');
    const xp = ts.reduce((a, t) => a + (t.experience || 0), 0);
    rows.push({ xp, html: `<div class="task"><div class="task-head">
      <button data-act="gate" data-id="${esc(g)}" title="Mark this batch as available">Available in game ✓</button>
      <div style="flex:1"><div><span class="name">${esc(traders)}</span> <span class="badge gate">${ts.length} quests</span></div>
      <div class="meta">${ts.map(t => esc(t.name)).join(' · ')} · ${xp.toLocaleString()} XP total</div></div></div></div>` });
  }
  if (!rows.length) return '';
  rows.sort((a, b) => b.xp - a.xp);
  return `<div class="group-title">Unlocked by the game — tick a batch when its quests appear at the trader</div>
    <div class="small muted" style="margin-bottom:6px">In 1.x many quests unlock through server-side story/progress flags the public data can't resolve. One flag opens the whole batch.
    <label><input type="checkbox" id="ignoreGates" ${S.ui.ignoreGates ? 'checked' : ''}> treat all as available</label></div>
    ${rows.map(r => r.html).join('')}`;
}

// ---------- raid planner ----------
const mapKey = n => MAP_ALIASES[n] || n;
// Objectives that happen at a trader / in the menus rather than in raid.
const OUT_OF_RAID = new Set(['giveItem', 'giveQuestItem', 'buildWeapon', 'traderLevel', 'traderStanding', 'skill', 'playerLevel', 'taskStatus', 'sellItem', 'dialogue', 'globalVariable']);
const objMaps = (o, t) => (o.maps && o.maps.length ? o.maps : t.map ? [t.map] : []);
const objOnMap = (o, t, key) => objMaps(o, t).some(m => mapKey(m.normalizedName) === key);
const objAnywhere = (o, t) => !objMaps(o, t).length;
const raidObjectives = t => t.objectives.filter(o => !o.optional && !S.objs[o.id] && !OUT_OF_RAID.has(o.type));
const RAID_COLORS = ['#e6b450', '#6c9bd2', '#6fae5f', '#d9705a', '#a982d6', '#4fc1c9', '#d6d26a', '#e08bc0', '#9aa7b8', '#c98a4f'];

function raidCandidates() {
  return D.tasks.filter(t => (factionOk(t) && !S.tasks[t.id] && !isSkipped(t) && (S.active[t.id] || (taskState(t).status === 'available' && !S.snoozed[t.id])))
    || squadWith(t).length);
}

// For one map: quests you can fully finish there, and quests you can progress.
// How much of a quest this map covers: null (nothing here), 'finish' (every in-raid objective left) or 'progress'.
function mapFit(t, key) {
  const objs = raidObjectives(t);
  const here = objs.filter(o => objOnMap(o, t, key)).length;
  if (!here) return null;
  return { here, fit: objs.every(o => objOnMap(o, t, key) || objAnywhere(o, t)) ? 'finish' : 'progress' };
}

function mapPlan(key) {
  const finish = [], progress = [];
  let objectives = 0;
  for (const t of raidCandidates()) {
    const f = mapFit(t, key);
    if (!f) continue;
    objectives += f.here;
    (f.fit === 'finish' ? finish : progress).push(t);
  }
  const score = q => q.reduce((n, t) => n + (S.active[t.id] ? 3 : S.tasks[t.id] ? 0 : 1) + 2 * squadWith(t).length, 0);
  const squad = [...finish, ...progress].reduce((n, t) => n + squadWith(t).length, 0);
  return { key, finish, progress, objectives, squad, score: score(finish) * 2 + score(progress) };
}

function rankedMaps() {
  const keys = [...new Set(D.maps.map(m => mapKey(m.normalizedName)))].filter(k => D.mapDefs && D.mapDefs[k] || D.maps.some(m => m.normalizedName === k));
  // Maps the Tour hasn't unlocked go last: they're only reachable by transit.
  const locked = tourLocks().maps;
  return keys.map(mapPlan).filter(p => p.finish.length || p.progress.length)
    .sort((a, b) => locked.has(a.key) - locked.has(b.key) || b.score - a.score);
}
const mapName = key => (D.maps.find(m => m.normalizedName === key) || { name: key }).name;

let raidSelection = null; // planner checkboxes: Set of quest ids for S.ui.raidMap

// ---------- squad (friends' progress from their sync codes) ----------
const squadMembers = () => (S.squad || []).filter(n => S.friends[n]);
const squadWith = t => squadMembers().filter(n => S.friends[n].quests[t.id] === 'active');
const ageText = iso => { const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 60 ? `${m} min ago` : m < 2880 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`; };

async function gunzipBase64(b64) {
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}
async function gzipBase64(text) {
  const stream = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
  const buf = new Uint8Array(await new Response(stream).arrayBuffer());
  let bin = '';
  for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode(...buf.subarray(i, i + 0x8000));
  return btoa(bin);
}

// Codes look like "TPTF1.<base64 gzip JSON>" — made by “Copy my sync code” in a friend's tracker.
async function importFriendCode(text) {
  const m = String(text).match(/TPTF1\.([A-Za-z0-9+/=]+)/);
  if (!m) throw new Error('no sync code found (it starts with TPTF1.)');
  const p = JSON.parse(await gunzipBase64(m[1]));
  if (p.v !== 1 || !p.n) throw new Error('unsupported sync code');
  if (p.m && p.m !== S.mode) throw new Error(`that code is for ${p.m}, the tracker is on ${S.mode}`);
  const quests = {};
  for (const [k, st] of [['d', 'done'], ['a', 'active'], ['f', 'failed']]) for (const id of p[k] || []) quests[id] = st;
  const name = String(p.n).slice(0, 40);
  S.friends[name] = { quests, since: p.s || null, exportedAt: p.x || new Date().toISOString() };
  if (!S.squad.includes(name)) S.squad.push(name);
  save();
  return { name, active: (p.a || []).length, done: (p.d || []).length };
}

async function myFriendCode() {
  const pick = st => Object.keys(S.tasks).filter(id => S.tasks[id] === st);
  const payload = { v: 1, n: S.myName || 'Friend', m: S.mode, s: S.logSync ? S.logSync.since : null, x: new Date().toISOString(),
    d: pick('done'), a: Object.keys(S.active).filter(id => !S.tasks[id]), f: pick('failed') };
  return 'TPTF1.' + await gzipBase64(JSON.stringify(payload));
}

// Minimal zip reader (central directory + deflate via DecompressionStream) for zips made by Windows "Send to → Compressed folder".
async function unzipEntries(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  const dv = new DataView(buf.buffer);
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error(`${file.name} is not a zip file`);
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = [];
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('corrupt zip directory');
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true), extraLen = dv.getUint16(p + 30, true), commentLen = dv.getUint16(p + 32, true);
    const local = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(buf.subarray(p + 46, p + 46 + nameLen));
    p += 46 + nameLen + extraLen + commentLen;
    if (!/\.log$/i.test(name)) continue;
    const start = local + 30 + dv.getUint16(local + 26, true) + dv.getUint16(local + 28, true);
    const data = buf.subarray(start, start + csize);
    let text;
    if (method === 0) text = new TextDecoder().decode(data);
    else if (method === 8) text = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    else throw new Error(`unsupported zip compression in ${name}`);
    out.push({ name, text });
  }
  return out;
}

async function readLogFiles(files) {
  const entries = [];
  for (const f of files) {
    if (/\.zip$/i.test(f.name)) entries.push(...await unzipEntries(f));
    else if (/\.log$/i.test(f.name)) entries.push({ name: f.webkitRelativePath || f.name, text: await f.text() });
  }
  return entries;
}

// Like the server's gamelogs.js: quest chat notifications (type 10/11/12), session mode from application logs,
// and a prestige/wipe = 5+ finished quests started again within 30 minutes (only the current run is kept).
// The server also reads exact prestige times from backend logs; friends aren't asked for those (they hold login tokens).
function progressFromLogs(entries, wanted, assumeMode) {
  const sessions = new Map();
  for (const e of entries) {
    const base = e.name.split(/[\\/]/).pop();
    const m = base.match(/^(.*?)\s*(push-notifications|notifications|application)(_\d+)?\.log$/i);
    if (!m) continue;
    const key = m[1] || base;
    const sess = sessions.get(key) || { notif: '', app: '' };
    if (/application/i.test(m[2])) sess.app += e.text + '\n'; else sess.notif += e.text + '\n';
    sessions.set(key, sess);
  }
  const events = [];
  let unknownSessions = 0;
  for (const sess of sessions.values()) {
    const modes = [...sess.app.matchAll(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3})\|[^\n]*?Session mode: (\w+)/gm)].map(m => ({ at: m[1], mode: m[2] }));
    if (!modes.length && sess.notif) unknownSessions++;
    for (const m of sess.notif.matchAll(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3})\|[^\n]*\n(\{[\s\S]+?^\})/gm)) {
      const t = m[2].match(/"type":\s*(1[012]),/), q = m[2].match(/"templateId":\s*"([0-9a-f]{24}) /);
      if (!t || !q) continue;
      const mode = modes.length ? (modes.filter(x => x.at <= m[1]).pop() || modes[0]).mode : assumeMode;
      if (mode !== wanted) continue;
      events.push({ at: m[1], id: q[1], st: { 10: 'active', 11: 'failed', 12: 'done' }[t[1]] });
    }
  }
  events.sort((a, b) => (a.at < b.at ? -1 : a.at > b.at ? 1 : 0));
  let since = null, finished = new Set(), window = [];
  const ms = at => Date.parse(at.replace(' ', 'T'));
  for (const e of events) {
    if (e.st === 'done') finished.add(e.id);
    if (e.st !== 'active' || !finished.has(e.id)) continue;
    window = window.filter(w => ms(e.at) - w < 30 * 60 * 1000).concat(ms(e.at));
    if (window.length >= 5) {
      since = events.find(x => ms(x.at) >= window[0] && x.st === 'active' && finished.has(x.id)).at;
      finished = new Set(); window = [];
    }
  }
  const quests = {};
  for (const e of events) if (!since || e.at >= since) quests[e.id] = e.st;
  return { quests, since, sessions: sessions.size, unknownSessions, events: events.length, lastAt: events.length ? events[events.length - 1].at : null };
}

async function importFriendLogs(files) {
  const name = (document.getElementById('friendName').value || '').trim();
  if (!name) throw new Error('enter your friend\'s name first');
  const entries = await readLogFiles(files);
  if (!entries.length) throw new Error('no .log files found');
  const assume = document.getElementById('assumeMode').value;
  const r = progressFromLogs(entries, S.mode === 'regular' ? 'Regular' : 'Pve', assume);
  if (!r.events) throw new Error(`no ${S.mode === 'regular' ? 'PvP' : 'PvE'} quest events in ${r.sessions} session(s) — did they include the push-notifications logs?`);
  S.friends[name] = { quests: r.quests, since: r.since, exportedAt: r.lastAt ? new Date(r.lastAt.replace(' ', 'T')).toISOString() : new Date().toISOString(), fromLogs: true };
  if (!S.squad.includes(name)) S.squad.push(name);
  save();
  const v = Object.values(r.quests);
  return `Added ${name} from ${r.sessions} log session(s): ${v.filter(x => x === 'active').length} active, ${v.filter(x => x === 'done').length} done${r.since ? ` (since reset ${r.since})` : ''}${r.unknownSessions ? ` · ${r.unknownSessions} session(s) had no application log` : ''}`;
}
