  return out;
}
const keyWikiLink = title => 'https://escapefromtarkov.fandom.com/wiki/' + encodeURIComponent(title.replace(/ /g, '_'));
const pickupLine = pk => `<label class="objline pickup" title="Ticking this marks the key as owned"><input type="checkbox" data-act="keyToggle" data-id="${pk.key.id}">
  <span>🔑 <b>First: pick up ${esc(pk.key.name)}</b> — guaranteed spawn: ${esc(pk.spawn.note)}${pk.spawn.points.length ? '' : ' (inside a container — no exact map spot)'}</span></label>`;

function objectiveTicks(t, key) {
  const objs = t.objectives.filter(o => !o.optional && !OUT_OF_RAID.has(o.type) && (objOnMap(o, t, key) || objAnywhere(o, t)));
  return keyPickups(t, key).map(pickupLine).join('') + objs.map(o => `<label class="objline ${S.objs[o.id] ? 'done' : ''}"><input type="checkbox" data-act="obj" data-id="${o.id}" ${S.objs[o.id] ? 'checked' : ''}>
    <span>${esc(o.description)}</span></label>`).join('');
}

function questKeyGroups(t, key) {
  const groups = new Map();
  for (const k of t.neededKeys || []) if (!k.map || mapKey(k.map.normalizedName) === key) groups.set(k.keys.map(x => x.id).sort().join('|'), k.keys);
  for (const o of raidObjectives(t)) {
    if (!(objOnMap(o, t, key) || objAnywhere(o, t))) continue;
    for (const g of o.requiredKeys || []) if (g.length) groups.set(g.map(x => x.id).sort().join('|'), g);
  }
  return [...groups.values()];
}
const haveKey = k => (S.have[k.id] || 0) > 0;

// Key chips next to a quest: click to mark owned; the badge says whether you can do it right now.
function questKeysHtml(t, key) {
  const groups = questKeyGroups(t, key);
  if (!groups.length) return '';
  const ok = groups.every(g => g.some(haveKey));
  const chips = groups.map(g => g.map(k => `<span class="item key ${haveKey(k) ? 'have' : 'missing'}" data-act="keyToggle" data-id="${k.id}"
      title="${haveKey(k) ? 'You have this key — click to unmark' : 'Click if you have this key'}">${k.iconLink ? `<img loading="lazy" src="${esc(k.iconLink)}" alt="">` : ''}${esc(k.shortName || k.name)} ${haveKey(k) ? '✓' : '✗'}</span>`).join(' or ')).join(' ');
  return `<div class="keys-line">${ok ? '<span class="badge ok">🔑 keys ok</span>' : '<span class="badge lock">🔑 missing key</span>'} ${chips}</div>`;
}

function bringList(key, quests) {
  const items = new Map(), keys = new Map();
  for (const t of quests) {
    for (const o of raidObjectives(t)) {
      if (!(objOnMap(o, t, key) || objAnywhere(o, t))) continue;
      if (o.type === 'plantItem' && o.items && o.items.length) items.set(o.items[0].id, { item: o.items[0], n: (items.get(o.items[0].id) || { n: 0 }).n + (o.count || 1), note: 'plant' });
      if (o.type === 'mark' && o.markerItem) items.set(o.markerItem.id, { item: o.markerItem, n: (items.get(o.markerItem.id) || { n: 0 }).n + 1, note: 'mark' });
    }
    for (const k of t.neededKeys || []) if (!k.map || mapKey(k.map.normalizedName) === key) keys.set(k.keys.map(x => x.id).join('|'), k.keys);
  }
  const loadout = loadoutLines(key, quests);
  if (!items.size && !keys.size && !loadout) return '';
  return `<div class="sec"><h4>Bring</h4>
    ${[...items.values()].map(e => `<span title="${e.note}">${itemChip(e.item, e.n)}</span>`).join('')}
    ${[...keys.values()].map(ks => `<span title="key">${ks.map(k => `<span class="item key ${haveKey(k) ? 'have' : 'missing'}" data-act="keyToggle" data-id="${k.id}">${k.iconLink ? `<img loading="lazy" src="${esc(k.iconLink)}" alt="">` : ''}${esc(k.name)} ${haveKey(k) ? '✓' : '✗'}</span>`).join(' or ')}</span>`).join(' ')}
    ${loadout}</div>`;
}

// Kill objectives with weapon / attachment / gear conditions: what to carry or wear into the raid.
function loadoutLines(key, quests) {
  const chip = it => `<span class="item" title="${esc(it.name)}">${it.iconLink ? `<img loading="lazy" src="${esc(it.iconLink)}" alt="">` : ''}${esc(it.shortName || it.name)}</span>`;
  const some = (list, n = 4) => list.slice(0, n).map(chip).join(' ') + (list.length > n ? ` <span class="muted small" title="${esc(list.slice(n).map(i => i.name).join(', '))}">+${list.length - n} more</span>` : '');
  // Groups are alternatives; the items inside one group are worn/fitted together.
  const combos = (groups, n = 3) => groups.slice(0, n).map(g => g.map(chip).join(' + ')).join(' <span class="muted small">or</span> ')
    + (groups.length > n ? ` <span class="muted small" title="${esc(groups.slice(n).map(g => g.map(i => i.name).join(' + ')).join(' | '))}">or ${groups.length - n} more</span>` : '');
  const rows = [];
  for (const t of quests) {
    for (const o of raidObjectives(t)) {
      if (o.type !== 'shoot' || !(objOnMap(o, t, key) || objAnywhere(o, t))) continue;
      const parts = [];
      if (o.usingWeapon && o.usingWeapon.length) {
        const types = (o.weaponTypes || []).map(w => w.name);
        const label = types.length === 1 ? `Any ${types[0]}` : types.length ? types.slice(0, 3).join(' / ') + (types.length > 3 ? ' / …' : '') : 'Weapon';
        parts.push(`<div><b>🔫 ${esc(label)}</b> <span class="muted small">(${o.usingWeapon.length} option${o.usingWeapon.length > 1 ? 's' : ''})</span> ${some(o.usingWeapon)}</div>`);
      }
      if (o.usingWeaponMods && o.usingWeaponMods.length) parts.push(`<div><b>🔧 with</b> ${combos(o.usingWeaponMods)}</div>`);
      if (o.wearing && o.wearing.length) parts.push(`<div><b>🧥 wear</b> ${combos(o.wearing)}</div>`);
      if (o.notWearing && o.notWearing.length) parts.push(`<div><b>🚫 don't wear</b> ${some(o.notWearing, 6)}</div>`);
      if (parts.length) rows.push(`<div class="loadout"><div class="small muted">${esc(t.name)}: ${esc(o.description)}</div>${parts.join('')}</div>`);
    }
  }
  return rows.length ? `<div class="sec"><h4>Weapons &amp; gear for kills</h4>${rows.join('')}</div>` : '';
}

function viewRaidInProgress() {
  const r = S.raid, key = r.map;
  const quests = r.quests.map(id => D.byId[id]).filter(Boolean);
  const mins = Math.max(0, Math.round((Date.now() - Date.parse(r.startedAt)) / 60000));
  const blocks = quests.map((t, i) => {
    const color = RAID_COLORS[i % RAID_COLORS.length];
    if (S.tasks[t.id] === 'done') return `<div class="sec"><span class="swatch" style="background:${color}"></span><b>${esc(t.name)}</b> <span class="badge ok">completed ✓</span></div>`;
    const objs = t.objectives.filter(o => !o.optional && !OUT_OF_RAID.has(o.type) && (objOnMap(o, t, key) || objAnywhere(o, t)));
    const after = t.objectives.filter(o => !o.optional && !S.objs[o.id] && OUT_OF_RAID.has(o.type));
    return `<div class="sec"><span class="swatch" style="background:${color}"></span><b>${esc(t.name)}</b> <span class="muted small">${esc(t.trader.name)}</span>
      ${squadWith(t).map(n => `<span class="badge squad">👥 ${esc(n)}</span>`).join('')}${S.active[t.id] ? '' : ' <span class="badge squad">for squad</span>'}
      ${questKeysHtml(t, key)}
      ${keyPickups(t, key).map(pickupLine).join('')}
      ${objs.map(o => `<div class="obj ${S.objs[o.id] ? 'done' : ''}"><input type="checkbox" data-act="obj" data-id="${o.id}" ${S.objs[o.id] ? 'checked' : ''}>
        <div><div class="desc">${esc(o.description)}${(o.points || []).some(p => mapKey(p.map) === key) ? ' 📍' : ''}</div><div class="detail">${objectiveDetail(o)}</div></div></div>`).join('')}
      ${after.length ? `<div class="small muted">After the raid: ${after.map(o => esc(o.description)).join(' · ')}</div>` : ''}</div>`;
  }).join('');
  const legend = quests.map((t, i) => `<span class="small" style="margin-right:10px"><span class="swatch" style="background:${RAID_COLORS[i % RAID_COLORS.length]}"></span>${esc(t.name)}</span>`).join('');
  return `<div class="panel row"><b>Raid in progress: ${esc(mapName(key))}</b><span class="muted small">started ${mins} min ago · ${quests.filter(t => S.tasks[t.id] === 'done').length}/${quests.length} quests completed</span>
      <span class="spacer"></span><button data-act="raidFull" title="Show the map fullscreen (Esc to leave)">⛶ Fullscreen map</button><button class="primary" data-act="raidEnd">End raid</button><button data-act="raidCancel">Cancel raid</button></div>
    <div class="raid-grid">
      <div><div id="raidMapSlot"></div><div style="margin-top:6px">${legend}</div>
        <div class="small muted">Big dots + shaded areas = objective zones, small dots = possible quest-item spots. Yellow tags (2F, 3F, UG) mark objectives off the ground floor — click one, or use the floor buttons on the map, to see that floor. Toggle extracts, transits, hazards, bosses, keys and loot in the map's top-right panel. Map &amp; data: tarkov.dev. Kills and anywhere-on-map objectives have no fixed spot.</div></div>
      <div class="panel" style="margin:0">${routePanel(key)}${bringList(key, quests)}${blocks}</div>
    </div>`;
}

// ---------- buildings & floors (maps whose SVG has floor layers, e.g. Streets of Tarkov) ----------
const svgTextCache = {};
async function loadSvgRoot(url) {
  if (!svgTextCache[url]) svgTextCache[url] = fetch(url).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); });
  return new DOMParser().parseFromString(await svgTextCache[url], 'image/svg+xml').documentElement;
}
// One floor visible: the base (ground) layer plus groups kept with it, or a floor drawn over a faded ground level.
function svgFloorOverlay(root, def, floorLayer, hideBase = false) {
  const svg = document.importNode(root, true);
  const base = def.svgLayer;
  const layerGroups = [...svg.children].filter(g => g.tagName.toLowerCase() === 'g' && g.dataset && g.dataset.layer);
  for (const g of layerGroups) {
    const isBase = g.id === base || g.dataset.keepWithGroup === base;
    if (!floorLayer) g.style.display = isBase ? '' : 'none';
    else if (g.id === floorLayer) g.style.display = '';
    else if (isBase && !hideBase) { g.style.display = ''; g.style.opacity = '0.22'; }
    else g.style.display = 'none';
  }
  return L.svgOverlay(svg, gameBounds(def.svgBounds || def.bounds), { interactive: false });
}
const hasFloors = def => !!(def && def.svgPath && def.layers && def.layers.length);
const GROUND = 'Ground floor';
const mapFloors = def => [GROUND, ...def.layers.slice().sort((a, b) => a.height[0] - b.height[0]).map(l => l.name)];
// A point is on a floor when its height is in one of the floor's bands and, if that band is limited to
// building areas, it lies inside one of them (same rule as tarkov.dev). Otherwise it's on the ground floor.
const inArea = (a, p) => p.x >= Math.min(a.x1, a.x2) && p.x <= Math.max(a.x1, a.x2) && p.z >= Math.min(a.z1, a.z2) && p.z <= Math.max(a.z1, a.z2);
function floorMatch(def, p) {
  const y = p.y || 0;
  for (const l of def.layers || []) {
    for (const e of l.extents || [{ height: l.height, areas: [] }]) {
      if (y < e.height[0] || y >= e.height[1]) continue;
      if (!e.areas.length) return { floor: l.name, area: null };
      const a = e.areas.find(a => inArea(a, p));
      if (a) return { floor: l.name, area: a.name };
    }
  }
  return { floor: GROUND, area: null };
}
const floorOf = (def, p) => floorMatch(def, p).floor;
const titleCase = s => s.replace(/\b\w/g, c => c.toUpperCase());
const floorLayerId = (def, name) => { const l = (def.layers || []).find(l => l.name === name); return l ? l.svgLayer : null; };
const isBuildingLabel = l => l.size !== 80 && !/\b(St\.|Ave\.|Alley)$/.test(l.text);
const buildingLabels = def => (def.labels || []).filter(isBuildingLabel);
// No building outlines in the data, so a point belongs to the nearest building label within 60 m.
function buildingOf(def, p) {
  let best = null, bd = 60;
  for (const l of buildingLabels(def)) { const d = Math.hypot(l.x - p.x, l.z - p.z); if (d < bd) { bd = d; best = l; } }
  return best;
}
const labelText = l => l.text.replace(/\n/g, ' ');
function placeOf(def, p) {
  if (!hasFloors(def)) return null;
  const b = buildingOf(def, p), m = floorMatch(def, p);
  // Prefer the map's building label; fall back to the floor area's own name (e.g. "scav checkpoint").
  const building = b ? labelText(b) : m.area ? titleCase(m.area) : null;
  return (building || m.floor !== GROUND) ? { building, floor: m.floor } : null;
}
const placeText = pl => (pl ? [pl.building, pl.floor].filter(Boolean).join(' · ') : '');
// The floor shown on the raid map, and the SVG overlay currently drawing it.
let raidFloor = GROUND, raidOverlay = null, raidOverlayFloor = null, raidTileLayer = null, raidFloorCtl = null;
const shortFloor = name => (name === GROUND ? 'G' : /under/i.test(name) ? 'UG' : (name.match(/\d+/) || [name])[0] + 'F');

// ---------- location photos in map tooltips (wiki quest guides) ----------
const questImageCache = {};
const wikiTitle = t => decodeURIComponent((t.wikiLink || '').split('/wiki/')[1] || '').replace(/_/g, ' ');
function fetchQuestImages(t) {
  const title = wikiTitle(t);
  if (!title) return Promise.resolve([]);
  if (!questImageCache[title]) questImageCache[title] = fetch('/api/quest-images?title=' + encodeURIComponent(title)).then(r => r.json()).then(j => j.images || []).catch(() => []);
  return questImageCache[title];
}
const TIP_STOP = new Set('locate obtain find mark the with and any inside near your from hand over item items place stash eliminate survive extract visit investigate specified spot using while into this that for are was'.split(' '));
const tipWords = str => ((str || '').toLowerCase().match(/[a-z0-9]{3,}/g) || []).filter(w => !TIP_STOP.has(w));
// Pick up to 3 photos for an objective: this map's guide section first (multi-map quests), then captions sharing words with the objective.
// The guides' map screenshots ("Locations marked on map", "Needle … Interchange Map.png").
const isMapShot = i => /marked on (the )?map|\bon the map$|^map\b/i.test(i.caption) || /(^|[ _-])map$/i.test(i.file.replace(/\.[a-z0-9]+$/i, ''));
function photosFor(o, key, imgs) {
  const here = mapName(key).toLowerCase();
  const mapNames = new Set(D.maps.map(m => m.name.toLowerCase()));
  const byMap = imgs.some(i => mapNames.has((i.section || '').toLowerCase()));
  let pool = byMap ? imgs.filter(i => (i.section || '').toLowerCase() === here || (i.caption + ' ' + i.file).toLowerCase().includes(here)) : imgs;
  // Unsectioned guides often name the map in the caption ("Woods kill area marked on map"): drop other maps' photos.
  const names = i => [...mapNames].filter(n => (i.caption + ' ' + i.file).toLowerCase().includes(n));
  if (!byMap && pool.some(i => names(i).includes(here))) pool = pool.filter(i => !names(i).length || names(i).includes(here));
  if (!pool.length) pool = imgs;
  // Skip the guides' map screenshots ("… marked on map"): the tracker already shows the map.
  pool = pool.filter(i => !isMapShot(i));
  // Map names appear in most file names, so they don't say which spot a photo shows.
  const mapWords = new Set([...mapNames].flatMap(n => tipWords(n)));
  const want = new Set(tipWords(o.description).filter(w => !mapWords.has(w)));

// Same projection as tarkov.dev's interactive maps: game (x, z) -> rotated -> affine transform.
function tarkovCRS(def) {
  const rotate = (latLng, deg) => {
    if (!deg) return latLng;
    const a = deg * Math.PI / 180, x = latLng.lng, y = latLng.lat;
    return L.latLng(x * Math.sin(a) + y * Math.cos(a), x * Math.cos(a) - y * Math.sin(a));

    projection: L.extend({}, L.Projection.LonLat, {
      project: ll => L.Projection.LonLat.project(rotate(ll, def.coordinateRotation)),

// ---------- route planning ----------
// Straight-line routing: there is no walkable-path data, so this orders stops sensibly rather than giving turn-by-turn directions.
const ROUTE_SPEED = 4; // m/s — a mix of sprinting and walking with stamina breaks
const dist2 = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);

// One stop per unfinished in-raid objective with a map position; quest items list every possible spot as a candidate.
function raidStopGroups(key) {
  const groups = [];
  S.raid.quests.map(id => D.byId[id]).filter(Boolean).forEach((t, i) => {
    if (S.tasks[t.id] === 'done') return;
    for (const o of t.objectives) {
      if (o.optional || OUT_OF_RAID.has(o.type) || S.objs[o.id]) continue;
      const cands = (o.points || []).filter(p => mapKey(p.map) === key).map(p => ({ x: p.x, z: p.z, y: p.y }));
      if (cands.length) groups.push({ t, o, color: RAID_COLORS[i % RAID_COLORS.length], cands });
    }
  });
  const keyGroups = new Map();
  S.raid.quests.map(id => D.byId[id]).filter(Boolean).forEach(t => {
    if (S.tasks[t.id] === 'done') return;
    for (const pk of keyPickups(t, key)) {
      if (!pk.spawn.points.length) continue;
      if (!keyGroups.has(pk.key.id)) {
        const kg = { t: { id: 'key:' + pk.key.id, name: '🔑 ' + pk.key.name, wikiLink: keyWikiLink(pk.wikiTitle) },
          o: { id: 'key:' + pk.key.id, type: 'pickup', description: `Pick up ${pk.key.name} — ${pk.spawn.note}` },
          color: '#ffd24a', cands: pk.spawn.points.map(p => ({ x: p.x, z: p.z, y: p.y })), keyId: pk.key.id };
        keyGroups.set(pk.key.id, kg);
        groups.push(kg);
      }
      for (const g of groups) if (g.t === t) g.needsKeys = [...new Set([...(g.needsKeys || []), pk.key.id])];
    }

}

// Precedence: bit mask of the key groups each group needs visited first.
const needMasks = groups => groups.map(g => (g.needsKeys || []).reduce((m, k) => { const i = groups.findIndex(x => x.keyId === k); return i >= 0 ? m | (1 << i) : m; }, 0));

function enforceKeyOrder(stops) {
  for (const ks of stops.filter(st => st.g.keyId)) {
    const ki = stops.indexOf(ks), di = stops.findIndex(st => (st.g.needsKeys || []).includes(ks.g.keyId));
    if (di >= 0 && di < ki) { stops.splice(ki, 1); stops.splice(di, 0, ks); }
  }

function raidExtractOptions(key) {
  const f = D.mapFeatures && D.mapFeatures[key];
  const seen = new Set();
  return (f ? f.extracts : []).filter(e => e.faction !== 'scav' && !seen.has(e.name) && seen.add(e.name));

// Shortest open path from the spawn through one spot of every stop group, ending at the best of the given extracts.
// Exact (Held–Karp over groups × candidate spots) when small enough, otherwise a heuristic with restarts.
const EXACT_ROUTE_LIMIT = 2e7; // ~ DP operations

// Legs crossing a minefield (not sniper zones) cost 3x, so the planner goes around them when there's a reasonable alternative.
let routeMinefields = [];
const cross = (a, b, c) => (b.x - a.x) * (c.z - a.z) - (b.z - a.z) * (c.x - a.x);
const segmentsCross = (p1, p2, q1, q2) => cross(p1, p2, q1) * cross(p1, p2, q2) < 0 && cross(q1, q2, p1) * cross(q1, q2, p2) < 0;
const insidePolygon = (p, poly) => {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a.z > p.z) !== (b.z > p.z) && p.x < (b.x - a.x) * (p.z - a.z) / (b.z - a.z) + a.x) inside = !inside;
  }
  return inside;
};
function crossesMinefield(a, b) {
  for (const poly of routeMinefields) {
    if (insidePolygon(a, poly) || insidePolygon(b, poly)) continue; // the stop itself is in it: unavoidable
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) if (segmentsCross(a, b, poly[i], poly[j])) return true;
  }
  return false;
}
const legCost = (a, b) => { const d = dist2(a, b); return routeMinefields.length && crossesMinefield(a, b) ? d * 3 : d; };

function planRoute(start, groups, ends) {
  if (!groups.length) {
    const e = ends.reduce((b, x) => (!b || legCost(start, x) < legCost(start, b) ? x : b), null);
    return { stops: [], total: e ? legCost(start, e) : 0, end: e };
  }
  const nodes = [];
  groups.forEach((g, gi) => g.cands.forEach(c => nodes.push({ gi, c })));
  const N = groups.length, M = nodes.length;
  if (N <= 16 && (1 << N) * M * M <= EXACT_ROUTE_LIMIT) return routeExact(start, groups, ends, nodes);
  let best = null;
  for (const e of ends) {
    const r = routeHeuristic(start, groups, e);
    if (!best || r.total < best.total) best = { ...r, end: e };
  }
  return best;
}

function routeExact(start, groups, ends, nodes) {
  const N = groups.length, M = nodes.length, FULL = (1 << N) - 1;
  const need = needMasks(groups);
  const dp = new Float64Array((FULL + 1) * M).fill(Infinity);
  const parent = new Int32Array((FULL + 1) * M).fill(-1);
  nodes.forEach((nd, j) => { if (!need[nd.gi]) dp[(1 << nd.gi) * M + j] = legCost(start, nd.c); });
  for (let mask = 1; mask <= FULL; mask++) {
    for (let j = 0; j < M; j++) {
      const v = dp[mask * M + j];
      if (v === Infinity) continue;
      for (let k = 0; k < M; k++) {
        const bit = 1 << nodes[k].gi;
        if (mask & bit) continue;
        if ((mask & need[nodes[k].gi]) !== need[nodes[k].gi]) continue; // its key isn't picked up yet
        const idx = (mask | bit) * M + k, nv = v + legCost(nodes[j].c, nodes[k].c);
        if (nv < dp[idx]) { dp[idx] = nv; parent[idx] = j; }
      }
    }
  }
  let best = { total: Infinity };
  for (const e of ends) {
    for (let j = 0; j < M; j++) {
      const v = dp[FULL * M + j] + legCost(nodes[j].c, e);
      if (v < best.total) best = { total: v, last: j, end: e };
    }
  }
  const seq = [];
  for (let mask = FULL, j = best.last; j >= 0;) {
    seq.push(j);
    const pj = parent[mask * M + j];
    mask &= ~(1 << nodes[j].gi);
    j = pj;
  }
  seq.reverse();
  return { stops: seq.map(j => ({ g: groups[nodes[j].gi], p: nodes[j].c })), total: best.total, end: best.end };
}

// Randomised nearest-neighbour starts, each improved by 2-opt, or-opt (move one stop) and spot re-selection.
function routeHeuristic(start, groups, end, restarts = 24) {
  let best = null;
  for (let r = 0; r < restarts; r++) {
    const stops = [], left = groups.slice(), got = new Set();
    let cur = start;
    while (left.length) {
      const opts = [];
      left.forEach((g, i) => { if ((g.needsKeys || []).every(k => got.has(k))) g.cands.forEach(c => opts.push({ i, c, d: legCost(cur, c) })); });
      if (!opts.length) left.forEach((g, i) => g.cands.forEach(c => opts.push({ i, c, d: legCost(cur, c) })));
      opts.sort((a, b) => a.d - b.d);
      const pick = r === 0 ? opts[0] : opts[Math.min(opts.length - 1, Math.floor(Math.random() * 3))];
      stops.push({ g: left[pick.i], p: pick.c });
      if (left[pick.i].keyId) got.add(left[pick.i].keyId);
      cur = pick.c;
      left.splice(pick.i, 1);
    }
    improveRoute(start, stops, end);
    enforceKeyOrder(stops);
    const total = routeLength(start, stops, end);
    if (!best || total < best.total) best = { stops, total };
  }
  return best;
}

function routeLength(start, stops, end) {
  let total = 0, prev = start;
  for (const st of stops) { total += legCost(prev, st.p); prev = st.p; }
  return total + legCost(prev, end);
}

function improveRoute(start, stops, end) {
  const at = i => (i < 0 ? start : i >= stops.length ? end : stops[i].p);
  for (let pass = 0; pass < 20; pass++) {
    let improved = false;
    for (let i = 0; i < stops.length - 1; i++) {
      for (let k = i + 1; k < stops.length; k++) {
        const delta = legCost(at(i - 1), at(k)) + legCost(at(i), at(k + 1)) - legCost(at(i - 1), at(i)) - legCost(at(k), at(k + 1));
        if (delta < -0.01) { stops.splice(i, k - i + 1, ...stops.slice(i, k + 1).reverse()); improved = true; }
      }
    }
    for (let i = 0; i < stops.length; i++) {
      const [moved] = stops.splice(i, 1);
      const base = routeLength(start, stops, end);
      let bestPos = i, bestCost = Infinity;
      for (let k = 0; k <= stops.length; k++) {
        const a = k === 0 ? start : stops[k - 1].p, b = k === stops.length ? end : stops[k].p;
        const cost = legCost(a, moved.p) + legCost(moved.p, b) - legCost(a, b);
        if (cost < bestCost - 0.01) { bestCost = cost; bestPos = k; }
      }
      stops.splice(bestPos, 0, moved);
      if (bestPos !== i && routeLength(start, stops, end) < base + bestCost + 0.01) improved = true;
    }
    stops.forEach((st, i) => {
      let bestP = st.p, cost = legCost(at(i - 1), st.p) + legCost(st.p, at(i + 1));
      for (const c of st.g.cands) { const v = legCost(at(i - 1), c) + legCost(c, at(i + 1)); if (v < cost - 0.01) { cost = v; bestP = c; } }
      if (bestP !== st.p) { st.p = bestP; improved = true; }
    });
    if (!improved) break;
  }
}

function raidRoute(key) {
  if (!S.raid || !S.raid.spawn) return null;
  const groups = raidStopGroups(key);
  const options = raidExtractOptions(key);
  const forced = S.raid.extract && S.raid.extract !== 'auto' ? options.filter(e => e.name === S.raid.extract) : [];
  const ends = forced.length ? forced : options.filter(e => e.faction === 'pmc');
  const sig = JSON.stringify([key, S.raid.spawn, S.raid.extract, groups.map(g => g.o.id)]);
  if (routeCache.sig === sig) return routeCache.route;
  const f = D.mapFeatures && D.mapFeatures[key];
  routeMinefields = f ? f.hazards.filter(h => h.type === 'minefield' && h.outline && h.outline.length > 2).map(h => h.outline.map(([x, z]) => ({ x, z }))) : [];
  const r = planRoute(S.raid.spawn, groups, ends.length ? ends : [S.raid.spawn]);
  // Report real walking distance, not the penalised planning cost.
  let total = 0, prev = S.raid.spawn;
  for (const st of r.stops) { total += dist2(prev, st.p); prev = st.p; }
  if (ends.length && r.end) total += dist2(prev, r.end);
  const minefieldLegs = [S.raid.spawn, ...r.stops.map(st => st.p), ...(ends.length && r.end ? [r.end] : [])].reduce((n, p, i, arr) => n + (i && crossesMinefield(arr[i - 1], p) ? 1 : 0), 0);
  const best = { stops: r.stops, total, extract: ends.length ? r.end : null, minefieldLegs };
  routeCache = { sig, route: best };
  return best;
}

function setSpawn(p) {
  pickingSpawn = false;
  S.raid.spawn = { x: Math.round(p.x * 10) / 10, z: Math.round(p.z * 10) / 10 };
  update();
}

function onRaidMapClick(e) {
  if (!pickingSpawn) return;
  const p = { x: e.latlng.lng, z: e.latlng.lat };
  const spawns = (D.mapFeatures && D.mapFeatures[raidMapKey] && D.mapFeatures[raidMapKey].spawns) || [];
  let best = null, bd = 30; // snap to a known spawn within 30 m
  for (const sp of spawns) { const d = dist2(p, sp); if (d < bd) { bd = d; best = sp; } }
  setSpawn(best || p);
}

function drawRoute(key) {
  raidRouteLayer.clearLayers();
  if (!S.raid.spawn) return;
  raidRouteLayer.addLayer(L.marker([S.raid.spawn.z, S.raid.spawn.x], { zIndexOffset: 1000,
    icon: L.divIcon({ className: 'map-label route-start', html: '<span class="dot"></span>Spawn', iconSize: null, iconAnchor: [7, 7] }) }));
  const r = raidRoute(key);
  if (!r) return;
  const path = [S.raid.spawn, ...r.stops.map(st => st.p), ...(r.extract ? [r.extract] : [])];
  raidRouteLayer.addLayer(L.polyline(path.map(p => [p.z, p.x]), { color: '#000', weight: 6, opacity: 0.5, interactive: false }));
  raidRouteLayer.addLayer(L.polyline(path.map(p => [p.z, p.x]), { color: '#fff', weight: 3, opacity: 0.9, dashArray: '8 6', interactive: false }));
  const def = D.mapDefs[key];
  r.stops.forEach((st, i) => {
    const fl = hasFloors(def) ? floorOf(def, st.p) : GROUND;
    const place = placeText(placeOf(def, st.p));
    const stop = L.marker([st.p.z, st.p.x], { zIndexOffset: 900,
      icon: L.divIcon({ className: 'route-num' + (fl !== raidFloor ? ' away' : ''), html: String(i + 1), iconSize: [20, 20] }) })
      .on('click', () => { if (fl !== raidFloor) { raidFloor = fl; render(); } });
    raidRouteLayer.addLayer(bindObjectiveTip(stop, st.g.t, st.g.o, key, `<b>${i + 1}. ${esc(st.g.t.name)}</b><br>${esc(st.g.o.description)}${place ? `<br><i>${esc(place)}</i>` : ''}`));
  });
  if (r.extract) raidRouteLayer.addLayer(L.marker([r.extract.z, r.extract.x], { zIndexOffset: 1000,
    icon: L.divIcon({ className: 'map-label route-end', html: `<span class="dot"></span>🏁 ${esc(r.extract.name)}`, iconSize: null, iconAnchor: [7, 7] }) }));
}

const pointY = st => st.p.y || 0;

function routePanel(key) {
  const options = raidExtractOptions(key);
  const select = `<select id="raidExtract"><option value="auto">Best PMC extract (auto)</option>${options.map(e =>
    `<option value="${esc(e.name)}" ${S.raid.extract === e.name ? 'selected' : ''}>${esc(e.name)}${e.faction === 'shared' ? ' (co-op)' : ''}</option>`).join('')}</select>`;
  const pick = `<button data-act="raidSpawnPick" class="${pickingSpawn ? 'primary' : ''}">${pickingSpawn ? 'Click your spawn on the map… (cancel)' : S.raid.spawn ? '📍 Change spawn' : '📍 Set spawn'}</button>`;
  let body;
  const r = raidRoute(key);
  if (!r) {
    body = '<div class="small muted">Press “Set spawn”, then click where you spawned (blue dots are PMC spawns). The tracker plans the shortest route through your objectives to the best extract.</div>';
  } else {
    let prev = S.raid.spawn;
    const steps = r.stops.map((st, i) => {
      const d = dist2(prev, st.p); prev = st.p;
      const place = placeText(placeOf(D.mapDefs[key], st.p.y === undefined ? { ...st.p, y: pointY(st) } : st.p));
      return `<div class="obj route-step" data-act="routeGo" data-id="${i}" title="Show on the map"><span class="route-num static">${i + 1}</span><div><div class="small"><span class="swatch" style="background:${st.g.color}"></span><b>${esc(st.g.t.name)}</b> <span class="muted">· ${Math.round(d)} m</span>${place ? ` <span class="badge">${esc(place)}</span>` : ''}</div>
        <div class="detail">${esc(st.g.o.description)}</div></div></div>`;
    });
    if (r.extract) steps.push(`<div class="obj"><span class="route-num static">🏁</span><div class="small"><b>Extract: ${esc(r.extract.name)}</b> <span class="muted">· ${Math.round(dist2(prev, r.extract))} m</span></div></div>`);
    body = `<div class="small">~<b>${Math.round(r.total).toLocaleString()} m</b> straight-line · ~${Math.max(1, Math.round(r.total / ROUTE_SPEED / 60))} min of moving · ${r.stops.length} stops</div>${steps.join('')}
      ${r.minefieldLegs ? `<div class="small" style="color:var(--bad)">⚠ ${r.minefieldLegs} leg${r.minefieldLegs > 1 ? 's' : ''} still cross a minefield — go around the red dashed area.</div>` : ''}
      <div class="small muted">Straight-line distances, routed around minefields where possible: walls, fences and floors aren't accounted for. Objectives without a fixed spot (kills, anywhere-on-map) aren't on the route — do them along the way.</div>`;
  }
  return `<div class="sec"><h4>Route</h4><div class="row">${pick}${S.raid.spawn ? '<button data-act="raidSpawnClear">Clear</button>' : ''}</div><div style="margin:6px 0">${select}</div>${body}</div>`;
}

function viewQuests() {
  const q = S.ui.search.trim().toLowerCase();
  const traders = D.traders.map(tr => `<option value="${tr.id}" ${S.ui.trader === tr.id ? 'selected' : ''}>${esc(tr.name)}</option>`).join('');
  const list = D.tasks.filter(t => {
    if (!factionOk(t) || !inFocus(t)) return false;
    if (S.ui.trader !== 'all' && (!t.trader || t.trader.id !== S.ui.trader)) return false;
    const st = taskState(t).status;
    if (!S.ui.showDone && (st === 'done' || st === 'failed')) return false;
    if (!S.ui.showLocked && st === 'locked') return false;
    if (!S.ui.showSkipped && isSkipped(t) && st !== 'done') return false;
    if (q && !t.name.toLowerCase().includes(q) && !t.objectives.some(o => (o.description || '').toLowerCase().includes(q))) return false;
    return true;
  }).sort((a, b) => (a.trader ? a.trader.name : '').localeCompare(b.trader ? b.trader.name : '') || (a.minPlayerLevel || 0) - (b.minPlayerLevel || 0));
  let html = `<div class="panel row">
      <input class="search" id="search" placeholder="Search quests / objectives…" value="${esc(S.ui.search)}">
      <select id="traderFilter"><option value="all">All traders</option>${traders}</select>
      <label><input type="checkbox" id="showLocked" ${S.ui.showLocked ? 'checked' : ''}> show locked</label>
      <label><input type="checkbox" id="showDone" ${S.ui.showDone ? 'checked' : ''}> show completed</label>
      <label><input type="checkbox" id="showSkipped" ${S.ui.showSkipped ? 'checked' : ''}> show won't do</label>
      <span class="spacer"></span><span class="muted">${list.length} quests</span>
    </div>`;
  let last = null;
  for (const t of list) {
    const tn = t.trader ? t.trader.name : '?';
    if (tn !== last) { html += `<div class="group-title">${esc(tn)}</div>`; last = tn; }
    html += taskCard(t);
  }
  return html;
}

// Quest, level, trader and hideout conditions are derived from progress; skills and stash money are ticked by hand.
const conditionAuto = c => !!((c.task && D.byId[c.task.id]) || c.playerLevel || (c.trader && c.level) || (c.type === 'hideoutStation' && c.station));

function conditionMet(c) {
  if (c.task && D.byId[c.task.id]) return !!S.tasks[c.task.id];
  if (c.playerLevel) return S.level >= c.playerLevel;
  if (c.trader && c.level) return (S.traders[c.trader.id] || 1) >= c.level;
  if (c.type === 'hideoutStation' && c.station) return stationBuilt(c.station.id, c.stationLevel);
  return !!S.pchecks[c.id];
}

function viewPrestige() {
  const p = currentPrestige();
  const pp = pathProgress();
  if (!p) return '<div class="panel muted">json.tarkov.dev has no prestige data for this game mode.</div>';
  const rows = p.conditions.map(c => {
    const met = conditionMet(c);
    const auto = conditionAuto(c);
    let extra = c.type === 'haveItem' ? 'Keep this in your stash when you press Prestige — it is consumed.' : objectiveDetail(c);
    if (c.type === 'hideoutStation') extra = 'Tick it in the Hideout tab; prerequisite levels are marked PRESTIGE there.';
    if (c.type === 'skill') extra = SKILL_TIPS[c.skillLevel.name] || 'Tick when your skill reaches this level.';
    if (c.task && D.byId[c.task.id]) {
      const t = D.byId[c.task.id];
      const sub = [...ancestorsOf([t.id])].map(id => D.byId[id]).filter(factionOk);
      const d = sub.filter(x => S.tasks[x.id]).length;
      extra = `Quest chain: ${d}/${sub.length} done · <a href="#" data-act="goto" data-id="${t.id}">open quest</a>`;
    }
    return `<tr class="${met ? 'complete' : ''}">
      <td>${auto ? (met ? '✅' : '⬜') : `<input type="checkbox" data-act="pcheck" data-id="${c.id}" ${met ? 'checked' : ''}>`}</td>
      <td>${esc(c.description)}<div class="small muted">${extra}</div></td>
      <td class="small muted">${auto ? 'auto' : 'tick manually'}</td>
    </tr>`;
  }).join('');
  const metCount = p.conditions.filter(conditionMet).length;
  return `<div class="panel">
      <div class="row"><b>${esc(p.name)}</b><span class="spacer"></span><span class="muted">${metCount} / ${p.conditions.length} requirements met</span></div>
      <div class="bar"><div style="width:${(100 * metCount / Math.max(1, p.conditions.length)).toFixed(1)}%"></div></div>
      <div class="small muted">Quest, level and hideout requirements tick automatically from your progress.${D.pathSet.size ? ` Required quest chain: ${pp.done}/${pp.total}.` : ''}</div>
    </div>
    <div class="panel"><table><thead><tr><th></th><th>Requirement</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="small muted">Tip: when you prestige, press “Start new prestige” — it archives this run and wipes quests/hideout/items like the game does.</div>`;
}

function levelBuildable(l) {
  const reasons = [];
  for (const r of l.stationLevelRequirements || []) {
    if (!r.station) continue;
    const st = D.stationById[r.station.id];
    const req = st && st.levels.find(x => x.level === r.level);
    if (req && !S.hideout[req.id]) reasons.push(`${r.station.name} ${r.level}`);
  }
  for (const r of l.traderRequirements || []) {
    if (r.requirementType === 'level' && r.trader && !cmp(S.traders[r.trader.id] || 1, r.compareMethod, r.value)) reasons.push(`${r.trader.name} LL${r.value}`);
  }
  return reasons;
}

function viewHideout() {
  const onPath = s => s.levels.some(l => D.hideoutPath.has(l.id) && !S.hideout[l.id]);
  const stations = [...D.hideoutStations]
    .filter(s => !S.ui.hideoutPrestigeOnly || onPath(s))
    .sort((a, b) => onPath(b) - onPath(a) || a.name.localeCompare(b.name));
  const cards = stations.map(s => {
    const levels = [...s.levels].sort((a, b) => a.level - b.level);
    const builtMax = Math.max(0, ...levels.filter(l => S.hideout[l.id]).map(l => l.level));
    let shown = S.ui.hideoutNextOnly ? levels.filter(l => !S.hideout[l.id]).slice(0, 1) : levels;
    if (S.ui.hideoutPrestigeOnly) shown = shown.filter(l => D.hideoutPath.has(l.id));
    const rows = shown.map(l => {
      const built = !!S.hideout[l.id];
      const blockers = levelBuildable(l);
      const items = l.itemRequirements.map(r => {
        const have = S.have[r.item.id] || 0;
        return `<span title="have ${have}">${itemChip(r.item, r.count, r.foundInRaid)}${have >= r.count ? '✓' : ''}</span>`;
      }).join('');
      const skills = (l.skillRequirements || []).map(x => `${esc(x.name)} ${x.level}`).join(', ');
      const traders = (l.traderRequirements || []).map(x => `${esc(x.trader.name)} LL${x.value}`).join(', ');
      return `<div class="lvl ${built ? 'built' : ''}">
        <label><input type="checkbox" data-act="hideout" data-id="${l.id}" ${built ? 'checked' : ''}> <b>Level ${l.level}</b></label>
        ${D.hideoutPath.has(l.id) && !built ? '<span class="badge path">PRESTIGE</span>' : ''}
        ${built ? '<span class="badge ok">built</span>' : blockers.length ? `<span class="badge lock">needs ${esc(blockers.join(', '))}</span>` : '<span class="badge ok">can build</span>'}
        ${l.constructionTime ? `<span class="badge">${Math.round(l.constructionTime / 3600 * 10) / 10}h</span>` : ''}
        <div>${items || '<span class="muted small">no items</span>'}</div>
        ${skills ? `<div class="small muted">Skills: ${skills}</div>` : ''}
        ${traders ? `<div class="small muted">Traders: ${traders}</div>` : ''}
      </div>`;
    }).join('');
    return `<div class="panel station"><h3>${esc(s.name)} <span class="muted small">${builtMax}/${levels.length}</span></h3>${rows || '<div class="muted small">Fully built</div>'}</div>`;
  }).join('');
  return `<div class="panel row">
      <label><input type="checkbox" id="hideoutNextOnly" ${S.ui.hideoutNextOnly ? 'checked' : ''}> show next level only</label>
      <label><input type="checkbox" id="hideoutPrestigeOnly" ${S.ui.hideoutPrestigeOnly ? 'checked' : ''}> only levels needed for prestige</label>
      <span class="spacer"></span><span class="small muted">Ticking a level marks lower levels built too. Item counts use your “have” numbers from the Items tab.</span>
    </div><div class="grid2">${cards}</div>`;
}

function neededItems() {
  const need = new Map();
  const add = (it, count, fir, source) => {
    const key = it.id;
    const e = need.get(key) || { item: it, count: 0, fir: 0, sources: [] };
    e.count += count;
    if (fir) e.fir += count;
    e.sources.push(source);
    need.set(key, e);
  };
  // With no required quest chain, listing items for every quest in the game is noise — only count quests available now.
  const onlyAvailable = S.focus === 'prestige' && !D.pathSet.size;
  for (const t of D.tasks) {
    if (!factionOk(t) || !inFocus(t) || S.tasks[t.id] || isSkipped(t)) continue;
    if (onlyAvailable && taskState(t).status !== 'available') continue;
    for (const o of t.objectives) {
      // Only hand-in objectives consume items; "find" objectives are usually paired with a hand-in.
      if (S.objs[o.id] || o.optional || !o.items || !o.items.length || !['giveItem', 'plantItem'].includes(o.type)) continue;
      add(o.items[0], o.count || 1, o.foundInRaid, `${t.name}${o.items.length > 1 ? ' (alternatives ok)' : ''}`);
    }
  }
  if (S.ui.itemsHideout !== 'none') {
    for (const s of D.hideoutStations) for (const l of s.levels) {
      if (S.hideout[l.id] || (S.ui.itemsHideout === 'prestige' && !D.hideoutPath.has(l.id))) continue;
      for (const r of l.itemRequirements) add(r.item, r.count, r.foundInRaid, `${s.name} ${l.level}`);
    }
  }
  return [...need.values()];
}

function viewItems() {
  const q = S.ui.search.trim().toLowerCase();
  let list = neededItems();
  if (S.ui.itemsHideDone) list = list.filter(e => (S.have[e.item.id] || 0) < e.count);
  if (q) list = list.filter(e => e.item.name.toLowerCase().includes(q));
  list.sort((a, b) => b.fir - a.fir || b.count - a.count);
  const rows = list.map(e => {
    const have = S.have[e.item.id] || 0;
    return `<tr class="${have >= e.count ? 'complete' : ''}">
      <td>${itemChip(e.item)}</td>
      <td><b>${e.count.toLocaleString()}</b>${e.fir ? `<div class="small"><span class="badge fir">${e.fir.toLocaleString()} FIR</span></div>` : ''}</td>
      <td><button data-act="have" data-id="${e.item.id}" data-d="-1">−</button>
          <input type="number" min="0" data-act="haveSet" data-id="${e.item.id}" value="${have}">
          <button data-act="have" data-id="${e.item.id}" data-d="1">+</button></td>
      <td class="small muted">${esc(e.sources.join(' · '))}</td>
    </tr>`;
  }).join('');
  return `<div class="panel row">
      <input class="search" id="search" placeholder="Search items…" value="${esc(S.ui.search)}">
      <label class="muted">Hideout <select id="itemsHideout">${[['prestige', 'prestige levels only'], ['all', 'all unbuilt levels'], ['none', 'none']].map(([k, v]) => `<option value="${k}" ${S.ui.itemsHideout === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <label><input type="checkbox" id="itemsHideDone" ${S.ui.itemsHideDone ? 'checked' : ''}> hide items I have enough of</label>
      <span class="spacer"></span><span class="small muted">${S.focus === 'prestige' && !D.pathSet.size ? 'Quest items: only quests available now. ' : 'Quest items follow the Focus setting. '}FIR = found in raid — don't sell these.</span>
    </div>
    <div class="panel"><table><thead><tr><th>Item</th><th>Need</th><th>Have</th><th>For</th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="muted">Nothing needed 🎉</td></tr>'}</tbody></table></div>`;
}

// ---------- shell ----------
function render() {
  memo = new Map();
  document.getElementById('lvl').value = S.level;
  document.getElementById('faction').value = S.faction;
  document.getElementById('mode').value = S.mode;
  document.getElementById('focus').value = S.focus;
  document.getElementById('prestigeNo').textContent = `Prestige ${S.prestige} → ${S.prestige + 1}`;
  for (const b of document.querySelectorAll('#tabs button')) b.classList.toggle('on', b.dataset.tab === S.ui.tab);
  if (!D) return;
  const v = { raid: viewRaid, next: viewNext, quests: viewQuests, prestige: viewPrestige, hideout: viewHideout, items: viewItems, story: viewStory, completed: viewCompleted }[S.ui.tab] || viewNext;
  const focused = document.activeElement && document.activeElement.id;
  const caret = focused === 'search' ? document.activeElement.selectionStart : null;
  document.getElementById('view').innerHTML = v();
  document.documentElement.style.setProperty('--hdr', document.querySelector('header').offsetHeight + 'px');
  renderSide();
  document.getElementById('raidTab').textContent = S.raid ? '● Raid in progress' : 'Raid planner';
  if (S.ui.tab === 'raid' && S.raid) attachRaidMap();
  if (focused === 'search') {
    const el = document.getElementById('search');
    if (el) { el.focus(); el.setSelectionRange(caret, caret); }
  }
}

// Everything needed to finish the quests currently accepted in game (from the game logs).
function acceptedNeeds() {
  const quests = D.tasks.filter(t => S.active[t.id] && !S.tasks[t.id] && !isSkipped(t));
  const items = new Map();
  const add = (it, count, fir, quest, note) => {
    const e = items.get(it.id) || { item: it, count: 0, fir: 0, quests: [] };
    e.count += count;
    if (fir) e.fir += count;
    e.quests.push(note ? `${quest} (${note})` : quest);
    items.set(it.id, e);
  };
  const keys = new Map();
  for (const t of quests) {
    for (const o of t.objectives) {
      if (S.objs[o.id] || o.optional) continue;
      if ((o.type === 'giveItem' || o.type === 'plantItem') && o.items && o.items.length) {
        add(o.items[0], o.count || 1, o.foundInRaid, t.name, [o.type === 'plantItem' ? 'plant' : '', o.items.length > 1 ? 'alternatives ok' : ''].filter(Boolean).join(', '));
      }
      if (o.type === 'mark' && o.markerItem) add(o.markerItem, 1, false, t.name, 'mark');
      if (o.type === 'buildWeapon' && o.item) add(o.item, 1, false, t.name, 'build — see wiki for parts');
    }
    for (const k of t.neededKeys || []) {
      const id = k.keys.map(x => x.id).join('|');
      const e = keys.get(id) || { keys: k.keys, map: k.map, quests: [] };
      e.quests.push(t.name);
      keys.set(id, e);
    }
  }
  return { quests, items: [...items.values()], keys: [...keys.values()] };
}

function renderSide() {
  const layout = document.getElementById('layout');
  const raidScreen = S.ui.tab === 'raid' && !!S.raid;
  layout.classList.toggle('side-hidden', !S.ui.sideOpen || raidScreen);
  document.body.classList.toggle('side-off', !S.ui.sideOpen);
  document.getElementById('sideShow').style.display = S.ui.sideOpen ? 'none' : 'inline-block';
  const side = document.getElementById('side');
  if (raidScreen) document.getElementById('sideShow').style.display = 'none';
  if (!D || !S.ui.sideOpen || raidScreen) { side.innerHTML = ''; return; }
  const { quests, items, keys } = acceptedNeeds();
  const head = `<div class="row"><b>Accepted quests</b><span class="muted small">${quests.length} active</span><span class="spacer"></span>
    <button class="small" data-act="sideToggle" title="Hide sidebar">◂</button></div>`;
  if (!S.logSync) {
    side.innerHTML = `<div class="panel">${head}<div class="small muted" style="margin-top:6px">Press “Sync from game” to load the quests you've accepted in game.</div></div>`;
    return;
  }
  items.sort((a, b) => (b.fir > 0) - (a.fir > 0) || a.item.name.localeCompare(b.item.name));
  const missing = items.filter(e => (S.have[e.item.id] || 0) < e.count).length;
  const rows = items.map(e => {
    const have = S.have[e.item.id] || 0;
    return `<div class="side-item ${have >= e.count ? 'complete' : ''}" title="${esc(e.quests.join('\n'))}">
      ${e.item.iconLink ? `<img loading="lazy" src="${esc(e.item.iconLink)}" alt="">` : ''}
      <div class="info"><div class="small">${esc(e.item.name)}${e.fir ? ' <span class="badge fir">FIR</span>' : ''}</div><div class="for">${esc(e.quests.join(' · '))}</div></div>
      <div class="count"><button data-act="have" data-id="${e.item.id}" data-d="-1">−</button> <b>${have}/${e.count.toLocaleString()}</b> <button data-act="have" data-id="${e.item.id}" data-d="1">+</button></div>
    </div>`;
  }).join('');
  const keyRows = keys.map(k => `<div class="side-item" title="${esc(k.quests.join('\n'))}">
      ${k.keys[0].iconLink ? `<img loading="lazy" src="${esc(k.keys[0].iconLink)}" alt="">` : ''}
      <div class="info"><div class="small">${k.keys.map(x => esc(x.name)).join(' or ')}</div><div class="for">${k.map ? esc(k.map.name) + ' · ' : ''}${esc(k.quests.join(' · '))}</div></div></div>`).join('');
  const questList = quests.map(t => `<a href="#" data-act="goto" data-id="${t.id}">${esc(t.name)}</a>`).join(' · ');
  side.innerHTML = `<div class="panel">${head}
    <div class="sec"><h4>Items to hand in / use (${missing} still needed)</h4>${rows || '<div class="small muted">No items needed for your accepted quests.</div>'}</div>
    ${keyRows ? `<div class="sec"><h4>Keys</h4>${keyRows}</div>` : ''}
    <div class="sec small"><h4>Quests</h4>${questList || '<span class="muted">None accepted</span>'}</div>
    <div class="small muted" style="margin-top:8px">Counts use the same “have” numbers as the Items tab. Tick an objective on a quest card to drop its items.</div>
  </div>`;
}

function renderTraderLL() {
  const box = document.getElementById('traderLL');
  if (!D) return;
  box.innerHTML = D.traders.map(tr => `<label class="muted">${esc(tr.name)} LL <select data-trader="${tr.id}">${[1, 2, 3, 4].map(n => `<option ${(S.traders[tr.id] || 1) === n ? 'selected' : ''}>${n}</option>`).join('')}</select>
    rep <input type="number" step="0.01" data-rep="${tr.id}" value="${S.rep[tr.id] || 0}" style="width:70px"></label>`).join('')
    + '<span class="small muted">Loyalty level and reputation as shown on the trader screen — quests check both.</span>';
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3000);
}

function update() { save(); render(); }

document.getElementById('layout').addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const { act, id } = el.dataset;
  if (act === 'toggle') {
    if (e.target.closest('input,a,button')) return;
    openTasks.has(id) ? openTasks.delete(id) : openTasks.add(id);
    render();
  } else if (act === 'done') {
    e.stopPropagation();
    const n = setTaskDone(id, el.checked);
    if (n) toast(`Also marked ${n} prerequisite quest${n > 1 ? 's' : ''} done`);
    update();
  } else if (act === 'obj') {
    el.checked ? (S.objs[id] = true) : delete S.objs[id];
    update();
  } else if (act === 'goto') {
    e.preventDefault();
    openTasks.add(id);
    const t = D.byId[id];
    S.ui.tab = 'quests'; S.ui.search = t.name; S.ui.trader = 'all'; S.ui.showDone = true; S.ui.showLocked = true; S.ui.showSkipped = true;
    if (!inFocus(t)) S.focus = 'all';
    update();
  } else if (act === 'skip') {
    const t = D.byId[id];
    if (S.skipped[id]) delete S.skipped[id];
    else {
      S.skipped[id] = true;
      toast(`“${t.name}” marked won't do${D.pathSet.has(id) ? ' — note: your prestige needs it' : ''}`);
    }
    update();
  } else if (act === 'snooze') {
    S.snoozed[id] ? delete S.snoozed[id] : (S.snoozed[id] = true);
    update();
  } else if (act === 'keyToggle') {
    e.preventDefault();
    S.have[id] = haveKey({ id }) ? 0 : 1;
    update();
  } else if (act === 'friendAdd') {
    const box = document.getElementById('friendCode');
    importFriendCode(box.value).then(r => { toast(`Added ${r.name}: ${r.active} active, ${r.done} done`); update(); })
      .catch(err => toast('Could not read code: ' + err.message));
  } else if (act === 'friendRemove') {
    if (!confirm(`Remove ${id}?`)) return;
    delete S.friends[id];
    S.squad = S.squad.filter(n => n !== id);
    raidSelection = null;
    update();
  } else if (act === 'squadToggle') {
    S.squad = el.checked ? [...new Set([...S.squad, id])] : S.squad.filter(n => n !== id);
    raidSelection = null;
    update();
  } else if (act === 'myCode') {
    myFriendCode().then(code => navigator.clipboard.writeText(code)).then(() => toast('Your sync code is on the clipboard'))
      .catch(err => toast('Could not copy: ' + err.message));
  } else if (act === 'raidPick') {
    S.ui.raidMap = id;
    update();
  } else if (act === 'raidSel') {
    el.checked ? raidSelection.ids.add(id) : raidSelection.ids.delete(id);
    render();
  } else if (act === 'raidStart') {
    S.raid = { map: S.ui.raidMap, quests: [...raidSelection.ids], startedAt: new Date().toISOString() };
    raidFloor = GROUND;
    update();
  } else if (act === 'raidSpawnPick') {
    pickingSpawn = !pickingSpawn;
    render();
  } else if (act === 'raidSpawnClear') {
    S.raid.spawn = null;
    pickingSpawn = false;
    update();
  } else if (act === 'routeGo') {
    const key = S.raid.map, def = D.mapDefs[key], r = raidRoute(key), st = r && r.stops[Number(id)];
    if (!st) return;
    if (hasFloors(def)) raidFloor = floorOf(def, st.p);
    if (raidMap) raidMap.setView([st.p.z, st.p.x], Math.max(raidMap.getZoom(), def.maxZoom - 1));
    render();
  } else if (act === 'raidFull') {
    if (raidMapEl && raidMapEl.requestFullscreen) raidMapEl.requestFullscreen();
  } else if (act === 'raidEnd') {
    if (raidMap) { raidMap.remove(); raidMap = null; raidMapKey = null; }
    S.raid.debrief = true;
    update();
    syncFromGame(false);
  } else if (act === 'raidClose' || act === 'raidCancel') {
    if (act === 'raidCancel' && !confirm('Cancel this raid plan?')) return;
    const r = S.raid;
    S.raid = null;
    raidSelection = null;
    if (raidMap) { raidMap.remove(); raidMap = null; raidMapKey = null; }
    update();
    if (act === 'raidClose') {
      const done = r.quests.filter(id => S.tasks[id] === 'done').length;
      toast(`Raid saved — ${done}/${r.quests.length} quests completed`);
    }
  } else if (act === 'sideToggle') {
    S.ui.sideOpen = false;
    update();
  } else if (act === 'syncApply') {
    if (id !== 'cancel' && pendingSync) {
      const auto = document.getElementById('autoSync');
      applyGameProgress(pendingSync, id === 'replace');
      S.logSync.auto = auto ? auto.checked : true;
      toast(`Applied game progress (${id})`);
    }
    pendingSync = null;
    update();
  } else if (act === 'chapter') {
    e.preventDefault();
    openChapters.add(id);
    S.ui.tab = 'story';
    update();
  } else if (act === 'chapterAll') {
    openChapters.has(id) ? openChapters.delete(id) : openChapters.add(id);
    render();
  } else if (act === 'chapterStart') {
    el.checked ? (S.storyStarted[id] = true) : delete S.storyStarted[id];
    update();
  } else if (act === 'storyUpTo') {
    const c = D.chapterOfStep[id];
    // Optional steps are often branch-specific, so only main steps are filled in.
    for (const o of c.objectives) { if (!o.optional || o.id === id) S.story[o.id] = true; if (o.id === id) break; }
    S.storyStarted[c.id] = true;
    update();
  } else if (act === 'story') {
    el.checked ? (S.story[id] = true) : delete S.story[id];
    update();
  } else if (act === 'gate') {
    S.gates[id] = true;
    toast(`Unlocked ${D.gateGroups[id].length} quests`);
    update();
  } else if (act === 'map') {
    S.ui.map = id; update();
  } else if (act === 'pcheck') {
    el.checked ? (S.pchecks[id] = true) : delete S.pchecks[id];
    update();
  } else if (act === 'hideout') {
    const l = D.levelById[id];
    for (const x of l.station.levels) {
      if (el.checked && x.level <= l.level) S.hideout[x.id] = true;
      if (!el.checked && x.level >= l.level) delete S.hideout[x.id];
    }
    update();
  } else if (act === 'have') {
    S.have[id] = Math.max(0, (S.have[id] || 0) + Number(el.dataset.d));
    update();
  }
});

document.getElementById('layout').addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'haveSet') { S.have[el.dataset.id] = Math.max(0, Number(el.value) || 0); update(); return; }
  const flags = ['showDone', 'showLocked', 'showSkipped', 'hideoutNextOnly', 'hideoutPrestigeOnly', 'itemsHideDone', 'ignoreGates'];
  if (flags.includes(el.id)) { S.ui[el.id] = el.checked; update(); }
  if (el.id === 'traderFilter') { S.ui.trader = el.value; update(); }
  if (el.id === 'itemsHideout') { S.ui.itemsHideout = el.value; update(); }
  if (el.id === 'sortSel') { S.ui.sort = el.value; update(); }
  if (el.id === 'raidExtract' && S.raid) { S.raid.extract = el.value; update(); }
  if (el.id === 'myName') { S.myName = el.value.trim(); save(); }
  if ((el.id === 'friendLogFiles' || el.id === 'friendLogDir') && el.files.length) {
    toast('Reading log files…');
    importFriendLogs([...el.files]).then(msg => { toast(msg); update(); }).catch(err => toast('Could not import logs: ' + err.message));
  }
});

document.getElementById('layout').addEventListener('input', e => {
  if (e.target.id === 'friendName') { friendNameDraft = e.target.value; return; }
  if (e.target.id === 'search') { S.ui.search = e.target.value; update(); }
});

document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) { S.ui.tab = b.dataset.tab; S.ui.search = ''; update(); }
});
document.getElementById('lvl').addEventListener('change', e => { S.level = Math.max(1, Math.min(79, Number(e.target.value) || 1)); update(); });
document.getElementById('faction').addEventListener('change', e => { S.faction = e.target.value; update(); });
document.getElementById('focus').addEventListener('change', e => { S.focus = e.target.value; update(); });
document.getElementById('mode').addEventListener('change', e => { S.mode = e.target.value; save(); boot(false); });
document.getElementById('traderBtn').addEventListener('click', () => { const b = document.getElementById('traderLL'); b.hidden = !b.hidden; renderTraderLL(); });
document.getElementById('traderLL').addEventListener('change', e => {
  const { trader, rep } = e.target.dataset;
  if (trader) S.traders[trader] = Number(e.target.value);
  if (rep) S.rep[rep] = Number(e.target.value) || 0;
  if (trader || rep) update();
});
document.getElementById('refreshBtn').addEventListener('click', () => boot(true));
document.getElementById('syncBtn').addEventListener('click', () => syncFromGame(true));
document.getElementById('layout').addEventListener('dragover', e => { if (e.target.id === 'friendCode' || e.target.id === 'friendLogDrop') e.preventDefault(); });
document.getElementById('layout').addEventListener('drop', e => {
  if (e.target.id !== 'friendLogDrop' || !e.dataTransfer.files.length) return;
  e.preventDefault();
  toast('Reading log files…');
  importFriendLogs([...e.dataTransfer.files]).then(msg => { toast(msg); update(); }).catch(err => toast('Could not import logs: ' + err.message));
});
document.getElementById('layout').addEventListener('drop', async e => {
  if (e.target.id !== 'friendCode' || !e.dataTransfer.files.length) return;
  e.preventDefault();
  e.target.value = await e.dataTransfer.files[0].text();
});
document.getElementById('sideShow').addEventListener('click', () => { S.ui.sideOpen = true; update(); });
setInterval(() => { if (S.logSync && S.logSync.auto && !pendingSync) syncFromGame(false); }, AUTO_SYNC_MS);

document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tarkov-progress-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    const d = defaultState();
    S = { ...d, ...s, ui: { ...d.ui, ...(s.ui || {}) } };
    save(); computeSets(); render(); toast('Progress imported');
  } catch (err) { toast('Import failed: ' + err.message); }
  e.target.value = '';
});

document.getElementById('prestigeBtn').addEventListener('click', () => {
  if (!confirm(`Start prestige ${S.prestige + 1}? This clears quests, objectives, hideout, item counts and trader levels (your current run is archived in the export file).`)) return;
  S.history.push({ prestige: S.prestige, finishedAt: new Date().toISOString(), questsDone: Object.keys(S.tasks).length });
  S.prestige += 1;
  Object.assign(S, { level: 1, tasks: {}, objs: {}, hideout: {}, have: {}, pchecks: {}, traders: {}, gates: {}, story: {}, storyStarted: {}, rep: {}, active: {} });
  save(); computeSets(); renderTraderLL(); render();
  toast(`Good luck on prestige ${S.prestige + 1}`);
});

async function boot(force) {
  document.getElementById('view').innerHTML = '<div class="loading">Loading quest data from tarkov.dev…</div>';
  try {
    D = indexData(await loadData(force));
    computeSets();
    renderTraderLL();
    render();
    if (force) toast('Data refreshed');
    if (!S.logSync || S.logSync.auto) syncFromGame(false);
  } catch (e) {
    D = null;
    document.getElementById('view').innerHTML = `<div class="panel">Couldn't load data from tarkov.dev: ${esc(e.message)}<br><br><button class="primary" onclick="boot(true)">Retry</button></div>`;
  }
}

render();
boot(false);
</script>
</body>
</html>
